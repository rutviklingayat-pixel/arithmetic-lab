formed an equilateral triangle with sides of length 24 km. When the slower ship travelled 8 km, the triangle formed by the new positions of the two ships and the port became right-angled. When the faster ship reaches the port, the distance, in km, between the other ship and the port will be","h":"The 60 deg angle at the port forces the right angle at the faster ship, giving the speed ratio.","yr":2022,"y":"CAT 2022 · Slot 3","l":4,"x":"After the slow ship moves 8 km it is 16 km from the port, with the 60° angle still at the port.\nThe right angle must be at the faster ship (else its distance would be $32>24$), so its distance $=16\times\frac{1}{2}=8$ km (cos 60°).\nFaster ship travelled 16 km while the slower travelled 8: speeds $2:1$.\nWhen the faster covers 24 km, the slower covers 12, leaving $24-12=12$ km.\nAnswer: 12","o":["8","12","6","4"],"ai":1,"a":"12"},{"n":194,"c":"TSD","f":"TSD-S3","t":"M","s":"Two cars travel from different locations at constant speeds. To meet each other after starting at the same time, they take 1.5 hours if they travel towards each other, but 10.5 hours if they travel in the same direction. If the speed of the slower car is 60 km/hr, then the distance traveled, in km, by the slower car when it meets the other car while traveling towards each other, is","h":"Distance / sum of speeds = 1.5 and distance / difference = 10.5 give the faster speed.","yr":2022,"y":"CAT 2022 · Slot 3","l":3,"x":"Same gap $D$: $D=1.5(a+60)=10.5(a-60)$, where $a$ is the faster speed.\n$1.5a+90=10.5a-630$, so $a=80$ km/h.\nThe question only needs the slower car’s run till meeting: $60\\times1.5=90$ km.\nAnswer: 90","o":["150","100","90","120"],"ai":2,"a":"90"},{"n":195,"c":"TSD","f":"TSD-S3","t":"T","s":"Arvind travels from town A to town B, and Surbhi from town B to town A, both starting at the same time along the same route. After meeting each other, Arvind takes 6 hours to reach town B while Surbhi takes 24 hours to reach town A. If Arvind travelled at a speed of 54 km/h, then the distance, in km, between town A and town B is","h":"Speed ratio sqrt(24/6) = 2; meeting time sqrt(6*24).","yr":2023,"y":"CAT 2023 · Slot 1","l":2,"x":"If they meet after $t$ hours, $t^2=$ product of the after-meeting times $=6\\times24$, so $t=12$.\nArvind’s whole journey takes $12+6=18$ h.\nDistance $=54\\times18=972$ km.\nAnswer: 972","a":"972"},{"n":196,"c":"TSD","f":"TSD-S3","t":"M","s":"Ravi is driving at a speed of 40 km/h on a road. Vijay is 54 meters behind Ravi and driving in the same direction as Ravi. Ashok is driving along the same road from the opposite direction at a speed of 50 km/ h and is 225 meters away from Ravi. The speed, in km/h, at which Vijay should drive so that all the three cross each other at the same time, is","h":"Time to Ravi-Ashok meeting = 225 m / (40+50) km/h; Vijay must close 54 m on Ravi in that time.","yr":2023,"y":"CAT 2023 · Slot 2","l":4,"x":"Ravi and Ashok close at $90$ km/h $=25$ m/s, so they meet in $\\frac{225}{25}=9$ s.\nVijay must gain 54 m on Ravi in 9 s: $6$ m/s $=21.6$ km/h faster.\nVijay’s speed $=40+21.6=61.6$ km/h.\nAnswer: 61.6","o":["58.8","64.4","67.2","61.6"],"ai":3,"a":"61.6"},{"n":197,"c":"TSD","f":"TSD-S3","t":"M","s":"Two places A and B are 45 kms apart and connected by a straight road. Anil goes from A to B while Sunil goes from B to A. Starting at the same time, they cross each other in exactly 1 hour 30 minutes. If Anil reaches B exactly 1 hour 15 minutes after Sunil reaches A, the speed of Anil, in km per hour, is","h":"Use speed sum 30 km/h and the 1.25 h difference in individual journey times.","yr":2024,"y":"CAT 2024 · Slot 1","l":3,"x":"They cross in 1.5 h, so speeds add to $\\frac{45}{1.5}=30$ km/h.\nWith Anil at $a$: $\\frac{45}{a}-\\frac{45}{30-a}=1.25$.\nTry $a=12$: $3.75-2.5=1.25$. Fits.\nAnil’s speed $=12$ km/h.\nAnswer: 12","o":["16","14","12","18"],"ai":2,"a":"12"},{"n":198,"c":"TSD","f":"TSD-S4","t":"M","s":"Two persons are walking beside a railway track at respective speeds of 2 and 4 km per hour in the same direction. A train came from behind them and crossed them in 90 and 100 seconds, respectively. The time, in seconds, taken by the train to cross an electric post is nearest to","h":"Train length = (v-2)x90 = (v-4)x100 gives v; post time = length/v.","yr":2020,"y":"CAT 2020 · Slot 1","l":3,"x":"The train’s length $L$ is what it gains on each walker during the crossing.\n$L=(v-2)\\times90=(v-4)\\times100$ (speeds in km/h, time in s), so $10v=220$, $v=22$ km/h.\n$L=20\\times90=1800$ (same units); a post is crossed in $\\frac{1800}{22}\\approx81.8$ s.\nNearest is 82.\nAnswer: 82","o":["87","82","78","75"],"ai":1,"a":"82"},{"n":199,"c":"TSD","f":"TSD-S4","t":"M","s":"Two trains cross each other in 14 seconds when running in opposite directions along parallel tracks. The faster train is 160 m long and crosses a lamp post in 12 seconds. If the speed of the other train is 6 km/hr less than the faster one, its length, in m, is","h":"Faster speed from lamp post; crossing distance = sum of lengths at relative speed.","yr":2021,"y":"CAT 2021 · Slot 1","l":3,"x":"Faster train: $\\frac{160}{12}=\\frac{40}{3}$ m/s $=48$ km/h; the other runs at 42 km/h $=\\frac{35}{3}$ m/s.\nOpposite directions: relative speed $=\\frac{40}{3}+\\frac{35}{3}=25$ m/s.\nIn 14 s they cover both lengths: $25\\times14=350$ m.\nOther train $=350-160=190$ m.\nAnswer: 190","o":["184","180","190","192"],"ai":2,"a":"190"},{"n":200,"c":"TSD","f":"TSD-S4","t":"M","s":"Two trains A and B were moving in opposite directions, their speeds being in the ratio 5 : 3. The front end of A crossed the rear end of B 46 seconds after the front ends of the trains had crossed each other. It took another 69 seconds for the rear ends of the trains to cross each other. The ratio of length of train A to that of train B is","h":"Front-to-rear crossing covers B's length; rear-ends crossing at 115 s covers both lengths.","yr":2021,"y":"CAT 2021 · Slot 2","l":4,"x":"Relative speed $=5k+3k=8k$.\nFront of A to rear of B (46 s): they cover $L_B$, so $L_B=8k\\times46$.\nRear ends cross at $46+69=115$ s: $L_A+L_B=8k\\times115$, so $L_A=8k\\times69$.\n$L_A:L_B=69:46=3:2$.\nAnswer: 3 : 2","o":["2 : 3","2 : 1","5 : 3","3 : 2"],"ai":3,"a":"3 : 2"},{"n":201,"c":"TSD","f":"TSD-S5","t":"M","s":"A man travels by a motor boat down a river to his office and back. With the speed of the river unchanged, if he doubles the speed of his motor boat, then his total travel time gets reduced by 75%. The ratio of the original speed of the motor boat to the speed of the river is:","h":"Round trip time 2bd/(b^2-r^2); new time with 2b equals one-fourth of old.","yr":2017,"y":"CAT 2017 · Slot 1","l":3,"x":"Round trip of $d$ each way: $\\frac{d}{b+r}+\\frac{d}{b-r}=\\frac{2bd}{b^2-r^2}$.\nCutting time by $75\\%$ leaves one-fourth: $\\frac{4bd}{4b^2-r^2}=\\frac{1}{4}\\cdot\\frac{2bd}{b^2-r^2}$.\n$8(b^2-r^2)=4b^2-r^2$, so $4b^2=7r^2$.\n$b:r=\\sqrt{7}:2$.\nAnswer: √7 : 2","o":["√6 : √2","√7 : 2","2√5 : 3","3 : 2"],"ai":1,"a":"√7 : 2"},{"n":202,"c":"TSD","f":"TSD-S5","t":"T","s":"Moody takes 30 seconds to finish riding an escalator if he walks on it at his normal speed in the same direction. He takes 20 seconds to finish riding the escalator if he walks at twice his normal speed in the same direction. If Moody decides to stand still on the escalator, then the time, in seconds, needed to finish riding the escalator is","h":"Two equations in escalator speed and walking speed show they are equal.","yr":2022,"y":"CAT 2022 · Slot 3","l":3,"x":"Escalator length $L$ is fixed: $L=30(w+e)=20(2w+e)$ with walking speed $w$, escalator speed $e$.\n$30w+30e=40w+20e$ gives $e=w$.\n$L=30\\times2e=60e$, so standing still takes $60$ seconds.\nAnswer: 60","a":"60"},{"n":203,"c":"TSD","f":"TSD-S5","t":"M","s":"A boat takes 2 hours to travel downstream a river from port A to port B, and 3 hours to return to port A. Another boat takes a total of 6 hours to travel from port B to port A and return to port B. If the speeds of the boats and the river are constant, then the time, in hours, taken by the slower boat to travel from port A to port B is","h":"First boat gives river speed = d/12; solve quadratic for second boat's speed, then downstream time.","yr":2023,"y":"CAT 2023 · Slot 3","l":4,"x":"Take $AB=12$. Boat 1: $b+r=6$, $b-r=4$, so river $r=1$ (and $b=5$).\nBoat 2: $\\frac{12}{c-1}+\\frac{12}{c+1}=6$, so $c^2-4c-1=0$ and $c=2+\\sqrt{5}\\approx4.24<5$: the slower boat.\nA to B is downstream: $\\frac{12}{3+\\sqrt{5}}=\\frac{12(3-\\sqrt{5})}{4}=3(3-\\sqrt{5})$ h.\nAnswer: 3(3-√5)","o":["3(3-√5)","12(√5-2)","3(3+√5)","3(√5-1)"],"ai":0,"a":"3(3-√5)"},{"n":204,"c":"TSD","f":"TSD-S6","t":"T","s":"In a 10 km race. A, B, and C, each running at uniform speed, get the gold, silver, and bronze medals, respectively. If A beats B by 1 km and B beats C by 1 km, then by how many metres does A beat C?","h":"Speeds scale: C runs 9/10 of what B runs, B runs 9/10 of what A runs.","yr":2017,"y":"CAT 2017 · Slot 2","l":2,"x":"When A runs 10 km, B runs 9 km; when B runs 10 km, C runs 9 km, so C runs $\\frac{9}{10}$ of B.\nWhile A runs 10 km, C runs $9\\times\\frac{9}{10}=8.1$ km.\nA beats C by $1.9$ km $=1900$ m.\nAnswer: 1900","a":"1900"},{"n":205,"c":"TSD","f":"TSD-S6","t":"T","s":"In a race of three horses, the first beat the second by 11 metres and the third by 90 metres. If the second beat the third by 80 metres, what was the length, in metres, of the racecourse?","h":"The ratio first:third equals (first:second) x (second:third).","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"Let the course be $L$. When the first finishes, the second is at $L-11$; the third at $L-90$.\nSecond-to-third ratio is $\\frac{L-80}{L}$, so third $=(L-11)\\cdot\\frac{L-80}{L}=L-90$.\n$L^2-91L+880=L^2-90L$, so $L=880$ m.\nAnswer: 880","a":"880"},{"n":206,"c":"TSD","f":"TSD-S6","t":"M","s":"Two ants A and B start from a point P on a circle at the same time, with A moving clock-wise and B moving anti-clockwise. They meet for the first time at 10:00 am when A has covered 60% of the track. If A returns to P at 10:12 am, then B returns to P at","h":"A's remaining 40% took 12 min, so start time and B's 40% time follow.","yr":2019,"y":"CAT 2019 · Slot 2","l":2,"x":"A covered $60\\%$ by 10:00 and the remaining $40\\%$ in 12 min, so $60\\%$ took 18 min: start was 9:42.\nB covered the other $40\\%$ in those 18 min, so B needs $\\frac{60}{40}\\times18=27$ min for the remaining $60\\%$.\nB returns to P at 10:27 am.\nAnswer: 10:27 am","o":["10:27 am","10:25 am","10:45 am","10:18 am"],"ai":0,"a":"10:27 am"},{"n":207,"c":"TSD","f":"TSD-S6","t":"T","s":"John jogs on track A at 6 kmph and Mary jogs on track B at 7.5 kmph. The total length of tracks A and B is 325 metres. While John makes 9 rounds of track A, Mary makes 5 rounds of track B. In how many seconds will Mary make one round of track A?","h":"Equal times give 9a/6 = 5b/7.5, combine with a+b = 325.","yr":2019,"y":"CAT 2019 · Slot 2","l":3,"x":"Same time: $\\frac{9a}{6}=\\frac{5b}{7.5}$, i.e. $b=\\frac{9}{4}a$.\n$a+\\frac{9}{4}a=325$ gives $a=100$ m, $b=225$ m.\nMary’s speed $=7.5$ km/h $=\\frac{25}{12}$ m/s.\nOne round of A: $100\\div\\frac{25}{12}=48$ s.\nAnswer: 48","a":"48"},{"n":208,"c":"TSD","f":"TSD-S6","t":"M","s":"In a car race, car A beats car B by 45 km, car B beats car C by 50 km, and car A beats car C by 90 km. The distance (in km) over which the race has been conducted is","h":"Write C's distance when A finishes as D(D-45)(D-50)/D^2 and equate to D-90.","yr":2020,"y":"CAT 2020 · Slot 2","l":3,"x":"When A finishes $D$, B is at $D-45$. B to C ratio is $\\frac{D-50}{D}$.\nSo C is at $\\frac{(D-45)(D-50)}{D}=D-90$.\n$D^2-95D+2250=D^2-90D$, so $D=450$ km.\nAnswer: 450","o":["550","475","500","450"],"ai":3,"a":"450"},{"n":209,"c":"TSD","f":"TSD-S6","t":"M","s":"Two circular tracks T1 and T2 of radii 100 m and 20 m, respectively touch at a point A. Starting from A at the same time, Ram and Rahim are walking on track T1 and track T2 at speeds 15 km/hr and 5 km/hr respectively. The number of full rounds that Ram will make before he meets Rahim again for the first time is","h":"Ratio of lap times (circumference/speed) and their LCM.","yr":2020,"y":"CAT 2020 · Slot 2","l":4,"x":"They can meet only at A, so find when both are back at A together.\nLap times: Ram $\\frac{200π}{15}=\\frac{40π}{3}$, Rahim $\\frac{40π}{5}=8π=\\frac{24π}{3}$ (same units).\nLCM of 40 and 24 is 120, so Ram completes $\\frac{120}{40}=3$ rounds.\nAnswer: 3","o":["5","3","4","2"],"ai":1,"a":"3"},{"n":210,"c":"TSD","f":"TSD-S6","t":"M","s":"Anil, Sunil, and Ravi run along a circular path of length 3 km, starting from the same point at the same time, and going in the clockwise direction. If they run at speeds of 15 km/hr, 10 km/hr, and 8 km/hr, respectively, how much distance in km will Ravi have run when Anil and Sunil meet again for the first time at the starting point?","h":"Meeting at the start needs the LCM of Anil's and Sunil's lap times.","yr":2020,"y":"CAT 2020 · Slot 3","l":3,"x":"Lap times: Anil $\\frac{3}{15}$ h $=12$ min, Sunil $\\frac{3}{10}$ h $=18$ min.\nBoth are at the start together after LCM$(12,18)=36$ min $=0.6$ h.\nRavi runs $8\\times0.6=4.8$ km.\nAnswer: 4.8","o":["4.6","4.2","4.8","5.2"],"ai":2,"a":"4.8"},{"n":211,"c":"TSD","f":"TSD-S6","t":"T","s":"Mira and Amal walk along a circular track, starting from the same point at the same time. If they walk in the same direction, then in 45 minutes, Amal completes exactly 3 more rounds than Mira. If they walk in opposite directions, then they meet for the first time exactly after 3 minutes. The number of rounds Mira walks in one hour is","h":"Difference of speeds = 3 rounds/45 min, sum = 1 round/3 min.","yr":2021,"y":"CAT 2021 · Slot 3","l":3,"x":"Measure speeds in rounds per minute.\nSame direction: Amal gains 3 rounds in 45 min, so $a-m=\\frac{1}{15}$.\nOpposite: together one round in 3 min, so $a+m=\\frac{1}{3}$.\n$m=\\frac{1}{2}\\left(\\frac{1}{3}-\\frac{1}{15}\\right)=\\frac{2}{15}$; in 60 min Mira walks $8$ rounds.\nAnswer: 8","a":"8"}]};</script>

const boxes = ms => { let s = Math.max(0, Math.floor(ms / 1000)); const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), x = s % 60, p = v => String(v).padStart(2, "0");
  const L = d ? [[d, "days"], [h, "hrs"], [m, "min"]] : [[h, "hrs"], [m, "min"], [x, "sec"]]; return L.map(([v, n]) => `<span><b>${p(v)}</b><i>${n}</i></span>`).join(""); };

function confetti() {
  if (calm()) return;
  const c = document.createElement("canvas"); c.className = "cft"; document.body.appendChild(c);
  const W = c.width = innerWidth, H = c.height = innerHeight, x = c.getContext("2d"), cols = ["#e36f12", "#2a5bc7", "#1f8a4c", "#6b46c1", "#f4c542"];
  const P2 = Array.from({length: 150}, () => ({x: W / 2 + (Math.random() - .5) * W * .35, y: H * .32, vx: (Math.random() - .5) * 13, vy: -Math.random() * 13 - 4, s: 5 + Math.random() * 5, r: Math.random() * 6, c: cols[Math.random() * 5 | 0]}));

    if (++f < 120) requestAnimationFrame(step); else c.remove(); }; step();

    requestAnimationFrame(st); setTimeout(fin, 1600); });
}

function record(k, r) { const a = S.att[k] || {n: 0}; S.att[k] = {r: r.r, t: Math.round(r.t), at: Date.now(), n: a.n + 1, h: r.hint ? 1 : 0}; save(); }

// ---------- ladder ----------
function ladder() {
  let h = `<div class="phead"><div><h1>Ladder</h1><p class="sub">Each chapter is a five-rung ladder built from the 600 practice questions. A level opens once you clear the one below it: at least ${Math.round(BT.cfg.pass * 100)}% correct, inside the level's total time. Each level is one sitting with answers at the end, and you can retake it as often as you like.</p></div></div>`;
  h += `<div class="card"><div class="scroll"><div class="lad"><span></span>${[1, 2, 3, 4, 5].map(l => `<span class="hd">L${l} · ${LVN[l].toUpperCase()}</span>`).join("")}`;
  D.ch.forEach(([c, nm]) => { h += `<span class="cn">${esc(nm)}</span>`;
    for (let l = 1; l <= 5; l++) { const st = (S.ladder[c] || {})[l], n = D.grid[c][l - 1], have = cellQ(c, l).length, ready = have === n, open = ready && (l === 1 || ((S.ladder[c] || {})[l - 1] || {}).cleared);
      h += `<button class="tile ${st && st.cleared ? "done" : (open ? "open" : "lock")}" data-c="${c}" data-l="${l}" ${open || (st && st.cleared) ? "" : "disabled"}>${st && st.cleared ? "✓ Cleared" : (open ? "Open" : (ready ? "Locked" : have + " of " + n + " out"))}<br>${st ? st.correct + "/" + n : n + " Q"}</button>`; } });
  view(h + `</div></div><div class="legend"><span><i style="background:var(--blbg);border:1px solid var(--bl)"></i>Open: take it now</span><span><i style="background:var(--okbg);border:1px solid var(--ok)"></i>Cleared (best score shown; retake any time)</span><span><i style="background:var(--nv)"></i>Locked: clear the level below</span></div></div>`);
  $("view").querySelectorAll(".tile").forEach(b => b.onclick = () => { const c = b.dataset.c, l = +b.dataset.l, keys = cellQ(c, l).map(q => "B" + q.n);
    play(keys, {title: chName(c) + " · Level " + l, set: true, kind: "ladder", tag: {chapter: c, level: l}, lad: {c, l}}); });
}
// ---------- PYQs ----------
function pyq() {
  const years = [...new Set(P.map(q => q.yr))].sort();
  const fams = Object.entries(D.fam).filter(([k]) => P.some(q => q.f === k) && (!F.pch.length || F.pch.includes(D.famch[k]))); keep(F.pfam, k => fams.some(f => f[0] === k));
  const L = P.filter(q => (!F.pch.length || F.pch.includes(q.c)) && (!F.pfam.length || F.pfam.includes(q.f)) && (!F.pyear.length || F.pyear.includes(q.yr)) && stOK("P" + q.n, F.pst));
  const take = F.pcount ? Math.min(F.pcount, L.length) : L.length;
  const done = P.filter(q => S.att["P" + q.n]).length;
  view(`<div class="phead"><div><h1>CAT PYQs, 2017 to 2024</h1><p class="sub" style="margin:0">${P.length} actual CAT arithmetic questions, sorted into the same chapters and question families as the practice bank.</p></div></div>
  <div class="pgrid"><div class="card">
  <h3>Chapters <span style="font-weight:700;letter-spacing:0;text-transform:none">· none picked means all</span></h3>${chipset("pc", D.ch, F.pch)}
  <h3>Years <span style="font-weight:700;letter-spacing:0;text-transform:none">· pick any · none means all</span></h3>${chipset("py", years.map(y => [y, "CAT " + y]), F.pyear)}
  <h3>Question families <span style="font-weight:700;letter-spacing:0;text-transform:none">· pick any</span></h3>${chipset("pf", fams.map(([k, v]) => [k, esc(v)]), F.pfam)}
  <h3>Status <span style="font-weight:700;letter-spacing:0;text-transform:none">· pick any</span></h3>${chipset("pst", STAT, F.pst)}
  <h3>How many</h3>${chipset("pn", [[10, "10"], [22, "22"], [0, "All that match"]], [F.pcount])}</div>
  <aside class="card sum"><div class="lbl">Your set</div><div class="big">${take}</div><p class="small" style="margin:4px 0 6px">${L.length} match your choices.</p><p class="small" style="margin:0 0 16px">You have attempted ${done} of ${P.length}.</p>
   <button class="btn big wide" id="pg" ${L.length ? "" : "disabled"}>${L.length ? "Start " + take + " question" + (take === 1 ? "" : "s") : "No questions match"}</button></aside></div>`);
  bind("pc", F.pch, pyq); one("pn", 0, v => F.pcount = v, pyq);
  bind("pf", F.pfam, pyq); bind("py", F.pyear, pyq); bind("pst", F.pst, pyq);
  $("pg").onclick = () => { let K = L.map(q => "P" + q.n); if (F.pcount) K = shuffle(K).slice(0, F.pcount); play(K, {title: setName("CAT PYQs", F.pch, [listOf(F.pyear, y => y, "years"), listOf(F.pfam, k => k, "families"), F.pst.map(x => STAT.find(z => z[0] === x)[1].toLowerCase()).join(" or ")], K.length), kind: "pyq"}); };
}
// ---------- leaderboards ----------
async function boards() {
  const head = () => `<div class="phead"><div><h1>Pit wall</h1><p class="sub">The championship, today's timing, your division, the teams, and the weekly boards.</p></div></div>
   <div class="row" style="justify-content:space-between;margin-bottom:14px"><div class="seg" id="bw">${[["champ", "Championship"], ["daily", "Timing"], ["div", "Division"], ["teams", "Teams"], ["week", "This week"], ["acc", "Accuracy"], ["streak", "Streak"]].map(([k, n]) => `<button class="${BF.which === k ? "on" : ""}" data-v="${k}">${n}</button>`).join("")}</div>
   <div class="chips" id="bs" ${BF.which === "div" || BF.which === "teams" ? "hidden" : ""}>${[["all", "Everyone"], ["batch", "My batch · " + esc(SES.batch)]].map(([k, n]) => `<button class="chip ${BF.scope === k ? "on" : ""}" data-v="${k}">${n}</button>`).join("")}</div></div>`;
  const wire = () => { one("bw", 0, v => { BF.which = v; }, boards); one("bs", 0, v => { BF.scope = v; }, boards); };
  const today = Math.min(Math.max(BT.day.d, 0), 30), want = BF.day && BF.day < BT.day.d ? BF.day : 0;
  if (!BD || Date.now() - BDat > 60000 || (BD.want || 0) !== want) {
    view(head() + `<div class="card"><p class="lead"><span class="spin"></span>Fetching the boards…</p></div>`); wire();
    const x = await api("boards", want ? {day: want} : {});
    if (!SES || tab !== "boards") return;
    if (!x.ok) { view(head() + `<div class="card"><p class="lead">${esc(x.err)}</p><button class="btn" id="rt">Try again</button></div>`); wire(); $("rt").onclick = boards; return; }
    BD = x; BD.want = want; BDat = Date.now(); BT.my = x.my; if (x.race) BT.race = x.race.me; noteWk();
  }
  const w = BF.which, RC = BD.race || {}, b = BD.boards[w] ? BD.boards[w][BF.scope] : null; let h = head() + `<div class="card">`;
  const finalHour = BT.cfg.hour + ":" + String(Math.ceil((BT.cfg.minutes * 60 + 90) / 60)).padStart(2, "0");
  if (w === "champ") {
    const cb = RC.champ ? RC.champ[BF.scope] : null;
    h += !RC.F ? `<p class="lead">The championship opens once Day 1 is final, at ${finalHour} the morning after. Points: 25, 18, 15, 12, 10, 8, 6, 4, 2, 1 for the top ten each day, +1 for the fastest lap.</p>`
      : `<div class="chd"><span class="lbl">Drivers' championship · after Day ${RC.F} of 30</span></div>` + (RC.me && RC.me.pos ? `<p class="gapl" style="margin-top:0">${gapLine(RC.me)}</p>` + moveLine(RC.me) : "")
        + boardTable(cb, ["Pts", "Wins", "Podiums"], r => `<td><b>${r[2]}</b></td><td>${r[3]}</td><td>${r[4]}</td>`)
        + `<p class="small">Daily finishing position pays 25, 18, 15, 12, 10, 8, 6, 4, 2, 1 to the top ten, and the fastest correct answer to the day's hardest question earns +1. Only Daily 15 papers finished inside the time limit are classified. A day is final at ${finalHour} the next morning.</p>`;
  } else if (w === "teams") {
    const T = RC.teams || {};
    h += !T.active ? `<p class="lead">The Teams' Championship starts by itself once ${T.after || 3} days are final${RC.F ? ` (${RC.F} so far)` : ""}. Each batch is a team; its two best Daily 15 scores each day decide its finishing place.</p>`
      : `<div class="chd"><span class="lbl">Teams' championship · after Day ${RC.F}</span></div><div class="scroll"><table><tr><th class="l">#</th><th class="l">Team</th><th>Pts</th><th>Wins</th><th>Marks</th><th>Day ${RC.F}</th></tr>`
        + T.rows.map((r, i) => `<tr class="${r[0] === T.mine ? "me" : ""}"><td class="l"><span class="rk ${i < 3 ? "g" + (i + 1) : ""}">${i + 1}</span></td><td class="l">${esc(r[0])}${r[0] === T.mine ? " (your team)" : ""}</td><td><b>${r[1]}</b></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[4] === null ? "–" : r[4]}</td></tr>`).join("") + `</table></div>`
        + `<p class="small">Each day the teams are placed by the sum of their two best classified scores and score 25, 18, 15… like drivers. Bigger batches get no advantage: only the best two count.</p>`;
  } else if (w === "div") {
    const V = RC.div || {};
    h += !V.active ? `<p class="lead">Divisions start by themselves once ${V.after || 7} days are final${RC.F ? ` (${RC.F} so far)` : ""}. Everyone who has finished a paper is placed by championship position into divisions of about ten. Every 7 days the top 3 of each division move up and the bottom 3 move down.</p>`
      : `<div class="chd"><span class="lbl">${V.name} of ${V.n} · round ${V.round} · days ${V.s}–${V.e}</span><span class="small">${V.done} of ${V.e - V.s + 1} days final</span></div>`
        + (V.member ? "" : `<p class="small">You join the lowest division at the start of the next round.</p>`)
        + `<div class="scroll"><table><tr><th class="l">#</th><th class="l">Name</th><th>Batch</th><th>Round pts</th><th>Marks</th><th></th></tr>`
        + V.rows.map((r, i) => `<tr class="${r[5] ? "me" : ""} z-${r[4] || "n"}"><td class="l"><span class="rk">${i + 1}</span></td><td class="l">${esc(r[0])}${r[5] ? " (you)" : ""}</td><td>${esc(r[1])}</td><td><b>${r[2]}</b></td><td>${r[3]}</td><td>${r[4] === "up" ? "▲ up" : r[4] === "down" ? "▼ down" : ""}</td></tr>`).join("") + `</table></div>`
        + `<p class="small">Inside a division, each day pays 25, 18, 15… by finishing place among its members. When the round's 7 days are final, ▲ moves up a division and ▼ moves down.</p>`;
  } else if (w === "daily") {
    const d = BD.day;
    h += d < 1 ? `<p class="lead">The Daily 15 has not started yet.</p>` : `<div class="row" style="margin:0 0 12px"><button class="btn alt sm" id="dp" ${d > 1 ? "" : "disabled"} aria-label="Previous day">‹</button><b>Day ${d}${d === BT.day.d ? ` · <span class="live">LIVE TIMING</span>` : ` · <span class="fin">FINAL</span>`}</b><button class="btn alt sm" id="dn" ${d < today ? "" : "disabled"} aria-label="Next day">›</button></div>`
      + (RC.final && RC.final.d === d ? `<div class="podium">${[1, 0, 2].map(k => RC.final.podium[k] ? `<div class="pd p${k + 1}"><span>${esc(RC.final.podium[k][0])}</span><b>${RC.final.podium[k][3]}</b><i>${pos(RC.final.podium[k][2])}</i></div>` : "").join("")}</div>`
        + (RC.final.fl ? `<p class="flapl"><span class="flap">Fastest lap</span> ${esc(RC.final.fl.name)} · question ${RC.final.fl.slot} (Level ${RC.final.fl.l}) in ${fmt(RC.final.fl.sec)} · +1 pt</p>` : "") : "")
      + boardTable(b, ["Score", "Time"], r => `<td><b>${r[2]}</b></td><td>${fmt(r[3])}</td>`) + `<p class="small">Score out of 45. Ties go to the faster paper. Papers finished after the time limit get a drive-through penalty: marked, not classified. ${d === BT.day.d ? `Live timing: positions can change until the round closes; the result is final at ${finalHour} tomorrow.` : ""}</p>`;
  } else if (w === "week") h += boardTable(b, ["Points", "New questions"], r => `<td><b>${r[2]}</b></td><td>${r[3]}</td>`) + `<p class="small">Monday to Sunday. +3 for a correct answer and −1 for a wrong MCQ, on the first time you meet a question anywhere on the site. Repeats earn nothing, so guessing and redoing do not pay.</p>`;
  else if (w === "acc") h += boardTable(b, ["Accuracy", "New questions"], r => `<td><b>${r[2]}%</b></td><td>${r[3]}</td>`) + `<p class="small">Your first try at questions that were new to you this week, across Daily 15, Practice, PYQs and the Ladder. Redoing a question does not change it. You appear here after ${BD.accMin} new questions in the week${b.me ? "" : "; you are at " + BD.my.nf}.</p>`;
  else h += boardTable(b, ["Days in a row", "Points this week"], r => `<td><b>${r[2]}</b></td><td>${r[3]}</td>`) + `<p class="small">Consecutive days with a Daily 15 submitted. Miss a day and the streak restarts.</p>`;
  view(h + `<p class="small">Boards refresh about once a minute. <a href="#" id="br">Refresh now</a></p></div>`); wire();
  $("br").onclick = e => { e.preventDefault(); BD = null; boards(); };
  if ($("dp")) { $("dp").onclick = () => { BF.day = BD.day - 1; boards(); }; $("dn").onclick = () => { BF.day = BD.day + 1 >= BT.day.d ? 0 : BD.day + 1; boards(); }; }
}
// ---------- log ----------
function log() {
  let h = `<div class="phead"><div><h1>My log</h1><p class="sub">Where you are strong, why you lose marks, and what to redo.</p></div></div>
   <div class="card"><div class="lbl">Accuracy by chapter and level · practice bank</div><p class="small" style="margin:-4px 0 10px">Each practice-bank question counts once, at your latest result, so redoing a wrong one fixes it here. The accuracy on Home and on the Leaderboard is different: it counts only your <b>first try</b> at questions new to you <b>this week</b>.</p><div class="scroll"><table><tr><th class="l">Chapter</th>${[1, 2, 3, 4, 5].map(l => "<th>L" + l + "</th>").join("")}<th>All</th></tr>`;
  D.ch.forEach(([c, nm]) => { h += `<tr><td class="l"><b>${esc(nm)}</b></td>`; let A = 0, C = 0, N = 0;
    for (let l = 1; l <= 5; l++) { const n = D.grid[c][l - 1], at = PRB.filter(q => q.c === c && q.l === l && S.att["B" + q.n]), ok = at.filter(q => S.att["B" + q.n].r === 1).length; A += at.length; C += ok; N += n;
      h += `<td><span class="hc ${shade(ok, at.length)}">${at.length ? Math.round(100 * ok / at.length) + "%" : "–"}</span><br><span class="small">${at.length}/${n}</span></td>`; }
    h += `<td><b>${A ? Math.round(100 * C / A) + "%" : "–"}</b><br><span class="small">${A}/${N}</span></td></tr>`; });
  h += "</table></div>";
  const live = k => !!Q(k);
  const wrong = Object.keys(S.att).filter(k => S.att[k].r === 0 && live(k)), marks = Object.keys(S.mark).filter(live);
  const slow = Object.keys(S.att).filter(k => k[0] === "B" && live(k) && S.att[k].r === 1 && S.att[k].t > TARGET[Q(k).l]);
  const pq = Object.keys(S.att).filter(k => k[0] === "P"), pok = pq.filter(k => S.att[k].r === 1).length;
  h += `<p class="small" style="margin-top:10px">CAT PYQs attempted: ${pq.length} of ${P.length}${pq.length ? ", " + Math.round(100 * pok / pq.length) + "% correct" : ""}. Daily sets done: ${Object.values(S.daily).filter(x => x.done).length} of 30. Daily 15 questions met: ${Object.keys(S.att).filter(k => k[0] === "B" && +k.slice(1) <= NDAILY).length} of ${NDAILY}.</p></div>`;
  const wv = Object.values(S.why), wt = wv.length;
  h += `<div class="hgrid" style="margin-top:18px"><div class="card"><div class="chd"><span class="lbl">Why you lose marks</span><span class="small">${wt} wrong answer${wt === 1 ? "" : "s"} tagged</span></div>`;
  if (wt) { const top = WHY.map(([c, n]) => [n, wv.filter(v => v === c).length]).sort((a, b) => b[1] - a[1]);
    h += top.map(([n, k]) => `<div class="wbar"><span>${n}</span><span><i style="width:${100 * k / wt}%"></i></span><b>${Math.round(100 * k / wt)}%</b></div>`).join("")
      + `<p class="small" style="margin:10px 0 0"><b style="color:var(--ink)">${top[0][0]}</b> costs you the most marks. ${{Concept: "Go back to the chapter notes before the next set.", Calculation: "Write one more line of working; it is cheaper than a −1.", "Silly mistake": "Before you lock an answer, re-read your last line and the option you picked.", "Misread the question": "Underline what is asked before you solve.", "Ran out of time": "Skip sooner: if it is not moving in a minute, mark it and move on."}[top[0][0]]}</p>`; }
  else h += `<p class="small" style="margin:0">After a wrong answer, tap what went wrong: concept, calculation, silly mistake, misread or time. After a few sets this shows the pattern behind your lost marks.</p>`;
  h += `</div><div class="card"><div class="chd"><span class="lbl">Recent sets</span><span class="small">on this device</span></div><div class="hist">`;
  const hs = S.hist.filter(x => x.daily ? S.daily[x.daily] && S.daily[x.daily].rev : x.items);
  h += hs.length ? hs.slice(0, 8).map((x, j) => { const sc = x.daily ? S.daily[x.daily].score + "/45" : x.set ? x.score + "/" + x.max : x.correct + "/" + x.total;
      return `<button class="qa" data-h="${S.hist.indexOf(x)}"><span class="ic" style="background:var(--blbg);color:var(--bld)">${sc}</span><span><b>${esc(x.title)}</b><small>${x.at ? dateIST(x.at) : ""}</small></span><span class="ch">›</span></button>`; }).join("")
    : `<p class="small" style="margin:0">Sets you finish appear here, with their analysis and review.</p>`;
  h += `</div></div></div>
   <h3>To redo</h3><div class="stats" style="grid-template-columns:repeat(auto-fit,minmax(220px,1fr))">
    <button class="qa" id="lw" ${wrong.length ? "" : "disabled"}><span class="ic" style="background:var(--badbg);color:var(--badd)">${wrong.length}</span><span><b>Wrong last time</b><small>Redo them now</small></span><span class="ch">›</span></button>
    <button class="qa" id="ls" ${slow.length ? "" : "disabled"}><span class="ic" style="background:var(--hintbg);color:var(--warn)">${slow.length}</span><span><b>Right but over target</b><small>Get faster on these</small></span><span class="ch">›</span></button>
    <button class="qa" id="lm" ${marks.length ? "" : "disabled"}><span class="ic" style="background:var(--purbg);color:var(--pur)">${marks.length}</span><span><b>Saved to My log</b><small>Questions you starred</small></span><span class="ch">›</span></button></div>
   <p class="small">Your attempts are saved to your account, so the table follows you to any device. Saved questions, reasons and recent sets stay on this device.</p>`;
  view(h);
  $("view").querySelectorAll("[data-h]").forEach(b => b.onclick = () => { const x = S.hist[+b.dataset.h]; if (x.daily) dailyResult(x.daily); else results(x, {back: "log"}); });
  $("lw").onclick = () => play(wrong, {title: "Redo: wrong last time", kind: "redo"}); $("ls").onclick = () => play(slow, {title: "Redo: over target", kind: "redo"}); $("lm").onclick = () => play(marks, {title: "Saved questions", kind: "redo"});
}
