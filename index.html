he first n innings. In these n innings, his average score was 30 runs and lowest score was x runs. The smallest possible value of x is","h":"Find n from total runs; then give the other n - 1 innings the cap of 37 each.","yr":2020,"y":"CAT 2020 · Slot 3","l":4,"x":"$29(n+2)=30n+38+15$ gives $n=5$; the first 5 innings total $150$.\nTo make the lowest as small as possible, make the other four as large as allowed: $37$ each ($148$).\nLowest $x=150-148=2$.\nAnswer: 2","o":["1","3","2","4"],"ai":2,"a":"2"},{"n":92,"c":"AVG","f":"AVG-A3","t":"T","s":"The arithmetic mean of scores of 25 students in an examination is 50. Five of these students top the examination with the same score. If the scores of the other students are distinct integers with the lowest being 30, then the maximum possible score of the toppers is","h":"Minimise the other 20 scores as 30, 31, ..., 49 and give the rest to the 5 toppers.","yr":2021,"y":"CAT 2021 · Slot 3","l":4,"x":"Total $=25\\times50=1250$.\nMaximise the toppers by minimising the other 20: distinct integers from $30$: $30+31+...+49=790$.\nToppers total $460$, each $\\frac{460}{5}=92$.\nAnswer: 92","a":"92"},{"n":93,"c":"AVG","f":"AVG-A3","t":"M","s":"The average of three integers is 13. When a natural number n is included, the average of these four integers remains an odd integer. The minimum possible value of n is","h":"39 + n must be 4 times an odd number.","yr":2022,"y":"CAT 2022 · Slot 1","l":2,"x":"Sum of the three $=39$. Need $\\frac{39+n}{4}$ to be an odd integer, so $39+n$ is $4\\times$ an odd number.\nSuch values: $...,36,44,52,...$; with $n\\ge1$ the least is $44$.\n$n=44-39=5$.\nAnswer: 5","o":["3","4","5","1"],"ai":2,"a":"5"},{"n":94,"c":"AVG","f":"AVG-A3","t":"M","s":"Five students, including Amit, appear for an examination in which possible marks are integers between 0 and 50, both inclusive. The average marks for all the students is 38 and exactly three students got more than 32. If no two students got the same marks and Amit got the least marks among the five students, then the difference between the highest and lowest possible marks of Amit is","h":"Three scores in 33-50, Amit and one more ≤ 32; extreme the top three to bound Amit's pair sum.","yr":2022,"y":"CAT 2022 · Slot 2","l":4,"x":"Total $=190$. Three students score above $32$; Amit and one other score at most $32$, Amit lower.\nHighest Amit: the other is $32$, Amit $31$ (top three then total $127$, e.g. $40,43,44$).\nLowest Amit: top three as large as possible, $50+49+48=147$, leaving $43$ for two; with the other at most $32$, Amit $\\ge11$.\nDifference $=31-11=20$.\nAnswer: 20","o":["21","24","20","22"],"ai":2,"a":"20"},{"n":95,"c":"AVG","f":"AVG-A3","t":"T","s":"The average of a non-decreasing sequence of N numbers a1, a2, …, aN is 300. If a1 is replaced by 6a1, the new average becomes 400. Then, the number of possible values of a1 is","h":"5a1 = 100N gives a1 = 20N; non-decreasing means a1 ≤ the average.","yr":2022,"y":"CAT 2022 · Slot 2","l":4,"x":"Replacing $a_1$ by $6a_1$ adds $5a_1$ to the total, raising it by $100N$: $a_1=20N$.\n$a_1$ is the smallest term, so $a_1\\le300$: $N\\le15$.\n$N=1$ fails ($a_1$ would be both $20$ and $300$), so $N=2$ to $15$.\n$14$ values.\nAnswer: 14","a":"14"},{"n":96,"c":"AVG","f":"AVG-A3","t":"M","s":"Consider six distinct natural numbers such that the average of the two smallest numbers is 14, and the average of the two largest numbers is 28. Then, the maximum possible value of the average of these six numbers is","h":"Maximise the middle two just below the 5th number, with the 5th as large as allowed by e + f = 56, e < f.","yr":2022,"y":"CAT 2022 · Slot 3","l":4,"x":"Smallest two total $28$, largest two total $56$; maximise the middle two, which must be below the 5th number.\n5th and 6th total $56$ with 5th $<$ 6th, so 5th $\\le27$.\nMiddle two at most $25+26=51$ (and above the 2nd, e.g. $13,15$).\nAverage $=\\frac{28+51+56}{6}=\\frac{135}{6}=22.5$.\nAnswer: 22.5","o":["22.5","23.5","24","23"],"ai":0,"a":"22.5"},{"n":97,"c":"AVG","f":"AVG-A3","t":"M","s":"In an examination, the average marks of 4 girls and 6 boys is 24. Each of the girls has the same marks while each of the boys has the same marks. If the marks of any girl is at most double the marks of any boy, but not less than the marks of any boy, then the number of possible distinct integer values of the total marks of 2 girls and 6 boys is","h":"From 4g + 6b = 240 and b ≤ g ≤ 2b find the range of g; required total = 240 - 2g.","yr":2023,"y":"CAT 2023 · Slot 1","l":4,"x":"$4g+6b=240$ with $b\\le g\\le2b$.\n$g\\ge b$: $6g\\ge240-4g$, $g\\ge24$. $g\\le2b$: $3g\\le240-4g$, $g\\le\\frac{240}{7}\\approx34.3$.\nRequired total $2g+6b=240-2g$, so we count integers $2g$ in $[48,68.57]$.\n$2g=48,...,68$: $21$ values.\nAnswer: 21","o":["19","21","20","22"],"ai":1,"a":"21"},{"n":98,"c":"AVG","f":"AVG-A4","t":"T","s":"A CAT aspirant appears for a certain number of tests. His average score increases by 1 if the first 10 tests are not considered, and decreases by 1 if the last 10 tests are not considered. If his average scores for the first 10 and the last 10 tests are 20 and 30, respectively, then the total number of tests taken by him is","h":"Removing first 10 vs last 10 changes the sum by 100 and the average by 2 on n - 10 tests.","yr":2018,"y":"CAT 2018 · Slot 1","l":3,"x":"Let $n$ tests total $T$ with average $a$. Dropping first 10: $T-200=(n-10)(a+1)$. Dropping last 10: $T-300=(n-10)(a-1)$.\nSubtract: $100=2(n-10)$.\n$n=60$.\nAnswer: 60","a":"60"},{"n":99,"c":"AVG","f":"AVG-A4","t":"T","s":"The arithmetic mean of x, y and z is 80, and that of x, y, z, u and v is 75, where u = (x + y)/2 and v = (y + z)/2. If x ≥ z, then the minimum possible value of x is","h":"u + v = (x + 2y + z)/2 = 135 fixes y; then x + z is known and x ≥ z.","yr":2018,"y":"CAT 2018 · Slot 2","l":4,"x":"$x+y+z=240$ and $x+y+z+u+v=375$, so $u+v=135$.\n$u+v=\\frac{x+2y+z}{2}=135$ gives $x+2y+z=270$, so $y=30$.\nThen $x+z=210$; with $x\\ge z$, $x\\ge105$.\nMinimum $x=105$.\nAnswer: 105","a":"105"},{"n":100,"c":"AVG","f":"AVG-A4","t":"M","s":"Ramesh and Gautam are among 22 students who write an examination. Ramesh scores 82.5. The average score of the 21 students other than Gautam is 62. The average score of all the 22 students is one more than the average score of the 21 students other than Ramesh. The score of Gautam is","h":"Total S satisfies S/22 = (S - 82.5)/21 + 1; Gautam = S - 21 x 62.","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"The 21 students other than Gautam total $21\\times62=1302$, so all 22 total $1302+G$.\nWithout Ramesh: $1302+G-82.5=1219.5+G$ over 21 students.\n$\\frac{1302+G}{22}=\\frac{1219.5+G}{21}+1$ gives $27342+21G=27291+22G$.\n$G=51$.\nAnswer: 51","o":["53","51","48","49"],"ai":1,"a":"51"},{"n":101,"c":"AVG","f":"AVG-A4","t":"M","s":"Let A, B and C be three positive integers such that the sum of A and the mean of B and C is 5. In addition, the sum of B and the mean of A and C is 7. Then the sum of A and B is","h":"Double both equations and subtract to get B - A; then use positivity of integers.","yr":2020,"y":"CAT 2020 · Slot 1","l":2,"x":"Write as $2A+B+C=10$ and $A+2B+C=14$.\nSubtracting: $B-A=4$.\n$A=1,B=5$ gives $C=3$ (positive); $A=2,B=6$ would need $C=0$.\n$A+B=6$.\nAnswer: 6","o":["6","4","7","5"],"ai":0,"a":"6"},{"n":102,"c":"AVG","f":"AVG-A4","t":"T","s":"Dick is thrice as old as Tom and Harry is twice as old as Dick. If Dick’s age is 1 year less than the average age of all three, then Harry’s age, in years, is","h":"Tom T, Dick 3T, Harry 6T; Dick = average - 1.","yr":2020,"y":"CAT 2020 · Slot 3","l":1,"x":"Let Tom $=t$; Dick $=3t$, Harry $=6t$. Average $=\\frac{10t}{3}$.\n$3t=\\frac{10t}{3}-1$ gives $\\frac{t}{3}=1$, $t=3$.\nHarry $=6\\times3=18$.\nAnswer: 18","a":"18"},{"n":103,"c":"AVG","f":"AVG-A4","t":"T","s":"Suppose hospital A admitted 21 less Covid infected patients than hospital B, and all eventually recovered. The sum of recovery days for patients in hospitals A and B were 200 and 152, respectively. If the average recovery days for patients admitted in hospital A was 3 more than the average in hospital B then the number admitted in hospital A was","h":"200/A = 152/(A + 21) + 3 gives a quadratic; take the positive integer root.","yr":2021,"y":"CAT 2021 · Slot 1","l":3,"x":"Let B admit $n$, A admit $n-21$: $\\frac{200}{n-21}=\\frac{152}{n}+3$.\nClearing: $3n^2-111n-3192=0$, i.e. $n^2-37n-1064=0$.\n$(n-56)(n+19)=0$, so $n=56$.\nA admitted $56-21=35$.\nAnswer: 35","a":"35"},{"n":104,"c":"AVG","f":"AVG-A4","t":"T","s":"In a football tournament, a player has played a certain number of matches and 10 more matches are to be played. If he scores a total of one goal over the next 10 matches, his overall average will be 0.15 goals per match. On the other hand, if he scores a total of two goals over the next 10 matches, his overall average will be 0.2 goals per match. The number of matches he has played is","h":"One extra goal raises the average by 0.05 over (n + 10) matches.","yr":2021,"y":"CAT 2021 · Slot 2","l":2,"x":"Let total matches after the 10 be $M$ (same in both cases).\nOne extra goal changes the average by $0.2-0.15=0.05$, so $\\frac{1}{M}=0.05$, $M=20$.\nMatches already played $=20-10=10$.\nAnswer: 10","a":"10"},{"n":105,"c":"AVG","f":"AVG-A4","t":"T","s":"There are four numbers such that average of first two numbers is 1 more than the first number, average of first three numbers is 2 more than average of first two numbers, and average of first four numbers is 3 more than average of first three numbers. Then, the difference between the largest and the smallest numbers, is","h":"Express b, c, d in terms of a step by step from each average condition.","yr":2024,"y":"CAT 2024 · Slot 1","l":3,"x":"Let the first number be $a$. Average of two $=a+1$, so second $=a+2$.\nAverage of three $=a+3$: third $=3(a+3)-(2a+2)=a+7$.\nAverage of four $=a+6$: fourth $=4(a+6)-3(a+3)=a+15$.\nLargest $-$ smallest $=15$.\nAnswer: 15","a":"15"},{"n":106,"c":"AVG","f":"AVG-A4","t":"M","s":"A company has 40 employees whose names are listed in a certain order. In the year 2022, the average bonus of the first 30 employees was Rs. 40000, of the last 30 employees was Rs. 60000, and of the first 10 and last 10 employees together was Rs. 50000. Next year, the average bonus of the first 10 employees increased by 100%, of the last 10 employees increased by 200% and of the remaining employees was unchanged. Then, the average bonus, in rupees, of all the 40 employees together in the year 2023 was","h":"Pair sums of the three blocks: add them to get the full total, then isolate each block.","yr":2024,"y":"CAT 2024 · Slot 2","l":4,"x":"Split into first 10 ($F$), middle 20 ($M$), last 10 ($L$) totals: $F+M=12$ lakh, $M+L=18$ lakh, $F+L=10$ lakh.\nAdding: $F+M+L=20$ lakh, so $F=2$, $L=8$, $M=10$ lakh.\n2023: $2F+M+3L=4+10+24=38$ lakh.\nAverage $=\\frac{3{,}800{,}000}{40}=95{,}000$.\nAnswer: 95000","o":["90000","95000","80000","85000"],"ai":1,"a":"95000"},{"n":107,"c":"AVG","f":"AVG-A4","t":"T","s":"The average of three distinct real numbers is 28. If the smallest number is increased by 7 and the largest number is reduced by 10, the order of the numbers remains unchanged, and the new arithmetic mean becomes 2 more than the middle number, while the difference between the largest and the smallest numbers becomes 64. Then, the largest number in the original set of three numbers is","h":"New mean 27 = middle+2 fixes the middle; then use sum and new range to get extremes.","yr":2024,"y":"CAT 2024 · Slot 3","l":3,"x":"Let $a<b<c$ with $a+b+c=84$.\nNew numbers $a+7,b,c-10$ total $81$, mean $27=b+2$, so $b=25$ and $a+c=59$.\n$(c-10)-(a+7)=64$ gives $c-a=81$.\n$c=70$ (and $a=-11$; order is kept).\nAnswer: 70","a":"70"},{"n":108,"c":"MIX","f":"MIX-M1","t":"M","s":"A 20% ethanol solution is mixed with another ethanol solution, say, S of unknown concentration in the proportion 1 : 3 by volume. This mixture is then mixed with an equal volume of 20% ethanol solution. If the resultant mixture is a 31.25% ethanol solution, then the unknown concentration of S is","h":"Final mix is 1 part S-mix(4 vols) + 4 vols of 20%; set weighted average 31.25.","yr":2018,"y":"CAT 2018 · Slot 2","l":3,"x":"1 part $20\\%$ + 3 parts S, then an equal 4 parts of $20\\%$: in all 5 parts $20\\%$ and 3 parts S.\n$5 \\times 20 + 3s = 8 \\times 31.25 = 250$.\n$3s = 150$, so $s = 50\\%$.\nAnswer: 50%","o":["50%","55%","48%","52%"],"ai":0,"a":"50%"},{"n":109,"c":"MIX","f":"MIX-M1","t":"M","s":"The strength of a salt solution is p% if 100 ml of the solution contains p grams of salt. If three salt solutions A, B, C are mixed in the proportion 1 : 2 : 3, then the resulting solution has strength 20%. If instead the proportion is 3 : 2 : 1, then the resulting solution has strength 30%. A fourth solution, D, is produced by mixing B and C in the ratio 2 : 7. The ratio of the strength of D to that of A is","h":"Subtract the two equations to link c to a, express b via a, and D collapses to a multiple of a.","yr":2018,"y":"CAT 2018 · Slot 2","l":4,"x":"Strengths $a, b, c$: $a + 2b + 3c = 120$ and $3a + 2b + c = 180$.\nSubtracting: $a = c + 30$; then $b + 2c = 45$, i.e. $2b = 90 - 4c$.\nD $= \\frac{2b + 7c}{9} = \\frac{90 + 3c}{9} = \\frac{c + 30}{3} = \\frac{a}{3}$.\nD : A $= 1:3$.\nAnswer: 1 : 3","o":["3 : 10","1 : 3","2 : 5","1 : 4"],"ai":1,"a":"1 : 3"},{"n":110,"c":"MIX","f":"MIX-M1","t":"M","s":"A chemist mixes two liquids 1 and 2. One litre of liquid 1 weighs 1 kg and one litre of liquid 2 weighs 800 gm. If half litre of the mixture weighs 480 gm, then the percentage of liquid 1 in the mixture, in terms of volume, is","h":"Mixture density 0.96 kg/L; alligate between 1 and 0.8.","yr":2019,"y":"CAT 2019 · Slot 1","l":2,"x":"Half a litre weighs 480 g, so the mixture weighs 960 g per litre.\nAlligation of 1000 g and 800 g at 960: liquid 1 : liquid 2 $= 160:40 = 4:1$.\nLiquid 1 $= 80\\%$ by volume.\nAnswer: 80","o":["75","85","80","70"],"ai":2,"a":"80"},{"n":111,"c":"MIX","f":"MIX-M1","t":"M","s":"Two alcohol solutions, A and B, are mixed in the proportion 1 : 3 by volume. The volume of the mixture is then doubled by adding solution A such that the resulting mixture has 72% alcohol. If solution A has 60% alcohol, then the percentage of alcohol in solution B is","h":"Final mix is A:B = 5:3 by volume; weighted average equals 72.","yr":2020,"y":"CAT 2020 · Slot 3","l":2,"x":"Take 1 litre A and 3 litres B; doubling adds 4 litres of A: A $= 5$, B $= 3$ litres.\nAlcohol: $5 \\times 60 + 3b = 8 \\times 72 = 576$.\n$3b = 276$, so $b = 92\\%$.\nAnswer: 92%","o":["94%","92%","90%","89%"],"ai":1,"a":"92%"},{"n":112,"c":"MIX","f":"MIX-M1","t":"M","s":"If a certain weight of an alloy of silver and copper is mixed with 3 kg of pure silver, the resulting alloy will have 90% silver by weight. If the same weight of the initial alloy is mixed with 2 kg of another alloy which has 90% silver by weight, the resulting alloy will have 84% silver by weight. Then, the weight of the initial alloy, in kg, is","h":"Write silver in the initial alloy two ways from the two final percentages.","yr":2021,"y":"CAT 2021 · Slot 3","l":4,"x":"Let the alloy weigh $w$ kg with $s$ kg silver.\nWith 3 kg silver: $s + 3 = 0.9(w + 3)$, so $s = 0.9w - 0.3$.\nWith the $90\\%$ alloy: $s + 1.8 = 0.84(w + 2)$.\n$0.9w + 1.5 = 0.84w + 1.68$, so $0.06w = 0.18$ and $w = 3$.\nAnswer: 3","o":["3","2.5","4","3.5"],"ai":0,"a":"3"},{"n":113,"c":"MIX","f":"MIX-M2","t":"M","s":"A jar contains a mixture of 175 ml water and 700 ml alcohol. Gopal takes out 10% of the mixture and substitutes it by water of the same amount. The process is repeated once again. The percentage of water in the mixture is now","h":"Alcohol is multiplied by 0.9 each round.","yr":2018,"y":"CAT 2018 · Slot 2","l":2,"x":"Alcohol is $\\frac{700}{875} = 80\\%$; each step keeps $90\\%$ of it.\nAlcohol $= 80 \\times 0.81 = 64.8\\%$.\nWater $= 100 - 64.8 = 35.2\\%$.\nAnswer: 35.2","o":["25.4","20.5","30.3","35.2"],"ai":3,"a":"35.2"},{"n":114,"c":"MIX","f":"MIX-M2","t":"T","s":"The strength of an indigo solution in percentage is equal to the amount of indigo in grams per 100 cc of water. Two 800 cc bottles are filled with indigo solutions of strengths 33% and 17%, respectively. A part of the solution from the first bottle is thrown away and replaced by an equal volume of the solution from the second bottle. If the strength of the indigo solution in the first bottle has now changed to 21% then the volume, in cc, of the solution left in the second bottle is","h":"Alligation of 33 and 17 to 21 gives the fraction replaced.","yr":2021,"y":"CAT 2021 · Slot 1","l":3,"x":"Treat strengths as concentrations; alligation of 33 and 17 at 21: first : second $= (21-17):(33-21) = 1:3$.\nSo $\\frac{3}{4}$ of the first bottle, 600 cc, now comes from the second bottle.\nLeft in the second bottle $= 800 - 600 = 200$ cc.\nAnswer: 200","a":"200"},{"n":115,"c":"MIX","f":"MIX-M2","t":"T","s":"From a container filled with milk, 9 litres of milk are drawn and replaced with water. Next, from the same container, 9 litres are drawn and again replaced with water. If the volumes of milk and water in the container are now in the ratio of 16 : 9, then the capacity of the container, in litres, is","h":"Milk fraction after two replacements = (1 - 9/C)^2 = 16/25.","yr":2021,"y":"CAT 2021 · Slot 2","l":2,"x":"Milk fraction after two draws $= \\left(1 - \\frac{9}{V}\\right)^2 = \\frac{16}{25}$.\n$1 - \\frac{9}{V} = \\frac{4}{5}$, so $\\frac{9}{V} = \\frac{1}{5}$.\n$V = 45$ litres.\nAnswer: 45","a":"45"},{"n":116,"c":"MIX","f":"MIX-M2","t":"M","s":"A mixture P is formed by removing a certain amount of coffee from a coffee jar and replacing the same amount with cocoa powder. The same amount is again removed from mixture P and replaced with same amount of cocoa powder to form a new mixture Q. If the ratio of coffee and cocoa in the mixture Q is 16 : 9, then the ratio of cocoa in mixture P to that in mixture Q is","h":"(1-f)^2 = 16/25 gives f; cocoa in P is f, in Q is 1-(1-f)^2.","yr":2023,"y":"CAT 2023 · Slot 1","l":2,"x":"Coffee in Q $= \\frac{16}{25} = k^2$, where $k$ is the fraction kept each time, so $k = \\frac{4}{5}$.\nCocoa in P $= 1 - \\frac{4}{5} = \\frac{1}{5} = \\frac{5}{25}$; cocoa in Q $= \\frac{9}{25}$.\nRatio $= 5:9$.\nAnswer: 5 : 9","o":["4 : 9","1 : 3","5 : 9","1 : 2"],"ai":2,"a":"5 : 9"},{"n":117,"c":"MIX","f":"MIX-M2","t":"T","s":"A container has 40 liters of milk. Then, 4 liters are removed from the container and replaced with 4 liters of water. This process of replacing 4 liters of the liquid in the container with an equal volume of water is continued repeatedly. The smallest number of times of doing this process, after which the volume of milk in the container becomes less than that of water, is","h":"Milk = 40(0.9)^n; find when it falls below 20.","yr":2023,"y":"CAT 2023 · Slot 2","l":3,"x":"Each step keeps $\\frac{36}{40} = 0.9$ of the milk; we need $0.9^n < 0.5$.\n$0.9^6 \\approx 0.531$ and $0.9^7 \\approx 0.478$.\nSo 7 times.\nAnswer: 7","a":"7"},{"n":118,"c":"MIX","f":"MIX-M2","t":"M","s":"A glass is filled with milk. Two-thirds of its content is poured out and replaced with water. If this process of pouring out two-thirds the content and replacing with water is repeated three more times, then the final ratio of milk to water in the glass, is","h":"Milk left = (1/3)^4 of the original.","yr":2024,"y":"CAT 2024 · Slot 1","l":1,"x":"Each time only $\\frac{1}{3}$ of the milk stays.\nAfter 4 operations: milk $= \\left(\\frac{1}{3}\\right)^4 = \\frac{1}{81}$ of the glass.\nWater $= \\frac{80}{81}$, so the ratio is $1:80$.\nAnswer: 1 : 80","o":["1 : 27","1 : 81","1 : 26","1 : 80"],"ai":3,"a":"1 : 80"},{"n":119,"c":"MIX","f":"MIX-M2","t":"T","s":"A certain amount of water was poured into a 300 litre container and the remaining portion of the container was filled with milk. Then an amount of this solution was taken out from the container which was twice the volume of water that was earlier poured into it, and water was poured to refill the container again. If the resulting solution contains 72% milk, then the amount of water, in litres, that was initially poured into the container was","h":"Milk left = (300-w)(1-2w/300) = 216; solve the quadratic, reject the root above 150.","yr":2024,"y":"CAT 2024 · Slot 3","l":3,"x":"Milk is $\\frac{300 - w}{300}$ of the container; removing $2w$ litres keeps $\\frac{300 - 2w}{300}$ of it.\n$\\frac{(300 - w)(300 - 2w)}{90000} = 0.72$, so $(300 - w)(300 - 2w) = 64800$.\n$w = 30$: $270 \\times 240 = 64800$. It fits.\nAnswer: 30","a":"30"},{"n":120,"c":"MIX","f":"MIX-M3","t":"M","s":"Bottle 1 contains a mixture of milk and water in 7 : 2 ratio and Bottle 2 contains a mixture of milk and water in 9 : 4 ratio. In what ratio of volumes should the liquids in Bottle 1 and Bottle 2 be combined to obtain a mixture of milk and water in 3 : 1 ratio?","h":"Alligate milk fractions 7/9 and 9/13 around 3/4.","yr":2017,"y":"CAT 2017 · Slot 2","l":3,"x":"Milk fractions: bottle 1 $= \\frac{7}{9}$, bottle 2 $= \\frac{9}{13}$, target $= \\frac{3}{4}$.\nAlligation: bottle 1 : bottle 2 $= \\left(\\frac{3}{4} - \\frac{9}{13}\\right) : \\left(\\frac{7}{9} - \\frac{3}{4}\\right) = \\frac{3}{52} : \\frac{1}{36}$.\n$= \\frac{108}{52} = \\frac{27}{13}$, i.e. $27:13$.\nAnswer: 27 : 13","o":["27 : 14","27 : 13","27 : 16","27 : 18"],"ai":1,"a":"27 : 13"},{"n":121,"c":"MIX","f":"MIX-M3","t":"M","s":"Consider three mixtures — the first having water and liquid A in the ratio 1 : 2, the second having water and liquid B in the ratio 1 : 3, and the third having water and liquid C in the ratio 1 : 4. These three mixtures of A, B, and C, respectively, are further mixed in the proportion 4 : 3 : 2. Then the resulting mixture has","h":"Take mixture quantities 4, 3, 2 units and compute each component.","yr":2017,"y":"CAT 2017 · Slot 2","l":3,"x":"Take 4, 3 and 2 units of the three mixtures.\nWater $= \\frac{4}{3} + \\frac{3}{4} + \\frac{2}{5} = \\frac{149}{60} \\approx 2.48$.\nA $= \\frac{8}{3} \\approx 2.67$, B $= \\frac{9}{4} = 2.25$, C $= \\frac{8}{5} = 1.6$.\nWater exceeds B but not A, and B $\\ne$ C.\nAnswer: More water than liquid B","o":["The same amount of water and liquid B","The same amount of liquids B and C","More water than liquid B","More water than liquid A"],"ai":2,"a":"More water than liquid B"},{"n":122,"c":"MIX","f":"MIX-M3","t":"M","s":"There are two drums, each containing a mixture of paints A and B. In drum 1, A and B are in the ratio 18 : 7. The mixtures from drums 1 and 2 are mixed in the ratio 3 : 4 and in this final mixture, A and B are in the ratio 13 : 7. In drum 2, then A and B were in the ratio","h":"Fraction of A in final mix is weighted average of drum fractions with weights 3 and 4.","yr":2018,"y":"CAT 2018 · Slot 2","l":3,"x":"Let A be a fraction $x$ of drum 2. Balance A in 3 parts drum 1 and 4 parts drum 2.\n$3 \\times \\frac{18}{25} + 4x = 7 \\times \\frac{13}{20}$\n$4x = \\frac{455 - 216}{100} = \\frac{239}{100}$, so $x = \\frac{239}{400}$.\nRatio $= 239:161$.\nAnswer: 239 : 161","o":["251 : 163","239 : 161","220 : 149","229 : 141"],"ai":1,"a":"239 : 161"},{"n":123,"c":"MIX","f":"MIX-M3","t":"M","s":"The strength of a salt solution is p% if 100 ml of the solution contains p grams of salt. Each of three vessels A, B, C contains 500 ml of salt solution of strengths 10%, 22%, and 32%, respectively. Now, 100 ml of the solution in vessel A is transferred to vessel B. Then, 100 ml of the solution in vessel B is transferred to vessel C. Finally, 100 ml of the solution in vessel C is transferred to vessel A. The strength, in percentage, of the resulting solution in vessel A is","h":"Track grams of salt transferred in each 100 ml move.","yr":2019,"y":"CAT 2019 · Slot 2","l":4,"x":"Salt: A 50 g, B 110 g, C 160 g (in 500 ml each).\nA to B: 10 g moves; B has 120 g in 600 ml, i.e. $20\\%$.\nB to C: 20 g moves; C has 180 g in 600 ml, i.e. $30\\%$.\nC to A: 30 g moves; A has $40 + 30 = 70$ g in 500 ml.\nStrength $= 14\\%$.\nAnswer: 14","o":["15","12","13","14"],"ai":3,"a":"14"},{"n":124,"c":"MIX","f":"MIX-M3","t":"M","s":"An alloy is prepared by mixing metals A, B, C in the proportion 3 : 4 : 7 by volume. Weights of the same volume of metals A, B, C are in the ratio 5 : 2 : 6. In 130 kg of the alloy, the weight, in kg, of the metal C is","h":"Weight ratio = volume ratio x density ratio.","yr":2020,"y":"CAT 2020 · Slot 1","l":3,"x":"Weight $=$ volume $\\times$ weight per unit volume, so A : B : C by weight $= 3 \\times 5 : 4 \\times 2 : 7 \\times 6 = 15:8:42$.\nC’s share $= \\frac{42}{65}$ of 130 kg.\n$= 84$ kg.\nAnswer: 84","o":["84","48","96","70"],"ai":0,"a":"84"},{"n":125,"c":"MIX","f":"MIX-M3","t":"T","s":"A solution, of volume 40 litres, has dye and water in the proportion 2 : 3. Water is added to the solution to change this proportion to 2 : 5. If one-fourths of this diluted solution is taken out, how many litres of dye must be added to the remaining solution to bring the proportion back to 2 : 3?","h":"Dye fixed at 16 while diluting; after removing a quarter, make dye 2/3 of water.","yr":2020,"y":"CAT 2020 · Slot 1","l":3,"x":"Dye $= 16$, water $= 24$; dye stays 16 while water rises to 40 for $2:5$.\nRemoving $\\frac{1}{4}$ leaves dye 12, water 30.\nFor $2:3$ with water 30, dye must be 20: add $20 - 12 = 8$ litres.\nAnswer: 8","a":"8"},{"n":126,"c":"MIX","f":"MIX-M3","t":"M","s":"A mixture contains lemon juice and sugar syrup in equal proportion. If a new mixture is created by adding this mixture and sugar syrup in the ratio 1 : 3, then the ratio of lemon juice and sugar syrup in the new mixture is","h":"One unit of mixture has half lemon; add three units of syrup.","yr":2022,"y":"CAT 2022 · Slot 1","l":2,"x":"1 part of the old mixture has $\\frac{1}{2}$ lemon and $\\frac{1}{2}$ syrup.\nAdding 3 parts syrup: lemon $\\frac{1}{2}$, syrup $\\frac{7}{2}$.\nRatio $= 1:7$.\nAnswer: 1 : 7","o":["1 : 6","1 : 4","1 : 5","1 : 7"],"ai":3,"a":"1 : 7"},{"n":127,"c":"MIX","f":"MIX-M3","t":"M","s":"There are two containers of the same volume, first container half-filled with sugar syrup and the second container half-filled with milk. Half the content of the first container is transferred to the second container, and then the half of this mixture is transferred back to the first container. Next, half the content of the first container is transferred back to the second container. Then the ratio of sugar syrup and milk in the second container is","h":"Track syrup and milk quantities through each half transfer.","yr":2022,"y":"CAT 2022 · Slot 2","l":3,"x":"Take 1 unit syrup in the first and 1 unit milk in the second.\nStep 1: second has $0.5$ syrup, 1 milk.\nStep 2: half goes back; first has $0.75$ syrup, $0.5$ milk; second has $0.25$ syrup, $0.5$ milk.\nStep 3: half of first ($0.375$ syrup, $0.25$ milk) goes over; second has $0.625$ syrup, $0.75$ milk.\nRatio $= 0.625 : 0.75 = 5:6$.\nAnswer: 5 : 6","o":["5 : 6","5 : 4","6 : 5","4 : 5"],"ai":0,"a":"5 : 6"},{"n":128,"c":"MIX","f":"MIX-M3","t":"M","s":"A glass contains 500 cc of milk and a cup contains 500 cc of water. From the glass, 150 cc of milk is transferred to the cup and mixed thoroughly. Next, 150 cc of this mixture is transferred from the cup to the glass. Now, the amount of water in the glass and the amount of milk in the cup are in the ratio","h":"After a back-and-forth transfer of equal volumes, the contamination in each vessel is equal.","yr":2022,"y":"CAT 2022 · Slot 3","l":2,"x":"Both vessels end with 500 cc, so the water that entered the glass must equal the milk that stayed in the cup.\nCheck: the cup has 150 milk and 500 water; 150 cc of it carries $\\frac{450}{13}$ milk and $\\frac{1500}{13}$ water.\nMilk left in cup $= 150 - \\frac{450}{13} = \\frac{1500}{13}$, the same as the water in the glass.\nRatio $= 1:1$.\nAnswer: 1 : 1","o":["3 : 10","10 : 3","1 : 1","10 : 13"],"ai":2,"a":"1 : 1"},{"n":129,"c":"MIX","f":"MIX-M3","t":"M","s":"Anil mixes cocoa with sugar in the ratio 3 : 2 to prepare mixture A, and coffee with sugar in the ratio 7 : 3 to prepare mixture B. He combines mixtures A and B in the ratio 2 : 3 to make a new mixture C. If he mixes C with an equal amount of milk to make a drink, then the percentage of sugar in this drink will be","h":"Sugar fraction of C = 0.4*0.4 + 0.6*0.3; milk halves it.","yr":2023,"y":"CAT 2023 · Slot 3","l":2,"x":"Sugar is $\\frac{2}{5}$ of A and $\\frac{3}{10}$ of B.\nC in $2:3$: sugar $= \\frac{2 \\times 0.4 + 3 \\times 0.3}{5} = 0.34$.\nEqual milk halves it: $17\\%$.\nAnswer: 17","o":["21","24","16","17"],"ai":3,"a":"17"},{"n":130,"c":"MIX","f":"MIX-M3","t":"M","s":"A vessel contained a certain amount of a solution of acid and water. When 2 litres of water was added to it, the new solution had 50% acid concentration. When 15 litres of acid was further added to this new solution, the final solution had 80% acid concentration. The ratio of water and acid in the original solution was","h":"Write acid = half of (solution+2), then 80% condition after adding 15 L acid.","yr":2024,"y":"CAT 2024 · Slot 2","l":2,"x":"After adding water, let the volume be $T$ with acid $\\frac{T}{2}$.\nAdding 15 acid: $\\frac{T}{2} + 15 = 0.8(T + 15)$, so $0.3T = 3$, $T = 10$.\nAcid $= 5$, water $= 5$, so originally water $= 3$, acid $= 5$.\nRatio $= 3:5$.\nAnswer: 3 : 5","o":["5 : 3","4 : 5","5 : 4","3 : 5"],"ai":3,"a":"3 : 5"},{"n":131,"c":"MIX","f":"MIX-M4","t":"M","s":"A trader sells 10 litres of a mixture of paints A and B, where the amount of B in the mixture does not exceed that of A. The cost of paint A per litre is Rs. 8 more than that of paint B. If the trader sells the entire mixture for Rs. 264 and makes a profit of 10%, then the highest possible cost of paint B, in Rs. per litre, is","h":"CP = 240 gives 10b + 8x = 240; b is largest when A's quantity is smallest allowed.","yr":2018,"y":"CAT 2018 · Slot 1","l":4,"x":"Cost $= \\frac{264}{1.1} = 240$. With $a$ litres of A and price $p$ for B: $a(p + 8) + (10 - a)p = 240$.\n$10p + 8a = 240$, so $p = 24 - 0.8a$; $p$ is highest when $a$ is least.\nB $\\le$ A means $a \\ge 5$, so $p = 24 - 4 = 20$.\nAnswer: 20","o":["16","26","20","22"],"ai":2,"a":"20"},{"n":132,"c":"MIX","f":"MIX-M4","t":"M","s":"Two types of tea, A and B, are mixed and then sold at Rs. 40 per kg. The profit is 10% if A and B are mixed in the ratio 3 : 2, and 5% if this ratio is 2 : 3. The cost prices per kg of A and B are in the ratio","h":"Find blended CP from each profit %, solve two linear equations in a and b.","yr":2018,"y":"CAT 2018 · Slot 1","l":3,"x":"Cost prices of the mixes: $\\frac{40}{1.1} = \\frac{400}{11}$ for $3:2$ and $\\frac{40}{1.05} = \\frac{800}{21}$ for $2:3$.\nSo $3a + 2b = \\frac{2000}{11}$ and $2a + 3b = \\frac{4000}{21}$.\nEliminate: $5a = 3 \\times \\frac{2000}{11} - 2 \\times \\frac{4000}{21}$ and $5b = 3 \\times \\frac{4000}{21} - 2 \\times \\frac{2000}{11}$.\nMultiply both by 231: $a : b = \\frac{3 \\times 2000 \\times 21 - 2 \\times 4000 \\times 11}{3 \\times 4000 \\times 11 - 2 \\times 2000 \\times 21} = \\frac{38000}{48000}$.\nRatio $= 19:24$.\nAnswer: 19 : 24","o":["21 : 25","19 : 24","18 : 25","17 : 25"],"ai":1,"a":"19 : 24"},{"n":133,"c":"MIX","f":"MIX-M4","t":"M","s":"A wholesaler bought walnuts and peanuts, the price of walnut per kg being thrice that of peanut per kg. He then sold 8 kg of peanuts at a profit of 10% and 16 kg of walnuts at a profit of 20% to a shopkeeper. However, the shopkeeper lost 5 kg of walnuts and 3 kg of peanuts in transit. He then mixed the remaining nuts and sold the mixture at Rs. 166 per kg, thus making an overall profit of 25%. At what price, in Rs. per kg, did the wholesaler buy the walnuts?","h":"Shopkeeper's total cost in terms of peanut price; 16 kg remain sold at 166 for 25% profit.","yr":2018,"y":"CAT 2018 · Slot 1","l":4,"x":"Let peanuts cost $p$ to the wholesaler, walnuts $3p$.\nShopkeeper’s cost $= 8 \\times 1.1p + 16 \\times 3.6p = 66.4p$.\nHe sells $16 - 5 + 8 - 3 = 16$ kg at 166: $2656 = 1.25 \\times 66.4p = 83p$.\n$p = 32$, so walnuts cost $96$ per kg.\nAnswer: 96","o":["84","86","96","98"],"ai":2,"a":"96"},{"n":134,"c":"MIX","f":"MIX-M4","t":"M","s":"A person buys tea of three different qualities at Rs. 800, Rs. 500, and Rs. 300 per kg, respectively, and the amounts bought are in the proportion 2 : 3 : 5. She mixes all the tea and sells one-sixth of the mixture at Rs. 700 per kg. The price, in INR per kg, at which she should sell the remaining tea, to make an overall profit of 50%, is","h":"Average cost 460/kg; target revenue 1.5x cost, subtract revenue from the one-sixth sold.","yr":2021,"y":"CAT 2021 · Slot 2","l":3,"x":"Average cost $= \\frac{2 \\times 800 + 3 \\times 500 + 5 \\times 300}{10} = 460$ per kg.\n$50\\%$ profit needs an average price of 690 per kg.\n$\\frac{1}{6} \\times 700 + \\frac{5}{6}x = 690$, so $5x = 4140 - 700 = 3440$.\n$x = 688$.\nAnswer: 688","o":["692","688","653","675"],"ai":1,"a":"688"},{"n":135,"c":"MIX","f":"MIX-M4","t":"T","s":"Amal buys 110 kg of syrup and 120 kg of juice, syrup being 20% less costly than juice, per kg. He sells 10 kg of syrup at 10% profit and 20 kg of juice at 20% profit. Mixing the remaining juice and syrup, Amal sells the mixture at Rs. 308.32 per kg and makes an overall profit of 64%. Then, Amal’s cost price for syrup, in rupees per kg, is","h":"Let juice = c, syrup = 0.8c; total revenue = 1.64 x total cost gives one linear equation in c.","yr":2022,"y":"CAT 2022 · Slot 1","l":4,"x":"Let juice cost $j$ per kg, syrup $0.8j$. Total cost $= 88j + 120j = 208j$; target revenue $= 1.64 \\times 208j = 341.12j$.\nSeparate sales: $10 \\times 0.88j + 20 \\times 1.2j = 32.8j$.\nThe other 200 kg bring $200 \\times 308.32 = 61664 = 341.12j - 32.8j = 308.32j$.\n$j = 200$, so syrup costs $0.8 \\times 200 = 160$.\nAnswer: 160","a":"160"},{"n":136,"c":"MIX","f":"MIX-M4","t":"M","s":"Ankita buys 4 kg cashews, 14 kg peanuts and 6 kg almonds when the cost of 7 kg cashews is the same as that of 30 kg peanuts or 9 kg almonds. She mixes all the three nuts and marks a price for the mixture in order to make a profit of Rs. 1752. She sells 4 kg of the mixture at this marked price and the remaining at a 20% discount on the marked price, thus making a total profit of Rs. 744. Then the amount, in rupees, that she had spent in buying almonds is","h":"Use 7C = 30P = 9A = 630t to cost the mix; 4 kg at MP + 20 kg at 0.8 MP = (20/24) of full MP revenue.","yr":2022,"y":"CAT 2022 · Slot 1","l":4,"x":"$7c = 30p = 9a = 630k$ gives prices $c = 90k$, $p = 21k$, $a = 70k$; total cost $= 360k + 294k + 420k = 1074k$.\nMarked price $M$ on 24 kg: $24M = 1074k + 1752$. Actual revenue $= 4M + 20 \\times 0.8M = 20M = 1074k + 744$.\nSubtract: $4M = 1008$, $M = 252$, so $1074k = 5040 - 744 = 4296$ and $k = 4$.\nAlmonds $= 6 \\times 280 = 1680$.\nAnswer: 1680","o":["1440","1176","1680","2520"],"ai":2,"a":"1680"},{"n":137,"c":"TW","f":"TW-W1","t":"T","s":"John takes twice as much time as Jack to finish a job. Jack and Jim together take one-thirds of the time to finish the job than John takes working alone. Moreover, in order to finish the job, John takes three days more than that taken by three of them working together. In how many days will Jim finish the job working alone?","h":"Let Jack = x days; express Jim's and the trio's rates in x and use the 3-day gap.","yr":2020,"y":"CAT 2020 · Slot 2","l":3,"x":"Let Jack take $x$ days; John takes $2x$.\nJack + Jim take $\\frac{2x}{3}$, so their rate is $\\frac{3}{2x}$ and Jim’s $=\\frac{3}{2x}-\\frac{1}{x}=\\frac{1}{2x}$.\nAll three: $\\frac{3}{2x}+\\frac{1}{2x}=\\frac{2}{x}$, time $\\frac{x}{2}$.\n$2x=\\frac{x}{2}+3$ gives $x=2$, so Jim alone takes $2x=4$ days.\nAnswer: 4","a":"4"},{"n":138,"c":"TW","f":"TW-W1","t":"T","s":"Amar, Akbar and Anthony are working on a project. Working together Amar and Akbar can complete the project in 1 year, Akbar and Anthony can complete in 16 months, Anthony and Amar can complete in 2 years. If the person who is neither the fastest nor the slowest works alone, the time in months he will take to complete the project is","h":"Add the three pair-rates and halve to get the total; subtract each pair.","yr":2021,"y":"CAT 2021 · Slot 1","l":2,"x":"Work in months: pair rates $\\frac{1}{12}$, $\\frac{1}{16}$, $\\frac{1}{24}$; their sum is $2\\times$ the total rate.\n$\\frac{1}{12}+\\frac{1}{16}+\\frac{1}{24}=\\frac{9}{48}$, so all three do $\\frac{9}{96}$ a month.\nSubtract each pair: Anthony $=\\frac{9}{96}-\\frac{8}{96}=\\frac{1}{96}$, Amar $=\\frac{9}{96}-\\frac{6}{96}=\\frac{3}{96}$, Akbar $=\\frac{9}{96}-\\frac{4}{96}=\\frac{5}{96}$.\nThe middle one is Amar, at $\\frac{1}{32}$: 32 months.\nAnswer: 32","a":"32"},{"n":139,"c":"TW","f":"TW-W1","t":"T","s":"The amount of job that Amal, Sunil and Kamal can individually do in a day, are in harmonic progression. Kamal takes twice as much time as Amal to do the same amount of job. If Amal and Sunil work for 4 days and 9 days, respectively, Kamal needs to work for 16 days to finish the remaining job. Then the number of days Sunil will take to finish the job working alone, is","h":"Rates in HP means times in AP; with Kamal = 2 x Amal, Sunil's time is the middle term.","yr":2023,"y":"CAT 2023 · Slot 1","l":4,"x":"Daily work in HP means times in AP. Amal takes $t$, Kamal $2t$, so Sunil takes $1.5t$.\n$\\frac{4}{t}+\\frac{9}{1.5t}+\\frac{16}{2t}=1$, i.e. $\\frac{4+6+8}{t}=1$.\n$t=18$, so Sunil takes $1.5\\times18=27$ days.\nAnswer: 27","a":"27"},{"n":140,"c":"TW","f":"TW-W2","t":"T","s":"A person can complete a job in 120 days. He works alone on Day 1. On Day 2, he is joined by another person who also can complete the job in exactly 120 days. On Day 3, they are joined by another person of equal efficiency. Like this, everyday a new person with the same efficiency joins the work. How many days are required to complete the job?","h":"Work done after n days is 1+2+...+n person-days; needs 120.","yr":2017,"y":"CAT 2017 · Slot 1","l":4,"x":"Day $n$ has $n$ workers, so after $n$ days the work done is $\\frac{n(n+1)}{2}$ person-days.\nNeed $\\frac{n(n+1)}{2}\\ge120$: $n=15$ gives exactly 120.\n15 days.\nAnswer: 15","a":"15"},{"n":141,"c":"TW","f":"TW-W2","t":"M","s":"When they work alone, B needs 25% more time to finish a job than A does. They two finish the job in 13 days in the following manner: A works alone till half the job is done, then A and B work together for four days, and finally B works alone to complete the remaining 5% of the job. In how many days can B alone finish the entire job?","h":"Half by A, 4 days of A+B, 5% by B sum to the job; rates 1/a and 0.8/a.","yr":2018,"y":"CAT 2018 · Slot 1","l":3,"x":"Let A take $a$ days; B takes $1.25a$.\nThe joint 4 days covered $100-50-5=45\\%$: $4\\left(\\frac{1}{a}+\\frac{1}{1.25a}\\right)=\\frac{7.2}{a}=0.45$.\nSo $a=16$ and B takes $1.25\\times16=20$ days.\nCheck: 8 days (A, half) $+4+1$ day (B does $5\\%$ of 20) $=13$ ✓.\nAnswer: 20","o":["16","22","20","18"],"ai":2,"a":"20"},{"n":142,"c":"TW","f":"TW-W2","t":"M","s":"Anil alone can do a job in 20 days while Sunil alone can do it in 40 days. Anil starts the job, and after 3 days, Sunil joins him. Again, after a few more days, Bimal joins them and they together finish the job. If Bimal has done 10% of the job, then in how many days was the job done?","h":"Anil and Sunil together do 90%: T/20 + (T-3)/40 = 0.9.","yr":2019,"y":"CAT 2019 · Slot 2","l":2,"x":"Bimal does $10\\%$, so Anil and Sunil do $90\\%$.\nIf the job takes $T$ days, Anil works $T$ and Sunil $T-3$: $\\frac{T}{20}+\\frac{T-3}{40}=\\frac{9}{10}$.\nMultiply by 40: $2T+T-3=36$, so $T=13$.\nAnswer: 13","o":["13","12","15","14"],"ai":0,"a":"13"},{"n":143,"c":"TW","f":"TW-W2","t":"M","s":"Anu, Vinu and Manu can complete a work alone in 15 days, 12 days and 20 days, respectively. Vinu works everyday. Anu works only on alternate days starting from the first day while Manu works only on alternate days starting from the second day. Then, the number of days needed to complete the work is","h":"Group days into two-day blocks (Vinu+Anu, Vinu+Manu) and track cumulative work.","yr":2021,"y":"CAT 2021 · Slot 1","l":3,"x":"Take the work as 60 units: Anu 4, Vinu 5, Manu 3 per day.\nOdd days (Vinu + Anu): 9; even days (Vinu + Manu): 8; 17 per 2 days.\nAfter 6 days: 51. Day 7 (odd) adds 9 → 60.\n7 days.\nAnswer: 7","o":["8","6","5","7"],"ai":3,"a":"7"},{"n":144,"c":"TW","f":"TW-W2","t":"M","s":"Anil can paint a house in 60 days while Bimal can paint it in 84 days. Anil starts painting and after 10 days, Bimal and Charu join him. Together, they complete the painting in 14 more days. If they are paid a total of Rs. 21000 for the job, then the share of Charu, in INR, proportionate to the work done by him, is","h":"Find Anil's and Bimal's fractions of work from their days worked; Charu gets the remainder.","yr":2021,"y":"CAT 2021 · Slot 2","l":3,"x":"Anil works $10+14=24$ days: $\\frac{24}{60}=\\frac{2}{5}$. Bimal works 14: $\\frac{14}{84}=\\frac{1}{6}$.\nCharu: $1-\\frac{2}{5}-\\frac{1}{6}=\\frac{13}{30}$.\nShare $=\\frac{13}{30}\\times21000=9100$.\nAnswer: 9100","o":["9000","9100","9200","9150"],"ai":1,"a":"9100"},{"n":145,"c":"TW","f":"TW-W2","t":"M","s":"One day, Rahul started a work at 9 AM and Gautam joined him two hours later. They then worked together and completed the work at 5 PM the same day. If both had started at 9 AM and worked together, the work would have been completed 30 minutes earlier. Working alone, the time Rahul would have taken, in hours, to complete the work is","h":"8r + 6g = 1 and 7.5(r+g) = 1.","yr":2021,"y":"CAT 2021 · Slot 3","l":2,"x":"Rahul works 8 h and Gautam 6 h: $8r+6g=1$. Together from 9 AM it would take $7.5$ h: $r+g=\\frac{2}{15}$.\nWrite $8r+6g=6(r+g)+2r=\\frac{12}{15}+2r=1$.\nSo $2r=\\frac{1}{5}$, $r=\\frac{1}{10}$: Rahul alone takes 10 hours.\nAnswer: 10","o":["12","11.5","12.5","10"],"ai":3,"a":"10"},{"n":146,"c":"TW","f":"TW-W2","t":"T","s":"Bob can finish a job in 40 days, if he works alone. Alex is twice as fast as Bob and thrice as fast as Cole in the same job. Suppose Alex and Bob work together on the first day, Bob and Cole work together on the second day, Cole and Alex work together on the third day, and then, they continue the work by repeating this three-day roster, with Alex and Bob working together on the fourth day, and so on. Then, the total number of days Alex would have worked when the job gets finished, is","h":"Alex=2x Bob and Cole=Alex/3; add the work in each 3-day cycle, then finish day by day.","yr":2022,"y":"CAT 2022 · Slot 3","l":3,"x":"Alex takes 20 days, Cole 60; take the job as 120 units: Alex 6, Bob 3, Cole 2 per day.\nDays give AB 9, BC 5, CA 8: 22 per 3-day roster.\n5 rosters (15 days) give 110. Day 16 (AB): 119. Day 17 (BC): done.\nAlex worked 2 days per roster: $2\\times5=10$, plus day 16: 11 days.\nAnswer: 11","a":"11"},{"n":147,"c":"TW","f":"TW-W2","t":"T","s":"Amal and Vimal together can complete a task in 150 days, while Vimal and Sunil together can complete the same task in 100 days. Amal starts working on the task and works for 75 days, then Vimal takes over and works for 135 days. Finally, Sunil takes over and completes the remaining task in 45 days. If Amal had started the task alone and worked on all days, Vimal had worked on every second day, and Sunil had worked on every third day, then the number of days required to complete the task would have been","h":"Rewrite 75A+135V+45S as 75(A+V)+15V+45(V+S) to get V, then simulate a 6-day cycle.","yr":2024,"y":"CAT 2024 · Slot 2","l":4,"x":"Rates: $A+V=\\frac{1}{150}$, $V+S=\\frac{1}{100}$, and $75A+135V+45S=1$.\nRegroup: $75(A+V)+45(V+S)+15V=\\frac{1}{2}+\\frac{9}{20}+15V=1$, so $V=\\frac{1}{300}$, $A=\\frac{1}{300}$, $S=\\frac{1}{150}$.\nTake the task as 300 units: A 1, V 1, S 2 per working day. A 6-day block gives $6+3+2\\times2=13$.\n23 blocks (138 days) give 299; day 139 (A only) adds the last unit.\n139 days.\nAnswer: 139","a":"139"},{"n":148,"c":"TW","f":"TW-W2","t":"M","s":"Sam can complete a job in 20 days when working alone. Mohit is twice as fast as Sam and thrice as fast as Ayna in the same job. They undertake a job with an arrangement where Sam and Mohit work together on the first day, Sam and Ayna on the second day, Mohit and Ayna on the third day, and this three-day pattern is repeated till the work gets completed. Then, the fraction of total work done by Sam is","h":"Rates 1/20, 1/10, 1/30; simulate the 3-day cycle until the job completes, counting Sam's days.","yr":2024,"y":"CAT 2024 · Slot 3","l":3,"x":"Mohit takes 10 days, Ayna 30; take the job as 60 units: Sam 3, Mohit 6, Ayna 2 per day.\nDays give 9, 5, 8: 22 per 3 days. After 6 days: 44; day 7: 53; day 8: 58; day 9 (Mohit + Ayna) finishes.\nSam worked days 1, 2, 4, 5, 7, 8: $6\\times3=18$ units.\nFraction $=\\frac{18}{60}=\\frac{3}{10}$.\nAnswer: 3/10","o":["3/20","3/10","1/20","1/5"],"ai":1,"a":"3/10"},{"n":149,"c":"TW","f":"TW-W3","t":"M","s":"A tank has an inlet pipe and an outlet pipe. If the outlet pipe is closed then the inlet pipe fills the empty tank in 8 hours. If the outlet pipe is open then the inlet pipe fills the empty tank in 10 hours. If only the outlet pipe is open then in how many hours the full tank becomes half-full?","h":"Outlet rate = 1/8 - 1/10 of tank per hour.","yr":2017,"y":"CAT 2017 · Slot 2","l":2,"x":"Inlet rate $\\frac{1}{8}$; with the outlet open the net rate is $\\frac{1}{10}$.\nOutlet rate $=\\frac{1}{8}-\\frac{1}{10}=\\frac{1}{40}$.\nEmptying half the tank takes $\\frac{1}{2}\\times40=20$ hours.\nAnswer: 20","o":["20","30","40","45"],"ai":0,"a":"20"},{"n":150,"c":"TW","f":"TW-W3","t":"T","s":"A tank is fitted with pipes, some filling it and the rest draining it. All filling pipes fill at the same rate, and all draining pipes drain at the same rate. The empty tank gets completely filled in 6 hours when 6 filling and 5 draining pipes are on, but this time becomes 60 hours when 5 filling and 6 draining pipes are on. In how many hours will the empty tank get completely filled when one draining and two filling pipes are on?","h":"Subtract and add the two rate equations to get f+d and f-d separately.","yr":2018,"y":"CAT 2018 · Slot 1","l":3,"x":"Let each filler give $f$ and each drain $d$ per hour: $6f-5d=\\frac{1}{6}$, $5f-6d=\\frac{1}{60}$.\nSubtract: $f+d=\\frac{9}{60}$. Add: $11(f-d)=\\frac{11}{60}$, so $f-d=\\frac{1}{60}$.\nSo $f=\\frac{1}{12}$, $d=\\frac{1}{15}$.\nTwo fillers and one drain: $\\frac{1}{6}-\\frac{1}{15}=\\frac{1}{10}$, i.e. 10 hours.\nAnswer: 10","a":"10"},{"n":151,"c":"TW","f":"TW-W3","t":"M","s":"A tank is emptied everyday at a fixed time point. Immediately thereafter, either pump A or pump B or both start working until the tank is full. On Monday, A alone completed filling the tank at 8 pm. On Tuesday, B alone completed filling the tank at 6 pm. On Wednesday, A alone worked till 5 pm, and then B worked alone from 5 pm to 7 pm, to fill the tank. At what time was the tank filled on Thursday if both pumps were used simultaneously all along?","h":"Let the emptying time be T; write A's and B's fill times as 20-T and 18-T and use Wednesday's equation to find T.","yr":2018,"y":"CAT 2018 · Slot 2","l":3,"x":"Let the tank be emptied at hour $T$ (24-h clock); A alone needs $20-T$ hours and B alone $18-T$.\nWednesday: $\\frac{17-T}{20-T}+\\frac{2}{18-T}=1$, so $\\frac{2}{18-T}=\\frac{3}{20-T}$.\n$40-2T=54-3T$, so $T=14$: A takes 6 h, B takes 4 h.\nTogether: $\\frac{6\\times4}{10}=2.4$ h $=2$ h 24 min after 2 PM.\nAnswer: 4 : 24 PM","o":["4 : 12 PM","4 : 24 PM","4 : 48 PM","4 : 36 PM"],"ai":1,"a":"4 : 24 PM"},{"n":152,"c":"TW","f":"TW-W3","t":"T","s":"A water tank has inlets of two types A and B. All inlets of type A when open, bring in water at the same rate. All inlets of type B, when open, bring in water at the same rate. The empty tank is completely filled in 30 minutes if 10 inlets of type A and 45 inlets of type B are open, and in 1 hour if 8 inlets of type A and 18 inlets of type B are open. In how many minutes will the empty tank get completely filled if 7 inlets of type A and 27 inlets of type B are open?","h":"Solve the two linear equations in per-inlet rates of A and B, then combine 7A+27B.","yr":2018,"y":"CAT 2018 · Slot 2","l":4,"x":"Let rates per minute be $a$, $b$: $10a+45b=\\frac{1}{30}$, $8a+18b=\\frac{1}{60}$.\nMultiply the second by $2.5$: $20a+45b=\\frac{1}{24}$; subtract: $10a=\\frac{1}{120}$, $a=\\frac{1}{1200}$.\nThen $45b=\\frac{1}{30}-\\frac{1}{120}=\\frac{1}{40}$, $b=\\frac{1}{1800}$.\n$7a+27b=\\frac{7}{1200}+\\frac{27}{1800}=\\frac{1}{48}$: 48 minutes.\nAnswer: 48","a":"48"},{"n":153,"c":"TW","f":"TW-W3","t":"M","s":"Two pipes A and B are attached to an empty water tank. Pipe A fills the tank while pipe B drains it. If pipe A is opened at 2 pm and pipe B is opened at 3 pm, then the tank becomes full at 10 pm. Instead, if pipe A is opened at 2 pm and pipe B is opened at 4 pm, then the tank becomes full at 6 pm. If pipe B is not opened at all, then the time, in minutes, taken to fill the tank is","h":"From the two schedules: 8a - 7b = 1 and 4a - 2b = 1; solve for a.","yr":2021,"y":"CAT 2021 · Slot 2","l":3,"x":"Let A fill $a$ and B drain $b$ per hour.\nCase 1: A runs 8 h, B 7 h: $8a-7b=1$. Case 2: A 4 h, B 2 h: $4a-2b=1$.\nDouble case 2: $8a-4b=2$; subtract case 1: $3b=1$, $b=\\frac{1}{3}$; then $4a=\\frac{5}{3}$, $a=\\frac{5}{12}$.\nA alone: $\\frac{12}{5}$ h $=144$ minutes.\nAnswer: 144","o":["140","120","144","264"],"ai":2,"a":"144"},{"n":154,"c":"TW","f":"TW-W3","t":"M","s":"Pipes A and C are fill pipes while Pipe B is a drain pipe of a tank. Pipe B empties the full tank in one hour less than the time taken by Pipe A to fill the empty tank. When pipes A, B and C are turned on together, the empty tank is filled in two hours. If pipes B and C are turned on together when the tank is empty and Pipe B is turned off after one hour, then Pipe C takes another one hour and 15 minutes to fill the remaining tank. If Pipe A can fill the empty tank in less than five hours, then the time taken, in minutes, by Pipe C to fill the empty tank is","h":"Use the B+C then C-alone phase to express C in terms of A, then test the A+B+C equation with A<5.","yr":2023,"y":"CAT 2023 · Slot 2","l":4,"x":"Let A take $a$ h, B drain in $a-1$ h, C take $c$ h: $\\frac{1}{a}-\\frac{1}{a-1}+\\frac{1}{c}=\\frac{1}{2}$.\nSecond run: C works $2.25$ h, B 1 h: $\\frac{2.25}{c}-\\frac{1}{a-1}=1$.\nSubtracting gives $\\frac{1.25}{c}=\\frac{1}{a}+\\frac{1}{2}$; putting this back yields $a^2-9a+18=0$, so $a=3$ (since $a<5$).\n$\\frac{1.25}{c}=\\frac{1}{3}+\\frac{1}{2}=\\frac{5}{6}$, so $c=1.5$ h $=90$ minutes.\nAnswer: 90","o":["90","60","120","75"],"ai":0,"a":"90"},{"n":155,"c":"TW","f":"TW-W4","t":"M","s":"Amal can complete a job in 10 days and Bimal can complete it in 8 days. Amal, Bimal and Kamal together complete the job in 4 days and are paid a total amount of Rs 1000 as remuneration. If this amount is shared by them in proportion to their work, then Kamal’s share, in rupees, is","h":"Kamal's daily rate = 1/4 - 1/10 - 1/8; share = his fraction of work.","yr":2017,"y":"CAT 2017 · Slot 2","l":2,"x":"In 4 days Amal does $\\frac{4}{10}$ and Bimal $\\frac{4}{8}$, together $\\frac{9}{10}$.\nKamal does $\\frac{1}{10}$, so his share $=\\frac{1}{10}\\times1000=100$.\nAnswer: 100","o":["100","200","300","400"],"ai":0,"a":"100"},{"n":156,"c":"TW","f":"TW-W4","t":"M","s":"Humans and robots can both perform a job but at different efficiencies. Fifteen humans and five robots working together take thirty days to finish the job, whereas five humans and fifteen robots working together take sixty days to finish it. How many days will fifteen humans working together (without any robot) take to finish it?","h":"Solve 15h+5r = 1/30 and 5h+15r = 1/60 for h.","yr":2018,"y":"CAT 2018 · Slot 1","l":2,"x":"Let a human do $h$ and a robot $r$ per day: $15h+5r=\\frac{1}{30}$, $5h+15r=\\frac{1}{60}$.\nTriple the second: $15h+45r=\\frac{1}{20}$; subtract the first: $40r=\\frac{1}{60}$, $r=\\frac{1}{2400}$.\nThen $15h=\\frac{1}{30}-\\frac{5}{2400}=\\frac{75}{2400}=\\frac{1}{32}$.\nFifteen humans take 32 days.\nAnswer: 32","o":["40","32","36","45"],"ai":1,"a":"32"},{"n":157,"c":"TW","f":"TW-W4","t":"T","s":"Three men and eight machines can finish a job in half the time taken by three machines and eight men to finish the same job. If two machines can finish the job in 13 days, then how many men can finish the job in 13 days?","h":"Equate 3m+8M to twice (3M+8m) to get the man:machine efficiency ratio.","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"Let a man do $m$ and a machine $M$ per day. Half the time means twice the rate: $3m+8M=2(3M+8m)$.\nSo $2M=13m$: 2 machines do the work of 13 men.\n2 machines take 13 days, so 13 men also take 13 days.\nAnswer: 13","a":"13"},{"n":158,"c":"TW","f":"TW-W4","t":"T","s":"John gets Rs 57 per hour of regular work and Rs 114 per hour of overtime work. He works altogether 172 hours and his income from overtime hours is 15% of his income from regular hours. Then, for how many hours did he work overtime?","h":"Overtime pay is double, so 2 x overtime hours = 15% of regular hours.","yr":2019,"y":"CAT 2019 · Slot 2","l":3,"x":"Let regular hours be $R$ and overtime $O$: $114O=0.15\\times57R$.\nSince $114=2\\times57$: $2O=0.15R$, so $R=\\frac{40}{3}O$.\n$R+O=\\frac{43}{3}O=172$, so $O=12$ hours.\nAnswer: 12","a":"12"},{"n":159,"c":"TW","f":"TW-W4","t":"T","s":"A contractor agreed to construct a 6 km road in 200 days. He employed 140 persons for the work. After 60 days, he realized that only 1.5 km road has been completed. How many additional people would he need to employ in order to finish the work exactly on time?","h":"Compute person-days per km from the first 60 days, then the workforce needed for the rest in 140 days.","yr":2020,"y":"CAT 2020 · Slot 3","l":2,"x":"1.5 km took $140\\times60=8400$ person-days, i.e. 5600 per km.\nRemaining 4.5 km need $4.5\\times5600=25200$ person-days in 140 days.\nThat is $\\frac{25200}{140}=180$ persons, so $180-140=40$ additional.\nAnswer: 40","a":"40"},{"n":160,"c":"TW","f":"TW-W4","t":"T","s":"Anil can paint a house in 12 days while Barun can paint it in 16 days. Anil, Barun, and Chandu undertake to paint the house for Rs. 24000 and the three of them together complete the painting in 6 days. If Chandu is paid in proportion to the work done by him, then the amount in INR received by him is","h":"Chandu's share = 1 - 6/12 - 6/16 of the work.","yr":2021,"y":"CAT 2021 · Slot 3","l":1,"x":"In 6 days Anil does $\\frac{6}{12}=\\frac{1}{2}$ and Barun $\\frac{6}{16}=\\frac{3}{8}$.\nChandu does the rest: $1-\\frac{1}{2}-\\frac{3}{8}=\\frac{1}{8}$.\nHis pay $=\\frac{1}{8}\\times24000=3000$.\nAnswer: 3000","a":"3000"},{"n":161,"c":"TW","f":"TW-W4","t":"T","s":"Working alone, the times taken by Anu, Tanu and Manu to complete any job are in the ratio 5 : 8 : 10. They accept a job which they can finish in 4 days if they all work together for 8 hours per day. However, Anu and Tanu work together for the first 6 days, working 6 hours 40 minutes per day. Then, the number of hours that Manu will take to complete the remaining job working alone is","h":"Take times 5k,8k,10k hours and use 32 joint hours to fix k.","yr":2022,"y":"CAT 2022 · Slot 2","l":3,"x":"Times $5:8:10$ give hourly rates $8:5:4$ (multiply $\\frac{1}{5},\\frac{1}{8},\\frac{1}{10}$ by 40).\nJob $=(8+5+4)\\times4\\times8=544$ units.\nAnu and Tanu: $13\\times6\\times\\frac{20}{3}=520$ units.\nManu does the remaining 24 at 4 per hour: 6 hours.\nAnswer: 6","a":"6"},{"n":162,"c":"TW","f":"TW-W4","t":"M","s":"A group of N people worked on a project. They finished 35% of the project by working 7 hours a day for 10 days. Thereafter, 10 people left the group and the remaining people finished the rest of the project in 14 days by working 10 hours a day. Then the value of N is","h":"Man-hours per unit work: 70N for 35%, 140(N-10) for 65%.","yr":2022,"y":"CAT 2022 · Slot 3","l":2,"x":"Work is proportional to person-hours.\n$35\\%$ took $70N$ person-hours; the remaining $65\\%$ took $(N-10)\\times140$.\n$\\frac{70N}{35}=\\frac{140(N-10)}{65}$, i.e. $26N=28(N-10)$.\n$N=140$.\nAnswer: 140","o":["23","140","36","150"],"ai":1,"a":"140"},{"n":163,"c":"TW","f":"TW-W4","t":"T","s":"Renu would take 15 days working 4 hours per day to complete a certain task whereas Seema would take 8 days working 5 hours per day to complete the same task. They decide to work together to complete this task. Seema agrees to work for double the number of hours per day as Renu, while Renu agrees to work for double the number of days as Seema. If Renu works 2 hours per day, then the number of days Seema will work, is","h":"Convert both to total man-hours (60 and 40) and set Renu 2 h x 2d days, Seema 4 h x d days.","yr":2024,"y":"CAT 2024 · Slot 1","l":3,"x":"Total hours: Renu $15\\times4=60$, Seema $8\\times5=40$.\nRenu works 2 h a day for $2d$ days ($4d$ h); Seema 4 h a day for $d$ days ($4d$ h).\n$\\frac{4d}{60}+\\frac{4d}{40}=1$, i.e. $\\frac{d}{6}=1$.\nSeema works 6 days.\nAnswer: 6","a":"6"},{"n":164,"c":"TW","f":"TW-W5","t":"M","s":"Ramesh and Ganesh can together complete a work in 16 days. After seven days of working together, Ramesh got sick and his efficiency fell by 30%. As a result, they completed the work in 17 days instead of 16 days. If Ganesh had worked alone after Ramesh got sick, in how many days would he have completed the remaining work?","h":"Remaining 9/16 is done in 10 days at 0.7r + g with r + g = 1/16.","yr":2018,"y":"CAT 2018 · Slot 2","l":3,"x":"Let rates be $R$, $G$ with $R+G=\\frac{1}{16}$; 7 days finish $\\frac{7}{16}$.\nThe remaining $\\frac{9}{16}$ took 10 days: $0.7R+G=\\frac{9}{160}$.\nSubtract: $0.3R=\\frac{1}{160}$, so $R=\\frac{1}{48}$ and $G=\\frac{1}{24}$.\nGanesh alone on $\\frac{9}{16}$: $\\frac{9}{16}\\times24=13.5$ days.\nAnswer: 13.5","o":["12","14.5","13.5","11"],"ai":2,"a":"13.5"},{"n":165,"c":"TW","f":"TW-W5","t":"M","s":"At their usual efficiency levels, A and B together finish a task in 12 days. If A had worked half as efficiently as she usually does, and B had worked thrice as efficiently as he usually does, the task would have been completed in 9 days. How many days would A take to finish the task if she works alone at her usual efficiency?","h":"Write a+b=1/12 and a/2+3b=1/9 and eliminate b.","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"Let daily rates be $a$, $b$: $a+b=\\frac{1}{12}$ and $\\frac{a}{2}+3b=\\frac{1}{9}$.\nSubstitute $b=\\frac{1}{12}-a$: $\\frac{a}{2}+\\frac{1}{4}-3a=\\frac{1}{9}$, so $\\frac{5a}{2}=\\frac{5}{36}$.\n$a=\\frac{1}{18}$: A alone takes 18 days.\nAnswer: 18","o":["18","12","24","36"],"ai":0,"a":"18"},{"n":166,"c":"TW","f":"TW-W5","t":"T","s":"Gautam and Suhani, working together, can finish a job in 20 days. If Gautam does only 60% of his usual work on a day, Suhani must do 150% of her usual work on that day to exactly make up for it. Then, the number of days required by the faster worker to complete the job working alone is","h":"0.4g = 0.5s gives efficiency ratio 5:4; combined rate 1/20.","yr":2023,"y":"CAT 2023 · Slot 3","l":2,"x":"Gautam’s lost $40\\%$ equals Suhani’s extra $50\\%$: $0.4G=0.5S$, so $G:S=5:4$.\n$G+S=\\frac{1}{20}$, so $G=\\frac{5}{9}\\times\\frac{1}{20}=\\frac{1}{36}$.\nGautam is faster and takes 36 days alone.\nAnswer: 36","a":"36"},{"n":167,"c":"TW","f":"TW-W5","t":"M","s":"Rahul, Rakshita and Gurmeet, working together, would have taken more than 7 days to finish a job. On the other hand, Rahul and Gurmeet, working together would have taken less than 15 days to finish the job. However, they all worked together for 6 days, followed by Rakshita, who worked alone for 3 more days to finish the job. If Rakshita had worked alone on the job then the number of days she would have taken to finish the job, cannot be","h":"From 6(all)+3(Rakshita)=1, convert both given time bounds into bounds on Rakshita's rate.","yr":2023,"y":"CAT 2023 · Slot 3","l":4,"x":"Let daily rates be $a$ (Rahul), $r$ (Rakshita), $g$ (Gurmeet): $6(a+r+g)+3r=1$, so $a+g=\\frac{1-9r}{6}$.\n$a+r+g=\\frac{1-3r}{6}<\\frac{1}{7}$ gives $r>\\frac{1}{21}$: her time $<21$.\n$a+g>\\frac{1}{15}$ gives $1-9r>\\frac{2}{5}$, $r<\\frac{1}{15}$: her time $>15$.\nSo her time is 16 to 20 days; it cannot be 21.\nAnswer: 21","o":["17","21","16","20"],"ai":1,"a":"21"},{"n":168,"c":"TSD","f":"TSD-S1","t":"M","s":"Arun drove from home to his hostel at 60 miles per hour. While returning home he drove half way along the same route at a speed of 25 miles per hour and then took a bypass road which increased his driving distance by 5 miles, but allowed him to drive at 50 miles per hour along this bypass road. If his return journey took 30 minutes more than his onward journey, then the total distance travelled by him is:","h":"Equate return time (half at 25, half+5 at 50) minus onward time to half an hour.","yr":2017,"y":"CAT 2017 · Slot 2","l":3,"x":"Let one-way distance be $d$; onward time $\\frac{d}{60}$.\nReturn: $\\frac{d/2}{25}+\\frac{d/2+5}{50}=\\frac{3d}{100}+\\frac{1}{10}$.\n$\\frac{3d}{100}+\\frac{1}{10}-\\frac{d}{60}=\\frac{1}{2}$ gives $\\frac{d}{75}=\\frac{2}{5}$, so $d=30$.\nTotal $=30+(30+5)=65$ miles.\nAnswer: 65 miles","o":["55 miles","60 miles","65 miles","70 miles"],"ai":2,"a":"65 miles"},{"n":169,"c":"TSD","f":"TSD-S1","t":"T","s":"Point P lies between points A and B such that the length of BP is thrice that of AP. Car 1 starts from A and moves towards B. Simultaneously, car 2 starts from B and moves towards A. Car 2 reaches P one hour after car 1 reaches P. If the speed of car 2 is half that of car 1, then the time, in minutes, taken by car 1 in reaching P from A is:","h":"Car 2 covers 3x at half speed, so takes 6 times as long as car 1; difference is 1 h.","yr":2018,"y":"CAT 2018 · Slot 1","l":2,"x":"Let $AP=x$, $BP=3x$; car 1 speed $2u$, car 2 speed $u$.\nCar 1 time $=\\frac{x}{2u}$; car 2 time $=\\frac{3x}{u}=6\\times\\frac{x}{2u}$.\nSo car 2 takes 6 times as long; the gap of 5 parts $=60$ min, one part $=12$ min.\nCar 1 takes 12 minutes.\nAnswer: 12","a":"12"},{"n":170,"c":"TSD","f":"TSD-S1","t":"T","s":"Points A and B are 150 km apart. Cars 1 and 2 travel from A to B, but car 2 starts from A when car 1 is already 20 km away from A. Each car travels at a speed of 100 kmph for the first 50 km, at 50 kmph for the next 50 km, and at 25 kmph for the last 50 km. The distance, in km, between car 2 and B when car 1 reaches B is","h":"Car 2 starts 0.2 h behind; find car 2's position at car 1's total time of 3.5 h.","yr":2018,"y":"CAT 2018 · Slot 2","l":4,"x":"Car 1’s total time $=\\frac{50}{100}+\\frac{50}{50}+\\frac{50}{25}=0.5+1+2=3.5$ h.\nCar 2 starts when car 1 has done 20 km, i.e. $0.2$ h later, so car 2 has $3.3$ h.\nCar 2: first 100 km take $1.5$ h; in the remaining $1.8$ h at 25 km/h it covers $45$ km.\nCar 2 is at 145 km, so $5$ km from B.\nAnswer: 5","a":"5"},{"n":171,"c":"TSD","f":"TSD-S1","t":"M","s":"One can use three different transports which move at 10, 20, and 30 kmph, respectively. To reach from A to B, Amal took each mode of transport 1/3 of his total journey time, while Bimal took each mode of transport 1/3 of the total distance. The percentage by which Bimal’s travel time exceeds Amal’s travel time is nearest to","h":"Amal's average speed is the AM (20), Bimal's the HM of 10, 20, 30.","yr":2019,"y":"CAT 2019 · Slot 1","l":2,"x":"Equal times: Amal’s average speed is the AM, $\\frac{10+20+30}{3}=20$.\nEqual distances: Bimal’s average speed is the HM, $\\frac{3}{\\frac{1}{10}+\\frac{1}{20}+\\frac{1}{30}}=\\frac{180}{11}$.\nFor the same distance, time ratio $=\\frac{20}{180/11}=\\frac{220}{180}=1.222$.\nBimal takes about $22\\%$ more.\nAnswer: 22","o":["22","19","21","20"],"ai":0,"a":"22"},{"n":172,"c":"TSD","f":"TSD-S1","t":"M","s":"The wheels of bicycles A and B have radii 30 cm and 40 cm, respectively. While traveling a certain distance, each wheel of A required 5000 more revolutions than each wheel of B. If bicycle B traveled this distance in 45 minutes, then its speed, in km per hour, was","h":"Revolution difference x circumferences gives distance via 1/60 - 1/80.","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"Revolutions $=\\frac{D}{2π r}$, so $\\frac{D}{60π}-\\frac{D}{80π}=5000$ (cm).\n$\\frac{D}{240π}=5000$, so $D=1200000π$ cm $=12π$ km.\nSpeed of B $=\\frac{12π}{3/4}=16π$ km/h.\nAnswer: 16π","o":["18π","16π","12π","14π"],"ai":1,"a":"16π"},{"n":173,"c":"TSD","f":"TSD-S1","t":"M","s":"The distance from B to C is thrice that from A to B. Two trains travel from A to C via B. The speed of train 2 is double that of train 1 while traveling from A to B and their speeds are interchanged while traveling from B to C. The ratio of the time taken by train 1 to that taken by train 2 in travelling from A to C is","h":"Take AB = 1, BC = 3 and add leg times for each train.","yr":2020,"y":"CAT 2020 · Slot 2","l":1,"x":"Take $AB=1$, $BC=3$; train 1 runs at $v$ on AB and $2v$ on BC, train 2 the reverse.\nTrain 1: $\\frac{1}{v}+\\frac{3}{2v}=\\frac{5}{2v}$. Train 2: $\\frac{1}{2v}+\\frac{3}{v}=\\frac{7}{2v}$.\nRatio $=5:7$.\nAnswer: 5:7","o":["7:5","4:1","1:4","5:7"],"ai":3,"a":"5:7"},{"n":174,"c":"TSD","f":"TSD-S1","t":"M","s":"Brishti went on an 8-hour trip in a car. Before the trip, the car had travelled a total of x km till then, where x is a whole number and is palindromic, i.e., x remains unchanged when its digits are reversed. At the end of the trip, the car had travelled a total of 26862 km till then, this number again being palindromic. If Brishti never drove at more than 110 km/h, then the greatest possible average speed at which she drove during the trip, in km/h, was","h":"Find the smallest 5-digit palindrome at least 26862-880.","yr":2023,"y":"CAT 2023 · Slot 1","l":4,"x":"In 8 h at most $8\\times110=880$ km, so the start reading $x\\ge26862-880=25982$.\nGreatest speed means smallest such palindrome: 25952 is too small, next is 26062.\nDistance $=26862-26062=800$ km; average $=\\frac{800}{8}=100$ km/h.\nAnswer: 100","o":["90","100","80","110"],"ai":1,"a":"100"},{"n":175,"c":"TSD","f":"TSD-S2","t":"T","s":"A man leaves his home and walks at a speed of 12 km per hour, reaching the railway station 10 minutes after the train had departed. If instead he had walked at a speed of 15 km per hour, he would have reached the station 10 minutes before the train’s departure. The distance (in km) from his home to the railway station is:","h":"Time difference d/12 - d/15 = 20 minutes.","yr":2017,"y":"CAT 2017 · Slot 1","l":1,"x":"The two arrivals differ by $10+10=20$ min $=\\frac{1}{3}$ h.\n$\\frac{d}{12}-\\frac{d}{15}=\\frac{1}{3}$, i.e. $\\frac{d}{60}=\\frac{1}{3}$.\n$d=20$ km.\nAnswer: 20","a":"20"},{"n":176,"c":"TSD","f":"TSD-S2","t":"M","s":"The distance from A to B is 60 km. Partha and Narayan start from A at the same time and move towards B. Partha takes four hours more than Narayan to reach B. Moreover, Partha reaches the mid-point of A and B two hours before Narayan reaches B. The speed of Partha, in km per hour, is","h":"Partha's half-journey time equals Narayan's full time minus 2; Partha's full time is Narayan's plus 4.","yr":2018,"y":"CAT 2018 · Slot 1","l":4,"x":"Let Narayan take $t$ h; Partha takes $t+4$ h, so half-way takes him $\\frac{t+4}{2}$ h.\n$\\frac{t+4}{2}=t-2$ gives $t=8$.\nPartha takes 12 h for 60 km: $5$ km/h.\nAnswer: 5","o":["6","3","4","5"],"ai":3,"a":"5"},{"n":177,"c":"TSD","f":"TSD-S2","t":"M","s":"Two cars travel the same distance starting at 10:00 am and 11:00 am, respectively, on the same day. They reach their common destination at the same point of time. If the first car travelled for at least 6 hours, then the highest possible value of the percentage by which the speed of the second car could exceed that of the first car is","h":"Speed ratio t/(t-1) with t >= 6; excess 1/(t-1) is largest at t = 6.","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"If car 1 takes $t$ h, car 2 takes $t-1$ h; speed ratio $=\\frac{t}{t-1}$.\nExcess $=\\frac{1}{t-1}$, largest when $t$ is smallest, $t=6$.\nMaximum excess $=\\frac{1}{5}=20\\%$.\nAnswer: 20","o":["20","10","35","25"],"ai":0,"a":"20"},{"n":178,"c":"TSD","f":"TSD-S2","t":"M","s":"Leaving home at the same time, Amal reaches office at 10:15 am if he travels at 8kmph, and at 9:40 am if he travels at 15kmph. Leaving home at 9:10 am, at what speed, in kmph, must he travel so as to reach office exactly at 10:00 am?","h":"Use the 35-minute difference to get the distance, then required speed over 50 minutes.","yr":2020,"y":"CAT 2020 · Slot 1","l":3,"x":"The two arrival times differ by 35 min: $\\frac{d}{8}-\\frac{d}{15}=\\frac{35}{60}$.\n$\\frac{7d}{120}=\\frac{7}{12}$, so $d=10$ km.\nHe needs 10 km in 50 min: speed $=\\frac{10}{5/6}=12$ km/h.\nAnswer: 12","o":["12","11","13","14"],"ai":0,"a":"12"},{"n":179,"c":"TSD","f":"TSD-S2","t":"M","s":"A train travelled at one-thirds of its usual speed, and hence reached the destination 30 minutes after the scheduled time. On its return journey, the train initially travelled at its usual speed for 5 minutes but then stopped for 4 minutes for an emergency. The percentage by which the train must now increase its usual speed so as to reach the destination at the scheduled time, is nearest to","h":"At 1/3 speed the delay is twice the usual time, fixing the usual time; the remaining distance has 4 fewer minutes.","yr":2020,"y":"CAT 2020 · Slot 1","l":4,"x":"At $\\frac{1}{3}$ speed the trip takes $3T$, so the delay $2T=30$ min and $T=15$ min.\nReturn: 5 min at usual speed covers $\\frac{1}{3}$ of the route; 4 min stop.\nThe remaining $\\frac{2}{3}$ normally needs 10 min but only $15-9=6$ min are left.\nSpeed must be $\\frac{10}{6}$ times usual: increase $\\approx66.7\\%$, nearest 67.\nAnswer: 67","o":["58","67","50","61"],"ai":1,"a":"67"},{"n":180,"c":"TSD","f":"TSD-S2","t":"M","s":"Vimla starts for office every day at 9 am and reaches exactly on time if she drives at her usual speed of 40 km/hr. She is late by 6 minutes if she drives at 35 km/hr. One day, she covers two-thirds of her distance to office in one-thirds of her usual time to reach office, and then stops for 8 minutes. The speed, in km/hr, at which she should drive the remaining distance to reach office exactly on time is","h":"Late by 6 min gives distance; usual time split into 1/3, stop, and what is left.","yr":2020,"y":"CAT 2020 · Slot 3","l":3,"x":"Late by 6 min: $\\frac{d}{35}-\\frac{d}{40}=\\frac{1}{10}$, so $d=28$ km; usual time $=\\frac{28}{40}$ h $=42$ min.\nShe covers $\\frac{2}{3}$ of 28 in 14 min, then stops 8 min: 22 min used.\nRemaining $\\frac{28}{3}$ km in 20 min $=\\frac{1}{3}$ h.\nSpeed $=\\frac{28/3}{1/3}=28$ km/h.\nAnswer: 28","o":["27","28","29","26"],"ai":1,"a":"28"},{"n":181,"c":"TSD","f":"TSD-S2","t":"M","s":"A bus starts at 9 am and follows a fixed route every day. One day, it traveled at a constant speed of 60 km per hour and reached its destination 3.5 hours later than its scheduled arrival time. Next day, it traveled two-thirds of its route in one-third of its total scheduled travel time, and the remaining part of the route at 40 km per hour to reach just on time. The scheduled arrival time of the bus is","h":"Day 2 gives D/120 = 2T/3; Day 1 gives D/60 = T + 3.5.","yr":2024,"y":"CAT 2024 · Slot 2","l":3,"x":"Let route $D$ and scheduled time $T$ h.\nDay 2: last $\\frac{D}{3}$ at 40 km/h takes the remaining $\\frac{2T}{3}$, so $\\frac{D}{120}=\\frac{2T}{3}$, i.e. $D=80T$.\nDay 1: $\\frac{D}{60}=T+3.5$, so $\\frac{4T}{3}=T+3.5$ and $T=10.5$ h.\nScheduled arrival $=$ 9 am $+10.5$ h $=$ 7:30 pm.\nAnswer: 7 : 30 pm","o":["10 : 30 pm","7 : 00 pm","7 : 30 pm","9 : 00 pm"],"ai":2,"a":"7 : 30 pm"},{"n":182,"c":"TSD","f":"TSD-S2","t":"M","s":"A train travelled a certain distance at a uniform speed. Had the speed been 6 km per hour more, it would have needed 4 hours less. Had the speed been 6 km per hour less, it would have needed 6 hours more. The distance, in km, travelled by the train is","h":"Constant distance: (v+6)(t-4) = vt and (v-6)(t+6) = vt.","yr":2024,"y":"CAT 2024 · Slot 3","l":2,"x":"Distance is fixed: $(v+6)(t-4)=vt$ and $(v-6)(t+6)=vt$.\nThese give $6t-4v=24$ and $v-t=6$.\nSubstituting $v=t+6$: $2t-24=24$, so $t=24$, $v=30$.\nDistance $=30\\times24=720$ km.\nAnswer: 720","o":["780","720","640","800"],"ai":1,"a":"720"},{"n":183,"c":"TSD","f":"TSD-S3","t":"M","s":"A motorbike leaves point A at 1 pm and moves towards point B at a uniform speed. A car leaves point B at 2 pm and moves towards point A at a uniform speed which is double that of the motorbike. They meet at 3:40 pm at a point which is 168 km away from A. What is the distance, in km, between A and B?","h":"Bike travels 8/3 h to cover 168 km; car at double speed for 5/3 h.","yr":2017,"y":"CAT 2017 · Slot 2","l":2,"x":"By 3:40 pm the bike has ridden $\\frac{8}{3}$ h for 168 km, so its speed is $63$ km/h.\nThe car (126 km/h) has driven from 2 pm, i.e. $\\frac{5}{3}$ h: $126\\times\\frac{5}{3}=210$ km.\n$AB=168+210=378$ km.\nAnswer: 378","o":["364","378","380","388"],"ai":1,"a":"378"},{"n":184,"c":"TSD","f":"TSD-S3","t":"T","s":"Train T leaves station X for station Y at 3 pm. Train S, traveling at three quarters of the speed of T, leaves Y for X at 4 pm. The two trains pass each other at a station Z, where the distance between X and Z is three-fifths of that between X and Y. How many hours does train T take for its journey from X to Y?","h":"Distances to Z are 3:2 and speeds 4:3; equate T's time to S's time plus 1 hour.","yr":2018,"y":"CAT 2018 · Slot 1","l":3,"x":"Let $XZ=3k$, $ZY=2k$ and speeds $T=4u$, $S=3u$.\nT runs one hour longer to Z: $\\frac{3k}{4u}-\\frac{2k}{3u}=1$, so $\\frac{k}{12u}=1$, $\\frac{k}{u}=12$.\nT’s full journey $=\\frac{5k}{4u}=\\frac{5}{4}\\times12=15$ hours.\nAnswer: 15","a":"15"},{"n":185,"c":"TSD","f":"TSD-S3","t":"T","s":"On a long stretch of east-west road, A and B are two points such that B is 350 km west of A. One car starts from A and another from B at the same time. If they move towards each other, then they meet after 1 hour. If they both move towards east, then they meet in 7 hrs. The difference between their speeds, in km per hour, is","h":"Relative speed while chasing = 350/7.","yr":2018,"y":"CAT 2018 · Slot 2","l":1,"x":"Moving towards each other: sum of speeds $=\\frac{350}{1}=350$ km/h (not needed).\nBoth moving east, the car from B chases the one from A, closing a 350 km gap in 7 h.\nDifference of speeds $=\\frac{350}{7}=50$ km/h.\nAnswer: 50","a":"50"},{"n":186,"c":"TSD","f":"TSD-S3","t":"M","s":"Points A, P, Q and B lie on the same line such that P, Q and B are, respectively, 100 km, 200 km and 300 km away from A. Cars 1 and 2 leave A at the same time and move towards B. Simultaneously, car 3 leaves B and moves towards A. Car 3 meets Car 1 at Q, and Car 2 at P. If each car is moving in uniform speed then the ratio of the speed of Car 2 to that of Car 1 is","h":"Car 3's distance to each meeting point gives each car's speed relative to car 3.","yr":2018,"y":"CAT 2018 · Slot 2","l":4,"x":"Compare each car with car 3 over the same time.\nAt Q: car 1 did 200 km while car 3 did 100 km, so $v_1=2c$.\nAt P: car 2 did 100 km while car 3 did 200 km, so $v_2=\\frac{c}{2}$.\n$v_2:v_1=\\frac{1}{2}:2=1:4$.\nAnswer: 1 : 4","o":["1 : 4","2 : 9","1 : 2","2 : 7"],"ai":0,"a":"1 : 4"},{"n":187,"c":"TSD","f":"TSD-S3","t":"M","s":"A cyclist leaves A at 10 am and reaches B at 11 am. Starting from 10:01 am, every minute a motorcycle leaves A and moves towards B. Forty-five such motorcycles reach B by 11 am. All motorcycles have the same speed. If the cyclist had doubled his speed, how many motorcycles would have reached B by the time the cyclist reached B?","h":"45 bikes arriving by 11:00 fixes bike travel time at 15 min; cyclist now arrives at 10:30.","yr":2019,"y":"CAT 2019 · Slot 2","l":4,"x":"Bikes leave at 10:01, 10:02, … The 45th (10:45) arrives by 11:00 but the 46th does not, so a bike takes 15 min.\nAt double speed the cyclist reaches B at 10:30.\nBikes that left by 10:15 make it: 10:01 to 10:15, i.e. $15$ bikes.\nAnswer: 15","o":["22","20","15","23"],"ai":2,"a":"15"},{"n":188,"c":"TSD","f":"TSD-S3","t":"M","s":"A straight road connects points A and B. Car 1 travels from A to B and Car 2 travels from B to A, both leaving at the same time. After meeting each other, they take 45 minutes and 20 minutes, respectively, to complete their journeys. If Car 1 travels at the speed of 60 km/hr, then the speed of Car 2, in km/hr, is","h":"After-meeting times: v1/v2 = sqrt(t2/t1).","yr":2020,"y":"CAT 2020 · Slot 1","l":2,"x":"After meeting, each car covers what the other covered before, so $\\frac{v_1}{v_2}=\\sqrt{\\frac{t_2}{t_1}}$.\n$\\frac{60}{v_2}=\\sqrt{\\frac{20}{45}}=\\frac{2}{3}$.\n$v_2=90$ km/h.\nAnswer: 90","o":["90","80","70","100"],"ai":0,"a":"90"},{"n":189,"c":"TSD","f":"TSD-S3","t":"M","s":"A and B are two points on a straight line. Ram runs from A to B while Rahim runs from B to A. After crossing each other, Ram and Rahim reach their destinations in one minutes and four minutes, respectively. If they start at the same time, then the ratio of Ram’s speed to Rahim’s speed is","h":"After crossing, the speed ratio is the square root of the inverse ratio of remaining times.","yr":2020,"y":"CAT 2020 · Slot 2","l":3,"x":"After crossing, each covers the stretch the other ran before, so $\\frac{v_{Ram}}{v_{Rahim}}=\\sqrt{\\frac{t_{Rahim}}{t_{Ram}}}$.\n$\\sqrt{\\frac{4}{1}}=2$.\nAnswer: 2","o":["2","2√2","√2","1/2"],"ai":0,"a":"2"},{"n":190,"c":"TSD","f":"TSD-S3","t":"M","s":"A and B are two railway stations 90 km apart. A train leaves A at 9:00 am, heading towards B at a speed of 40 km/hr. Another train leaves B at 10:30 am, heading towards A at a speed of 20 km/hr. The trains meet each other at","h":"Find the gap when the second train starts, then divide by relative speed.","yr":2020,"y":"CAT 2020 · Slot 3","l":2,"x":"By 10:30 am the first train has run $1.5\\times40=60$ km; gap left $=30$ km.\nNow they close at $40+20=60$ km/h, taking $\\frac{30}{60}=\\frac{1}{2}$ h.\nThey meet at 11:00 am.\nAnswer: 11 : 00 am","o":["11 : 20 am","11 : 00 am","10 : 45 am","11 : 45 am"],"ai":1,"a":"11 : 00 am"},{"n":191,"c":"TSD","f":"TSD-S3","t":"M","s":"Trains A and B start traveling at the same time towards each other with constant speeds from stations X and Y, respectively. Train A reaches station Y in 10 minutes while train B takes 9 minutes to reach station X after meeting train A. Then the total time taken, in minutes, by train B to travel from station Y to station X is","h":"A’s 10 minutes is its whole trip. If they meet after t minutes, A has (10 − t) minutes left; use t² = (time A has left) × (time B has left).","yr":2022,"y":"CAT 2022 · Slot 1","l":3,"x":"Here 10 min is A’s whole trip. If they meet after $t$ min, A has $10-t$ min left.\nMeeting rule: $t^2=$ (A’s time after meeting) $\\times$ (B’s time after meeting) $=(10-t)\\times9$.\n$t^2+9t-90=0$, so $t=6$.\nB’s total $=6+9=15$ min.\nAnswer: 15","o":["15","12","6","10"],"ai":0,"a":"15"},{"n":192,"c":"TSD","f":"TSD-S3","t":"M","s":"Two ships meet mid-ocean, and then, one ship goes south and the other ship goes west, both travelling at constant speeds. Two hours later, they are 60 km apart. If the speed of one of the ships is 6 km per hour more than the other one, then the speed, in km per hour, of the slower ship is","h":"Displacements are perpendicular: (2v)^2 + (2v+12)^2 = 60^2.","yr":2022,"y":"CAT 2022 · Slot 2","l":3,"x":"South and west are perpendicular, so after 2 h the gap is the hypotenuse.\n$(2v)^2+(2v+12)^2=60^2$, i.e. $v^2+(v+6)^2=900$.\n$18^2+24^2=324+576=900$, so $v=18$ km/h.\nAnswer: 18","o":["12","18","20","24"],"ai":1,"a":"18"},{"n":193,"c":"TSD","f":"TSD-S3","t":"M","s":"Two ships are approaching a port along straight routes at constant speeds. Initially, the two ships and the port
