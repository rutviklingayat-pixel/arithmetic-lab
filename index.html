.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:6px}
/* login */

.hk{font-size:12px;font-weight:900;letter-spacing:.12em;color:#f5a25d;text-transform:uppercase;display:flex;align-items:center;gap:8px}

.hpills{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.hpills span{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}

.cdl{font-size:11.5px;letter-spacing:.1em;font-weight:900;color:#b9c4d6;margin-bottom:7px}
.boxes{display:flex;gap:8px}.boxes span{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:12px;min-width:66px;padding:8px 10px;text-align:center}
.boxes b{display:block;font-size:30px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.1}.boxes i{font-style:normal;font-size:11px;color:#b9c4d6;letter-spacing:.06em;text-transform:uppercase}

.hero.p{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;border-top:4px solid var(--bl)}

.hero.p .t{font-family:var(--serif);font-weight:600;font-size:23px;margin:6px 0 6px}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;min-width:0}

.ring{width:46px;height:46px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}.ring::before{content:"";width:34px;height:34px;border-radius:50%;background:var(--card)}
.mbar{height:7px;background:var(--nv);border-radius:9px;overflow:hidden;margin-top:8px}.mbar i{display:block;height:100%;background:var(--bl);border-radius:9px}
.month{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:6px}
.dd{height:48px;border-radius:10px;background:var(--nv);color:var(--mut);font-size:12px;font-weight:900;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}

.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:12.5px;color:var(--mut)}.legend span{display:flex;align-items:center;gap:6px}.legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
.hm{display:grid;grid-template-columns:minmax(96px,1.5fr) repeat(5,minmax(0,1fr));gap:6px;align-items:center;font-size:13.5px}

.h1{background:#f6d5d2!important;color:var(--badd)!important}.h2{background:#fbe3c4!important;color:#8a4b06!important}.h3{background:#c9ead6!important;color:var(--okd)!important}.h4{background:var(--ok)!important;color:#fff!important}
.lr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;font-size:14px}.lr.me{background:var(--orbg);font-weight:900}

.qa{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer}

.cat{display:grid;grid-template-columns:minmax(0,1fr) 340px;grid-template-areas:"head head" "main pal" "main rest";grid-template-rows:auto auto 1fr;min-height:calc(100vh - 62px)}

.timer{display:flex;flex-direction:column;background:var(--navy);color:#fff;border-radius:10px;padding:6px 14px;line-height:1.15;min-width:104px}

.timer.lt{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}.timer.lt small{color:var(--mut)}
.clock{font-variant-numeric:tabular-nums}.clock.over{color:var(--warn)}
.cmain{grid-area:main;display:flex;flex-direction:column;min-width:0}
.qbar{background:var(--card);border-bottom:1px solid var(--line);padding:12px 28px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}

.tag.ok{background:var(--okbg);color:var(--okd)}.tag.bad{background:var(--badbg);color:var(--badd)}.tag.or{background:var(--orbg);color:#a24f0b}
.qarea{flex:1;padding:30px 28px;max-width:920px;width:100%}
.stem{font-family:var(--serif);font-size:20px;line-height:1.6;margin:0 0 22px;overflow-x:auto}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--optln);border-radius:12px;padding:13px 16px;margin:0 0 10px;font-family:var(--serif);font-size:18px;cursor:pointer;overflow-x:auto;color:var(--ink)}
.opt:hover{border-color:var(--hov)}
.opt b{width:32px;height:32px;flex:none;border-radius:8px;background:var(--nv);color:var(--ink2);display:flex;align-items:center;justify-content:center;font:900 14px var(--sans)}
.opt.pick{border-color:var(--bl);background:var(--blbg);box-shadow:inset 0 0 0 1px var(--bl)}.opt.pick b{background:var(--bl);color:#fff}
.opt.right{border-color:var(--ok);background:var(--okbg)}.opt.right b{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)}.opt.wrong b{background:var(--bad);color:#fff}
.tita{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}.tita .in{flex:1 1 260px}
#ti{width:100%;height:58px;font:900 24px var(--sans);font-variant-numeric:tabular-nums;border-radius:12px}
.kp{flex:0 0 236px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.cpal{grid-area:pal;background:var(--card);border-left:1px solid var(--line);padding:20px 20px 4px}
.crest{grid-area:rest;background:var(--card);border-left:1px solid var(--line);padding:12px 20px 22px;display:flex;flex-direction:column;gap:14px}
.me2{display:flex;align-items:center;gap:12px;margin-bottom:16px}.me2 b{display:block}.me2 small{color:var(--mut);font-size:13px}
.lgd{display:grid;grid-template-columns:1fr 1fr;gap:9px 10px;padding:12px;background:var(--soft);border-radius:12px;font-size:12.5px;color:var(--ink2);margin-bottom:16px}
.lgd div{display:flex;align-items:center;gap:8px}.lgd .w{grid-column:span 2}
.crest .lgd{display:none;margin:0}
.pal{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:4px}
.pt{position:relative;height:44px;font:900 14.5px var(--sans);cursor:pointer;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:var(--nv);color:var(--ink2);border-radius:6px;padding:0}
.pt.sq{width:26px;height:24px;font-size:11.5px;cursor:default;flex:none}
.pt.a{background:var(--ok);color:#fff;border-color:var(--ok);border-radius:6px 6px 18px 18px}

.pt.am::after{content:"";position:absolute;right:-3px;bottom:-3px;width:11px;height:11px;border-radius:50%;background:var(--ok);border:2px solid var(--card)}
.pt.sn{background:var(--card);color:var(--bld);border:1.5px solid var(--bl)}.pt.ok{background:var(--ok);color:#fff;border-color:var(--ok)}.pt.no{background:var(--bad);color:#fff;border-color:var(--bad)}

.modal{position:fixed;inset:0;background:rgba(21,34,56,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}

.calc .ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.calc .ch button{border:0;background:none;font-size:22px;cursor:pointer;color:var(--mut)}
.calc .cdp{background:var(--navy);color:#fff;border-radius:10px;padding:10px 12px;text-align:right;font:900 24px var(--sans);font-variant-numeric:tabular-nums;overflow:hidden;white-space:nowrap;margin-bottom:10px}

.calc .cg button.o{background:var(--blbg);color:var(--bld);border-color:var(--line2)}.calc .cg button.e{background:var(--ok);color:#fff;border-color:var(--ok)}.calc .cg button.c{color:var(--bad)}
/* lists, days, ladder, practice */
.list{display:flex;flex-direction:column;gap:10px}
.it{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}

.tile.miss{background:var(--card);color:var(--badd);border:1.5px dashed var(--badln);cursor:default}
.lad{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(5,minmax(78px,1fr));gap:8px;align-items:center;min-width:620px}

.lad .tile{height:58px}.lad .tile.open{border-color:var(--bl);background:var(--blbg);color:var(--bld)}
.rules{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.rules li{display:flex;gap:12px;font-size:14.5px;line-height:1.5}.rules li i{width:24px;height:24px;border-radius:50%;background:var(--blbg);color:var(--bld);font-style:normal;font-weight:900;font-size:12px;flex:none;display:flex;align-items:center;justify-content:center;margin-top:1px}
.pgrid{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start;margin-top:16px}
.pgrid .sum{position:sticky;top:16px}
.pgrid h3:first-child{margin-top:0}
.big{font-size:46px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.mode{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode .chip{text-align:left;padding:12px 14px;font-weight:400}.mode .chip b{display:block;font-size:15px;color:var(--ink)}
.hc{display:inline-block;min-width:54px;border-radius:8px;padding:4px 6px;background:var(--nv);color:var(--mut);font-weight:900}
@media(prefers-reduced-motion:reduce){.spin,.hk .dot{animation:none}}
@media(max-width:980px){.hgrid,.pgrid{grid-template-columns:1fr}.pgrid .sum{position:static}}
@media(max-width:900px){
 .cat{grid-template-columns:minmax(0,1fr);grid-template-areas:"head" "pal" "main" "rest";grid-template-rows:auto;min-height:0}
 .chead{padding:8px 14px;gap:8px}.chead .tt{min-width:0}.chead .tt b{font-size:15px}.timer{min-width:0;padding:5px 10px}.timer .clock{font-size:18px}
 .cpal{border-left:0;border-bottom:1px solid var(--line);padding:8px 10px}.cpal .lgd,.cpal .lbl,.cpal .me2{display:none}
 .pal{display:flex;overflow-x:auto;gap:8px;padding:6px;scrollbar-width:thin}.pal .pt{flex:0 0 40px;height:40px}
 .crest{border-left:0;border-top:1px solid var(--line);padding:16px}.crest .lgd{display:grid}
 .qarea{padding:20px 16px}.qbar{padding:10px 16px}.abar{padding:10px 12px;gap:8px}.abar .sp{display:none}.abar .btn{flex:1 1 auto;padding:10px 10px;font-size:13.5px}.abar .btn.go{flex-basis:100%;order:9;padding:13px}
 .stem{font-size:18px}.opt{font-size:17px;padding:11px 13px}.kp{flex:1 1 100%}

   purple for personal bests and fastest laps. Questions keep the serif face so the exam reads like CAT. */
:root{--bg:#e8eaee;--card:#ffffff;--soft:#f4f5f7;--line:#d7dbe2;--line2:#b6bdc9;--ink:#0e1116;--ink2:#2b323e;--mut:#59626f;

  --ok:#11924f;--okd:#0c6e3b;--okbg:#e2f4ea;--bad:#d23b2f;--badd:#a62b21;--badbg:#fbeae8;--pur:#7b3fe4;--purd:#5f2cc0;--purbg:#f1eafd;

  --or:#ff7a1a;--orh:#ff8f3d;--ord:#ffab6b;--orbg:#2a1a0f;--navy:#07090c;--nv:#1b212c;--bl:#5b8cff;--bld:#a9c1ff;--blbg:#17223a;--blh:#7aa2ff;
  --ok:#2fd27a;--okd:#7ee8ad;--okbg:#10291c;--bad:#ff5a4e;--badd:#ff9b93;--badbg:#2e1414;--pur:#a35cff;--purd:#c99bff;--purbg:#24173b;
  --warn:#ffb648;--warnbg:#2c2110;--carbon:#07090c;--carbon2:#131820;--tower:#10141b;--hov:#5b8cff}

S2 · Speed-time inverse proportion","TSD-S3":"TSD-S3 · Meeting & overtaking on a straight line","TSD-S4":"TSD-S4 · Trains: lengths, platforms, crossing people/trains","TSD-S5":"TSD-S5 · Boats & streams, escalators","TSD-S6":"TSD-S6 · Races & circular tracks"},"famch":{"PCT-P1":"PCT","PCT-P2":"PCT","PCT-P3":"PCT","PCT-P4":"PCT","PL-L1":"PL","PL-L2":"PL","PL-L3":"PL","PL-L4":"PL","SICI-I1":"SICI","SICI-I2":"SICI","SICI-I3":"SICI","SICI-I4":"SICI","RAT-R1":"RAT","RAT-R2":"RAT","RAT-R3":"RAT","RAT-R4":"RAT","AVG-A1":"AVG","AVG-A2":"AVG","AVG-A3":"AVG","AVG-A4":"AVG","MIX-M1":"MIX","MIX-M2":"MIX","MIX-M3":"MIX","MIX-M4":"MIX","TW-W1":"TW","TW-W2":"TW","TW-W3":"TW","TW-W4":"TW","TW-W5":"TW","TSD-S1":"TSD","TSD-S2":"TSD","TSD-S3":"TSD","TSD-S4":"TSD","TSD-S5":"TSD","TSD-S6":"TSD"},"grid":{"PCT":[11,16,21,20,12],"PL":[8,10,14,13,8],"SICI":[5,8,11,10,6],"RAT":[7,11,14,13,8],"AVG":[12,19,25,23,15],"MIX":[11,16,22,19,12],"TW":[12,19,25,23,15],"TSD":[14,21,28,26,17]},"pyq":[{"n":1,"c":"PCT","f":"PCT-P1","t":"T","s":"Arun’s present age in years is 40% of Barun’s. In another few years, Arun’s age will be half of Barun’s. By what percentage will Barun’s age increase during this period?","h":"A = 0.4B; after t years A + t = (B + t)/2 gives t as a fraction of B.","yr":2017,"y":"CAT 2017 · Slot 1","l":2,"x":"Take Barun as $5k$ and Arun as $2k$. After $y$ years: $2k + y = \\frac{5k + y}{2}$.\n$4k + 2y = 5k + y$, so $y = k$.\nBarun goes from $5k$ to $6k$: up $\\frac{k}{5k} = 20\\%$.\nAnswer: 20","a":"20"},{"n":2,"c":"PCT","f":"PCT-P1","t":"M","s":"Out of the shirts produced in a factory, 15% are defective, while 20% of the rest are sold in the domestic market. If the remaining 8840 shirts are left for export, then the number of shirts produced in the factory is","h":"Exports are 80% of 85% of production.","yr":2017,"y":"CAT 2017 · Slot 2","l":1,"x":"Export is $80\\%$ of the non-defective $85\\%$: $0.8 \\times 0.85 = 0.68$ of production.\n$0.68N = 8840$\n$N = 13000$\nAnswer: 13000","o":["13600","13000","13400","14000"],"ai":1,"a":"13000"},{"n":3,"c":"PCT","f":"PCT-P1","t":"M","s":"In an examination, the maximum possible score is N while the pass mark is 45% of N. A candidate obtains 36 marks, but falls short of the pass mark by 68%. Which one of the following is then correct?","h":"Obtained marks are 32% of the pass mark 0.45N.","yr":2018,"y":"CAT 2018 · Slot 1","l":2,"x":"Falling short by $68\\%$ means 36 is only $32\\%$ of the pass mark.\nPass mark $= \\frac{36}{0.32} = 112.5 = 0.45N$.\n$N = \\frac{112.5}{0.45} = 250$, which lies in $243 \\le N \\le 252$.\nAnswer: 243 ≤ N ≤ 252","o":["N ≤ 200","243 ≤ N ≤ 252","N ≥ 253","201 ≤ N ≤ 242"],"ai":1,"a":"243 ≤ N ≤ 252"},{"n":4,"c":"PCT","f":"PCT-P1","t":"M","s":"The income of Amala is 20% more than that of Bimala and 20% less than that of Kamala. If Kamala’s income goes down by 4% and Bimala’s goes up by 10%, then the percentage by which Kamala’s income would exceed Bimala’s is nearest to","h":"Take Bimala=100; Amala=120, Kamala=150, then apply the new changes and compare.","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"Take Bimala $= 100$. Amala $= 120$, and Amala is $80\\%$ of Kamala, so Kamala $= 150$.\nAfter the changes: Kamala $= 0.96 \\times 150 = 144$, Bimala $= 110$.\nExcess $= \\frac{144 - 110}{110} \\times 100 \\approx 30.9\\%$.\nNearest option: $31$.\nAnswer: 31","o":["31","29","28","32"],"ai":0,"a":"31"},{"n":5,"c":"PCT","f":"PCT-P1","t":"M","s":"Meena scores 40% in an examination and after review, even though her score is increased by 50%, she fails by 35 marks. If her post-review score is increased by 20%, she will have 7 marks more than the passing score. The percentage score needed for passing the examination is","h":"Let total = T; post-review 60% of T, then 72% of T; the two gaps to pass mark (35 and 7) give 12% of T = 42.","yr":2019,"y":"CAT 2019 · Slot 1","l":3,"x":"Let the maximum be $T$. After review: $1.5 \\times 40\\% = 60\\%$ of $T$; after a further $20\\%$: $72\\%$ of $T$.\n$60\\%$ is $35$ short of the pass mark and $72\\%$ is $7$ above it, so $12\\%$ of $T = 42$.\n$T = 350$; pass mark $= 0.6 \\times 350 + 35 = 245$.\nPass percentage $= \\frac{245}{350} = 70\\%$.\nAnswer: 70","o":["75","80","60","70"],"ai":3,"a":"70"},{"n":6,"c":"PCT","f":"PCT-P1","t":"T","s":"In an examination, the score of A was 10% less than that of B, the score of B was 25% more than that of C, and the score of C was 20% less than that of D. If A scored 72, then the score of D was","h":"Chain D to C to B to A as multipliers 0.8 x 1.25 x 0.9.","yr":2019,"y":"CAT 2019 · Slot 2","l":1,"x":"Express A through D: $C = 0.8D$, $B = 1.25 \\times 0.8D = D$, $A = 0.9D$.\n$0.9D = 72$\n$D = 80$\nAnswer: 80","a":"80"},{"n":7,"c":"PCT","f":"PCT-P1","t":"M","s":"In the final examination, Bishnu scored 52% and Asha scored 64%. The marks obtained by Bishnu is 23 less, and that by Asha is 34 more than the marks obtained by Ramesh. The marks obtained by Geeta, who scored 84%, is","h":"The 12% gap between Asha and Bishnu equals 23 + 34 marks; find the total, then 84% of it.","yr":2020,"y":"CAT 2020 · Slot 3","l":2,"x":"Asha scores $34$ more and Bishnu $23$ less than Ramesh, so Asha is $23 + 34 = 57$ marks ahead of Bishnu.\nThat gap is $64\\% - 52\\% = 12\\%$ of the total marks.\nTotal $= \\frac{57}{0.12} = 475$.\nGeeta’s marks $= 84\\%$ of $475 = 399$.\nAnswer: 399","o":["439","399","357","417"],"ai":1,"a":"399"},{"n":8,"c":"PCT","f":"PCT-P1","t":"M","s":"Raj invested Rs. 10000 in a fund. At the end of first year, he incurred a loss but his balance was more than Rs. 5000. This balance, when invested for another year, grew and the percentage of growth in the second year was five times the percentage of loss in the first year. If the gain of Raj from the initial investment over the two year period is 35%, then the percentage of loss in the first year is","h":"Solve (1-x)(1+5x) = 1.35 and reject the root that breaks the Rs 5000 condition.","yr":2021,"y":"CAT 2021 · Slot 2","l":2,"x":"Let the first-year loss be $x$ (as a fraction); second-year growth is $5x$.\n$(1 - x)(1 + 5x) = 1.35$ simplifies to $100x^2 - 80x + 7 = 0$, i.e. $(10x - 1)(10x - 7) = 0$.\nSo $x = 0.1$ or $x = 0.7$.\nA $70\\%$ loss leaves Rs. 3000, below Rs. 5000, so reject it; the loss is $10\\%$.\nAnswer: 10","o":["15","5","10","70"],"ai":2,"a":"10"},{"n":9,"c":"PCT","f":"PCT-P1","t":"M","s":"The total of male and female populations in a city increased by 25% from 1970 to 1980. During the same period, the male population increased by 40% while the female population increased by 20%. From 1980 to 1990, the female population increased by 25%. In 1990, if the female population is twice the male population, then the percentage increase in the total of male and female populations in the city from 1970 to 1990 is","h":"From the 1970-80 data get the female:male ratio, then build the 1990 numbers.","yr":2021,"y":"CAT 2021 · Slot 3","l":4,"x":"1970 to 1980: $1.4M + 1.2F = 1.25(M + F)$ gives $0.15M = 0.05F$, so $F = 3M$.\nTake $M = 100$, $F = 300$ (total $400$). In 1980: $M = 140$, $F = 360$.\nIn 1990: $F = 1.25 \\times 360 = 450$, and $M = \\frac{450}{2} = 225$.\nTotal $= 675$, an increase of $\\frac{275}{400} = 68.75\\%$.\nAnswer: 68.75","o":["68.75","68.50","68.25","69.25"],"ai":0,"a":"68.75"},{"n":10,"c":"PCT","f":"PCT-P1","t":"M","s":"The salaries of three friends Sita, Gita and Mita are initially in the ratio 5 : 6 : 7, respectively. In the first year, they get salary hikes of 20%, 25% and 20%, respectively. In the second year, Sita and Mita get salary hikes of 40% and 25%, respectively, and the salary of Gita becomes equal to the mean salary of the three friends. The salary hike of Gita in the second year is","h":"If Gita equals the mean of all three, she equals the mean of Sita and Mita.","yr":2023,"y":"CAT 2023 · Slot 1","l":3,"x":"If Gita equals the mean of all three, she equals the mean of Sita and Mita.\nAfter year 1 (ratio units): Sita $= 6$, Gita $= 7.5$, Mita $= 8.4$.\nAfter year 2: Sita $= 6 \\times 1.4 = 8.4$, Mita $= 8.4 \\times 1.25 = 10.5$, so Gita $= \\frac{8.4 + 10.5}{2} = 9.45$.\nGita’s hike $= \\frac{9.45}{7.5} - 1 = 0.26 = 26\\%$.\nAnswer: 26%","o":["25%","28%","26%","30%"],"ai":2,"a":"26%"},{"n":11,"c":"PCT","f":"PCT-P1","t":"M","s":"After two successive increments, Gopal’s salary became 187.5% of his initial salary. If the percentage of salary increase in the second increment was twice of that in the first increment, then the percentage of salary increase in the first increment was","h":"Solve (1+x)(1+2x) = 1.875 or test options.","yr":2024,"y":"CAT 2024 · Slot 3","l":2,"x":"Let the first increment be $x$ (fraction); the second is $2x$.\n$(1 + x)(1 + 2x) = 1.875$ gives $16x^2 + 24x - 7 = 0$, i.e. $(4x - 1)(4x + 7) = 0$.\nThe positive root is $x = \\frac{1}{4}$, a $25\\%$ increment.\nCheck: $1.25 \\times 1.5 = 1.875$.\nShortcut: Test options: only $25$ gives $1.25 \\times 1.5 = 1.875$.\nAnswer: 25","o":["27.5","30","25","20"],"ai":2,"a":"25"},{"n":12,"c":"PCT","f":"PCT-P2","t":"M","s":"In a village, the production of food grains increased by 40% and the per capita production of food grains increased by 27% during a certain period. The percentage by which the population of the village increased during the same period is nearest to","h":"Production = population x per-capita, so population factor = 1.40/1.27.","yr":2017,"y":"CAT 2017 · Slot 2","l":1,"x":"Per capita = production $\\div$ population, so population factor $= \\frac{1.40}{1.27}$.\n$\\frac{140}{127} \\approx 1.102$, an increase of about $10.2\\%$.\nNearest option: 10\nAnswer: 10","o":["16","13","10","7"],"ai":2,"a":"10"},{"n":13,"c":"PCT","f":"PCT-P2","t":"M","s":"Identical chocolate pieces are sold in boxes of two sizes, small and large. The large box is sold for twice the price of the small box. If the selling price per gram of chocolate in the large box is 12% less than that in the small box, then the percentage by which the weight of chocolate in the large box exceeds that in the small box is nearest to","h":"Weight = price / price-per-gram, so W_L/W_s = 2 / 0.88.","yr":2021,"y":"CAT 2021 · Slot 1","l":3,"x":"Weight $= \\frac{\\text{price}}{\\text{price per gram}}$.\nLarge box: price $2\\times$, price per gram $0.88\\times$ that of the small box.\n$\\frac{W_L}{W_S} = \\frac{2}{0.88} \\approx 2.273$.\nSo the large box holds about $127\\%$ more chocolate.\nAnswer: 127","o":["127","135","124","144"],"ai":0,"a":"127"},{"n":14,"c":"PCT","f":"PCT-P3","t":"M","s":"The number of girls appearing for an admission test is twice the number of boys. If 30% of the girls and 45% of the boys get admission, the percentage of candidates who do not get admission is","h":"Take boys=1, girls=2 and find total admitted as a weighted share.","yr":2017,"y":"CAT 2017 · Slot 1","l":1,"x":"Take boys $= 100$, girls $= 200$.\nAdmitted: $45\\%$ of 100 + $30\\%$ of 200 $= 45 + 60 = 105$ of 300.\nNot admitted $= 195$, i.e. $\\frac{195}{300} \\times 100 = 65\\%$.\nAnswer: 65","o":["35","50","60","65"],"ai":3,"a":"65"},{"n":15,"c":"PCT","f":"PCT-P3","t":"T","s":"Ravi invests 50% of his monthly savings in fixed deposits. Thirty percent of the rest of his savings is invested in stocks and the rest goes into Ravi’s savings bank account. If the total amount deposited by him in the bank (for savings account and fixed deposits) is Rs 59500, then Ravi’s total monthly savings (in Rs) is","h":"FD 50% plus savings account 70% of the remaining 50%; total 85% of savings.","yr":2017,"y":"CAT 2017 · Slot 1","l":2,"x":"Let monthly savings be $S$. Fixed deposits get $0.5S$; the rest is $0.5S$.\nStocks take $30\\%$ of $0.5S$, so the savings account gets $70\\%$ of $0.5S = 0.35S$.\nBank total $= 0.5S + 0.35S = 0.85S = 59500$.\n$S = \\frac{59500}{0.85} = 70000$.\nAnswer: 70000","a":"70000"},{"n":16,"c":"PCT","f":"PCT-P3","t":"T","s":"In a class, 60% of the students are girls and the rest are boys. There are 30 more girls than boys. If 68% of the students, including 30 boys, pass an examination, the percentage of the girls who do not pass is","h":"The 20% gap between girls and boys is 30 students, which fixes the class size.","yr":2019,"y":"CAT 2019 · Slot 1","l":2,"x":"Girls $60\\%$, boys $40\\%$: the $20\\%$ gap is $30$ students, so the class has $150$.\nGirls $= 90$, boys $= 60$.\nPassed $= 68\\%$ of $150 = 102$; with $30$ boys passing, girls passing $= 72$.\nGirls failing $= 18$, which is $\\frac{18}{90} = 20\\%$ of the girls.\nAnswer: 20","a":"20"},{"n":17,"c":"PCT","f":"PCT-P3","t":"M","s":"In 2010, a library contained a total of 11500 books in two categories - fiction and non-fiction. In 2015, the library contained a total of 12760 books in these two categories. During this period, there was 10% increase in the fiction category while there was 12% increase in the non-fiction category. How many fiction books were in the library in 2015?","h":"Assume 10% growth on all 11500; the extra 2% on non-fiction accounts for the remaining 110.","yr":2019,"y":"CAT 2019 · Slot 2","l":2,"x":"If every category grew $10\\%$, 2015 would have $1.1 \\times 11500 = 12650$ books.\nThe extra $12760 - 12650 = 110$ comes from the additional $2\\%$ on non-fiction.\nNon-fiction (2010) $= \\frac{110}{0.02} = 5500$, so fiction (2010) $= 6000$.\nFiction in 2015 $= 1.1 \\times 6000 = 6600$.\nAnswer: 6600","o":["6600","6160","6000","5500"],"ai":0,"a":"6600"},{"n":18,"c":"PCT","f":"PCT-P3","t":"M","s":"In a group of people, 28% of the members are young while the rest are old. If 65% of the members are literates, and 25% of the literates are young, then the percentage of old people among the illiterates is nearest to","h":"Take 100 people: find old literates (75% of 65), subtract from 72 old, divide by 35 illiterates.","yr":2020,"y":"CAT 2020 · Slot 1","l":3,"x":"Take $100$ people: $72$ old, $65$ literate, $35$ illiterate.\nYoung literates $= 25\\%$ of $65 = 16.25$, so old literates $= 48.75$.\nOld illiterates $= 72 - 48.75 = 23.25$.\nShare among illiterates $= \\frac{23.25}{35} \\approx 66.4\\%$, nearest $66$.\nAnswer: 66","o":["59","62","66","55"],"ai":2,"a":"66"},{"n":19,"c":"PCT","f":"PCT-P3","t":"M","s":"In May, John bought the same amount of rice and the same amount of wheat as he had bought in April, but spent Rs. 150 more due to price increase of rice and wheat by 20% and 12%, respectively. If John had spent Rs. 450 on rice in April, then how much did he spend on wheat in May?","h":"Extra spend 150 = 20% of rice spend + 12% of wheat spend.","yr":2020,"y":"CAT 2020 · Slot 2","l":2,"x":"Same quantities, so the extra Rs. 150 is purely the price rise on April’s spends.\nRice adds $20\\%$ of Rs. 450 $=$ Rs. 90, so wheat adds Rs. 60.\n$12\\%$ of April wheat spend $= 60$, so April wheat $=$ Rs. 500.\nMay wheat spend $= 1.12 \\times 500 =$ Rs. 560.\nAnswer: 560","o":["590","580","560","570"],"ai":2,"a":"560"},{"n":20,"c":"PCT","f":"PCT-P3","t":"T","s":"A box has 450 balls, each either white or black, there being as many metallic white balls as metallic black balls. If 40% of the white balls and 50% of the black balls are metallic, then the number of non- metallic balls in the box is","h":"0.4W = 0.5B gives W:B = 5:4; split 450 and count metallic balls.","yr":2021,"y":"CAT 2021 · Slot 2","l":2,"x":"Metallic whites equal metallic blacks: $0.4W = 0.5B$, so $W : B = 5 : 4$.\n$W = 250$, $B = 200$.\nMetallic balls $= 0.4 \\times 250 + 0.5 \\times 200 = 200$.\nNon-metallic $= 450 - 200 = 250$.\nAnswer: 250","a":"250"},{"n":21,"c":"PCT","f":"PCT-P3","t":"M","s":"In a tournament, a team has played 40 matches so far and won 30% of them. If they win 60% of the remaining matches, their overall win percentage will be 50%. Suppose they win 90% of the remaining matches, then the total number of matches won by the team in the tournament will be","h":"Use the 60% scenario to find the number of remaining matches.","yr":2021,"y":"CAT 2021 · Slot 3","l":2,"x":"Wins so far $= 30\\%$ of $40 = 12$. Let $R$ matches remain.\nWith $60\\%$ of them won: $12 + 0.6R = 0.5(40 + R)$, so $0.1R = 8$ and $R = 80$.\nWinning $90\\%$ of $80$ gives $72$ more wins.\nTotal wins $= 12 + 72 = 84$.\nAnswer: 84","o":["86","84","78","80"],"ai":1,"a":"84"},{"n":22,"c":"PCT","f":"PCT-P3","t":"M","s":"In an election, there were four candidates and 80% of the registered voters casted their votes. One of the candidates received 30% of the casted votes while the other three candidates received the remaining casted votes in the proportion 1 : 2 : 3. If the winner of the election received 2512 votes more than the candidate with the second highest votes, then the number of registered voters was","h":"Remaining 70% splits as 35%, 23.33%, 11.67%; winner (35%) minus runner-up (30%) is 5% of votes cast.","yr":2022,"y":"CAT 2022 · Slot 2","l":3,"x":"The remaining $70\\%$ of votes cast splits $1 : 2 : 3$, i.e. about $11.67\\%$, $23.33\\%$ and $35\\%$.\nSo the winner has $35\\%$ and the runner-up $30\\%$; the gap is $5\\%$ of votes cast.\nVotes cast $= \\frac{2512}{0.05} = 50240$.\nThese are $80\\%$ of registered voters: $\\frac{50240}{0.8} = 62800$.\nAnswer: 62800","o":["40192","60288","50240","62800"],"ai":3,"a":"62800"},{"n":23,"c":"PCT","f":"PCT-P3","t":"M","s":"In September, the incomes of Kamal, Amal and Vimal are in the ratio 8 : 6 : 5. They rent a house together, and Kamal pays 15%, Amal pays 12% and Vimal pays 18% of their respective incomes to cover the total house rent in that month. In October, the house rent remains unchanged while their incomes increase by 10%, 12% and 15%, respectively. In October, the percentage of their total income that will be paid as house rent, is nearest to","h":"Rent from September incomes 8,6,5 stays fixed; divide by October total income.","yr":2024,"y":"CAT 2024 · Slot 1","l":3,"x":"Take September incomes as $8, 6, 5$ units. Rent $= 1.2 + 0.72 + 0.9 = 2.82$ units.\nOctober incomes: $8.8 + 6.72 + 5.75 = 21.27$ units.\nRent is unchanged, so the share $= \\frac{2.82}{21.27} \\approx 13.26\\%$.\nAnswer: 13.26","o":["14.84","12.75","13.26","15.18"],"ai":2,"a":"13.26"},{"n":24,"c":"PCT","f":"PCT-P4","t":"M","s":"The population of a town in 2020 was 100000. The population decreased by y% from the year 2020 to 2021, and increased by x% from the year 2021 to 2022, where x and y are two natural numbers. If population in 2022 was greater than the population in 2020 and the difference between x and y is 10, then the lowest possible population of the town in 2021 was","h":"x must be y+10; require (100-y)(110+y) > 10000 and maximise y.","yr":2023,"y":"CAT 2023 · Slot 3","l":4,"x":"To end above 2020, the increase must beat the decrease, so $x = y + 10$.\nNeed $(1 - \\frac{y}{100})(1 + \\frac{y + 10}{100}) > 1$, i.e. $(100 - y)(110 + y) > 10000$, i.e. $y^2 + 10y < 1000$.\n$y = 27$: $729 + 270 = 999 < 1000$ works; $y = 28$: $1064$ fails.\nLargest drop $27\\%$ gives the lowest 2021 population $= 73000$.\nAnswer: 73000","o":["74000","75000","72000","73000"],"ai":3,"a":"73000"},{"n":25,"c":"PCT","f":"PCT-P4","t":"T","s":"A fruit seller has a stock of mangoes, bananas and apples with at least one fruit of each type. At the beginning of a day, the number of mangoes make up 40% of his stock. That day, he sells half of the mangoes, 96 bananas and 40% of the apples. At the end of the day, he ends up selling 50% of the fruits. The smallest possible total number of fruits in the stock at the beginning of the day is","h":"0.2T + 96 + 0.4A = 0.5T gives A in terms of T; impose integrality and bananas at least 96.","yr":2023,"y":"CAT 2023 · Slot 3","l":5,"x":"Let total $= T$, apples $= A$. Mangoes $= 0.4T$; sold: $0.2T + 96 + 0.4A = 0.5T$, so $A = 0.75T - 240$.\nApples $\\ge 1$ needs $T > 320$.\nWhole counts: $0.2T$ needs $T$ divisible by $5$ and $0.75T$ needs it divisible by $4$, so $T$ is a multiple of $20$; also $0.4A$ must be whole.\n$T = 340$: $A = 15$ (sell $6$), mangoes $136$, bananas $340 - 136 - 15 = 189 \\ge 96$. All valid.\nSmallest total $= 340$.\nAnswer: 340","a":"340"},{"n":26,"c":"PCT","f":"PCT-P4","t":"M","s":"In a group of 250 students, the percentage of girls was at least 44% and at most 60%. The rest of the students were boys. Each student opted for either swimming or running or both. If 50% of the boys and 80% of the girls opted for swimming while 70% of the boys and 60% of the girls opted for running, then the minimum and maximum possible number of students who opted for both swimming and running, are","h":"Both = swimmers + runners - 250; scan admissible girl counts where every % gives an integer.","yr":2024,"y":"CAT 2024 · Slot 3","l":5,"x":"Let girls $= G$, boys $= 250 - G$, with $110 \\le G \\le 150$.\nBoth $=$ swimmers $+$ runners $- 250 = 1.2(250 - G) + 1.4G - 250 = 50 + 0.2G$.\nWhole numbers need $0.8G$, $0.6G$ and $0.5(250-G)$, $0.7(250-G)$ integral, so $G$ is a multiple of $10$.\n$G = 110$ gives $72$; $G = 150$ gives $80$.\nAnswer: 72 and 80, respectively","o":["72 and 80, respectively","75 and 90, respectively","72 and 88, respectively","75 and 96, respectively"],"ai":0,"a":"72 and 80, respectively"},{"n":27,"c":"PL","f":"PL-L1","t":"M","s":"If a seller gives a discount of 15% on retail price, she still makes a profit of 2%. Which of the following ensures that she makes a profit of 20%?","h":"0.85 x retail = 1.02 x cost gives retail = 1.2 x cost.","yr":2017,"y":"CAT 2017 · Slot 1","l":1,"x":"Let cost $= C$ and retail price $= R$: $0.85R = 1.02C$.\n$R = \\frac{1.02}{0.85}C = 1.2C$.\nSo selling at the retail price itself gives $20\\%$ profit.\nAnswer: Sell at retail price","o":["Give a discount of 5% on retail price","Give a discount of 2% on retail price","Increase the retail price by 2%","Sell at retail price"],"ai":3,"a":"Sell at retail price"},{"n":28,"c":"PL","f":"PL-L1","t":"M","s":"Anil buys 12 toys and labels each with the same selling price. He sells 8 toys initially at 20% discount on the labeled price. Then he sells the remaining 4 toys at an additional 25% discount on the discounted price. Thus, he gets a total of Rs 2112, and makes a 10% profit. With no discounts, his percentage of profit would have been","h":"Revenue = 8(0.8L) + 4(0.6L) = 8.8L; cost = 2112/1.1.","yr":2020,"y":"CAT 2020 · Slot 2","l":3,"x":"Let the label be $L$. Revenue $= 8(0.8L) + 4(0.8 \\times 0.75L) = 6.4L + 2.4L = 8.8L = 2112$, so $L = 240$.\nCost $= \\frac{2112}{1.1} = 1920$.\nWith no discount: $12 \\times 240 = 2880$.\nProfit $= \\frac{2880}{1920} - 1 = 50\\%$.\nAnswer: 50","o":["60","55","50","54"],"ai":2,"a":"50"},{"n":29,"c":"PL","f":"PL-L1","t":"M","s":"The selling price of a product is fixed to ensure 40% profit. If the product had cost 40% less and had been sold for 5 rupees less, then the resulting profit would have been 50%. The original selling price, in rupees, of the product is","h":"Write 1.5 x 0.6C = 1.4C - 5.","yr":2024,"y":"CAT 2024 · Slot 1","l":2,"x":"Let cost $= C$; original price $= 1.4C$.\nNew cost $0.6C$ at $50\\%$ profit gives $0.9C$, which is $5$ less: $0.9C = 1.4C - 5$.\n$C = 10$, so the original selling price $= 14$.\nAnswer: 14","o":["10","15","20","14"],"ai":3,"a":"14"},{"n":30,"c":"PL","f":"PL-L1","t":"M","s":"Gopi marks a price on a product in order to make 20% profit. Ravi gets 10% discount on this marked price, and thus saves Rs 15. Then, the profit, in rupees, made by Gopi by selling the product to Ravi, is","h":"10% of marked price is 15, so MP = 150 and CP = MP/1.2.","yr":2024,"y":"CAT 2024 · Slot 3","l":1,"x":"$10\\%$ of the marked price is Rs. 15, so marked price $= 150$.\nIt was set at $120\\%$ of cost: cost $= \\frac{150}{1.2} = 125$.\nRavi pays $150 - 15 = 135$; profit $= 135 - 125 = 10$.\nAnswer: 10","o":["25","10","15","20"],"ai":1,"a":"10"},{"n":31,"c":"PL","f":"PL-L2","t":"M","s":"The manufacturer of a table sells it to a wholesale dealer at a profit of 10%. The wholesale dealer sells the table to a retailer at a profit of 30%. Finally, the retailer sells it to a customer at a profit of 50%. If the customer pays Rs 4290 for the table, then its manufacturing cost (in Rs) is","h":"Divide 4290 by 1.1 x 1.3 x 1.5.","yr":2017,"y":"CAT 2017 · Slot 2","l":1,"x":"The customer’s price is the cost multiplied by $1.1 \\times 1.3 \\times 1.5 = 2.145$.\nCost $= \\frac{4290}{2.145} = 2000$.\nAnswer: 2000","o":["1500","2000","2500","3000"],"ai":1,"a":"2000"},{"n":32,"c":"PL","f":"PL-L2","t":"M","s":"A shopkeeper sells two tables, each procured at cost price p, to Amal and Asim at a profit of 20% and at a loss of 20%, respectively. Amal sells his table to Bimal at a profit of 30%, while Asim sells his table to Barun at a loss of 30%. If the amounts paid by Bimal and Barun are x and y, respectively, then (x − y)/p equals","h":"x = 1.2 x 1.3 p and y = 0.8 x 0.7 p; subtract.","yr":2019,"y":"CAT 2019 · Slot 2","l":2,"x":"Bimal pays $x = 1.2 \\times 1.3p = 1.56p$.\nBarun pays $y = 0.8 \\times 0.7p = 0.56p$.\n$\\frac{x - y}{p} = 1$.\nAnswer: 1","o":["1","1.2","0.7","0.50"],"ai":0,"a":"1"},{"n":33,"c":"PL","f":"PL-L2","t":"M","s":"Minu purchases a pair of sunglasses at Rs.1000 and sells to Kanu at 20% profit. Then, Kanu sells it back to Minu at 20% loss. Finally, Minu sells the same pair of sunglasses to Tanu. If the total profit made by Minu from all her transactions is Rs.500, then the percentage of profit made by Minu when she sold the pair of sunglasses to Tanu is","h":"Track Minu's net cash: profit 200 on first sale, buy back at 960, rest must come from the final sale.","yr":2023,"y":"CAT 2023 · Slot 2","l":3,"x":"Minu buys at $1000$, sells to Kanu at $1200$ (gain $200$).\nShe buys it back at $0.8 \\times 1200 = 960$.\nTotal profit $500$ means the final sale brings $300$ over the $960$ she paid: Tanu pays $1260$.\nProfit on that sale $= \\frac{300}{960} = 31.25\\%$.\nAnswer: 31.25%","o":["35.42%","31.25%","52%","26%"],"ai":1,"a":"31.25%"},{"n":34,"c":"PL","f":"PL-L2","t":"T","s":"Bina incurs 19% loss when she sells a product at Rs. 4860 to Shyam, who in turn sells this product to Hari. If Bina would have sold this product to Shyam at the purchase price of Hari, she would have obtained 17% profit. Then, the profit, in rupees, made by Shyam is","h":"Bina's cost = 4860/0.81; Hari's price = 1.17 x that cost.","yr":2024,"y":"CAT 2024 · Slot 2","l":2,"x":"Bina’s cost $= \\frac{4860}{0.81} = 6000$.\nHari’s price $=$ Bina’s $17\\%$-profit price $= 1.17 \\times 6000 = 7020$.\nShyam’s profit $= 7020 - 4860 = 2160$.\nAnswer: 2160","a":"2160"},{"n":35,"c":"PL","f":"PL-L3","t":"M","s":"In a market, the price of medium quality mangoes is half that of good mangoes. A shopkeeper buys 80 kg good mangoes and 40 kg medium quality mangoes from the market and then sells all these at a common price which is 10% less than the price at which he bought the good ones. His overall profit is","h":"Take good = 2, medium = 1 per kg; compare 200 cost with 120 kg sold at 1.8.","yr":2017,"y":"CAT 2017 · Slot 1","l":2,"x":"Take good mangoes at Rs. 2 per kg and medium at Rs. 1 per kg.\nCost $= 80 \\times 2 + 40 \\times 1 = 200$.\nSelling price $= 0.9 \\times 2 = 1.8$ per kg on $120$ kg: $216$.\nProfit $= \\frac{16}{200} = 8\\%$.\nAnswer: 8%","o":["6%","8%","10%","12%"],"ai":1,"a":"8%"},{"n":36,"c":"PL","f":"PL-L3","t":"M","s":"Mayank buys some candies for Rs 15 a dozen and an equal number of different candies for Rs 12 a dozen. He sells all for Rs 16.50 a dozen and makes a profit of Rs 150. How many dozens of candies did he buy altogether?","h":"With n dozen of each, profit per pair of dozens = 33 - 27 = 6.","yr":2017,"y":"CAT 2017 · Slot 2","l":2,"x":"Let him buy $n$ dozen of each kind.\nCost $= 15n + 12n = 27n$; revenue $= 16.5 \\times 2n = 33n$.\nProfit $6n = 150$, so $n = 25$.\nTotal $= 2n = 50$ dozen.\nAnswer: 50","o":["50","30","25","45"],"ai":0,"a":"50"},{"n":37,"c":"PL","f":"PL-L3","t":"M","s":"On selling a pen at 5% loss and a book at 15% gain, Karim gains Rs. 7. If he sells the pen at 5% gain and the book at 10% gain, he gains Rs. 13. What is the cost price of the book in Rupees?","h":"Add the two profit equations so the pen terms cancel.","yr":2019,"y":"CAT 2019 · Slot 1","l":2,"x":"Let pen and book cost $P$ and $B$.\n$-0.05P + 0.15B = 7$ and $0.05P + 0.10B = 13$.\nAdding cancels $P$: $0.25B = 20$.\n$B = 80$.\nAnswer: 80","o":["80","85","100","95"],"ai":0,"a":"80"},{"n":38,"c":"PL","f":"PL-L3","t":"M","s":"Mukesh purchased 10 bicycles in 2017, all at the same price. He sold six of these at a profit of 25% and the remaining four at a loss of 25%. If he made a total profit of Rs. 2000, then his purchase price of a bicycle, in Rupees, was","h":"Net profit = 2 bicycles' worth of 25% of cost.","yr":2019,"y":"CAT 2019 · Slot 2","l":1,"x":"Let each bicycle cost $C$. Six earn $0.25C$ each, four lose $0.25C$ each.\nNet $= (6 - 4) \\times 0.25C = 0.5C = 2000$.\n$C = 4000$.\nAnswer: 4000","o":["2000","6000","8000","4000"],"ai":3,"a":"4000"},{"n":39,"c":"PL","f":"PL-L3","t":"T","s":"A person spent Rs 50000 to purchase a desktop computer and a laptop computer. He sold the desktop at 20% profit and the laptop at 10% loss. If overall he made a 2% profit then the purchase price, in rupees, of the desktop is","h":"Alligate 20% and -10% around 2% to split the 50000.","yr":2020,"y":"CAT 2020 · Slot 1","l":1,"x":"Let desktop cost $D$; laptop costs $50000 - D$. Overall profit $= 2\\%$ of $50000 = 1000$.\n$0.2D - 0.1(50000 - D) = 1000$, so $0.3D = 6000$.\n$D = 20000$.\nShortcut: Alligation: desktop : laptop $= (2 + 10) : (20 - 2) = 2 : 3$, so $\\frac{2}{5} \\times 50000$.\nAnswer: 20000","a":"20000"},{"n":40,"c":"PL","f":"PL-L3","t":"M","s":"A man buys 35 kg of sugar and sets a marked price in order to make a 20% profit. He sells 5 kg at this price, and 15 kg at a 10% discount. Accidentally, 3 kg of sugar is wasted. He sells the remaining sugar by raising the marked price by p percent so as to make an overall profit of 15%. Then p is nearest to","h":"Set CP = 1/kg; required revenue 1.15 x 35 minus revenue from 20 kg, spread over the 12 kg left.","yr":2020,"y":"CAT 2020 · Slot 3","l":4,"x":"Take cost Rs. 1 per kg; marked price $=1.2$ per kg. Total cost $=35$.\nRevenue so far: $5\\times1.2+15\\times1.08=6+16.2=22.2$.\nNeeded revenue for $15\\%$ profit $=1.15\\times35=40.25$, so the last $35-20-3=12$ kg must bring $18.05$.\nNew price $=\\frac{18.05}{12}\\approx1.504$ per kg, against marked $1.2$.\n$p=\\frac{1.504}{1.2}-1\\approx25\\%$, nearest 25.\nAnswer: 25","o":["35","31","22","25"],"ai":3,"a":"25"},{"n":41,"c":"PL","f":"PL-L3","t":"M","s":"Gita sells two objects A and B at the same price such that she makes a profit of 20% on object A and a loss of 10% on object B. If she increases the selling price such that objects A and B are still sold at an equal price and a profit of 10% is made on object B, then the profit made on object A will be nearest to","h":"Equal SP: cost of A = S/1.2, cost of B = S/0.9; new SP = 1.1 x cost of B.","yr":2023,"y":"CAT 2023 · Slot 1","l":2,"x":"Take the common selling price $= 36$: cost of A $= \\frac{36}{1.2} = 30$, cost of B $= \\frac{36}{0.9} = 40$.\nNew common price $= 1.1 \\times 40 = 44$.\nProfit on A $= \\frac{44 - 30}{30} \\approx 46.7\\%$, nearest $47\\%$.\nAnswer: 47%","o":["42%","47%","45%","49%"],"ai":1,"a":"47%"},{"n":42,"c":"PL","f":"PL-L3","t":"T","s":"Jayant bought a certain number of white shirts at the rate of Rs 1000 per piece and a certain number of blue shirts at the rate of Rs 1125 per piece. For each shirt, he then set a fixed market price which was 25% higher than the average cost of all the shirts. He sold all the shirts at a discount of 10% and made a total profit of Rs 51000. If he bought both colors of shirts, then the maximum possible total number of shirts that he could have bought is","h":"Profit is 12.5% of total cost, so 8w + 9b = 3264; maximise w+b with b smallest.","yr":2023,"y":"CAT 2023 · Slot 2","l":4,"x":"Let average cost be $c$. Marked price $1.25c$, selling price $0.9\\times1.25c=1.125c$, so profit is $12.5\\%$ of total cost.\nTotal cost $=\\frac{51000}{0.125}=408000$, i.e. $1000w+1125b=408000$, or $8w+9b=3264$.\nEach blue shirt replaced by white ones raises the count, so make $b$ as small as possible.\n$3264$ is a multiple of 8, so $9b$ must be too: smallest $b=8$, giving $w=\\frac{3264-72}{8}=399$.\nMaximum total $=399+8=407$.\nAnswer: 407","a":"407"},{"n":43,"c":"PL","f":"PL-L4","t":"M","s":"If Fatima sells 60 identical toys at a 40% discount on the printed price, then she makes 20% profit. Ten of these toys are destroyed in fire. While selling the rest, how much discount should be given on the printed price so that she can make the same amount of profit?","h":"Take printed price 100, cost 50; keep the total profit of 60 toys while selling only 50.","yr":2017,"y":"CAT 2017 · Slot 1","l":3,"x":"Take printed price Rs. 100, so selling price at $40\\%$ off is Rs. 60.\nRs. 60 gives $20\\%$ profit, so cost $=\\frac{60}{1.2}=$ Rs. 50 and profit per toy is Rs. 10.\nTotal profit wanted $=60\\times10=$ Rs. 600; total cost of 60 toys $=$ Rs. 3000.\nThe 50 remaining toys must fetch $3000+600=3600$, i.e. Rs. 72 each.\nDiscount on Rs. 100 printed price $=28\\%$.\nAnswer: 28%","o":["30%","25%","24%","28%"],"ai":3,"a":"28%"},{"n":44,"c":"PL","f":"PL-L4","t":"T","s":"Amal purchases some pens at Rs. 8 each. To sell these, he hires an employee at a fixed wage. He sells 100 of these pens at Rs. 12 each. If the remaining pens are sold at Rs. 11 each, then he makes a net profit of Rs. 300, while he makes a net loss of Rs. 300 if the remaining pens are sold at Rs. 9 each. The wage of the employee, in INR, is","h":"Difference of the two scenarios (Rs 2 per pen = 600) gives the remaining pens.","yr":2021,"y":"CAT 2021 · Slot 1","l":3,"x":"Both scenarios differ only in the price of the remaining pens: Rs. 11 vs Rs. 9.\nThat Rs. 2 per pen swings the result from $+300$ to $-300$, so $2n=600$ and $n=300$ pens remain.\nTotal pens $=400$, cost $=400\\times8=$ Rs. 3200.\nProfit case: $100\\times12+300\\times11-3200-W=300$, so $1300-W=300$.\n$W=1000$.\nAnswer: 1000","a":"1000"},{"n":45,"c":"PL","f":"PL-L4","t":"M","s":"A merchant purchases a cloth at a rate of Rs.100 per meter and receives 5 cm length of cloth free for every 100 cm length of cloth purchased by him. He sells the same cloth at a rate of Rs.110 per meter but cheats his customers by giving 95 cm length of cloth for every 100 cm length of cloth purchased by the customers. If the merchant provides a 5% discount, the resulting profit earned by him is","h":"Compare cost per cm (100/105) with revenue per cm (110 x 0.95 / 95).","yr":2023,"y":"CAT 2023 · Slot 3","l":4,"x":"Work per cm. He pays Rs. 100 for 105 cm, so cost $=\\frac{100}{105}$ per cm.\nA customer buying ’100 cm’ pays $110\\times0.95=104.5$ but receives only 95 cm: revenue $=\\frac{104.5}{95}=1.1$ per cm.\nProfit ratio $=1.1\\times\\frac{105}{100}=1.155$.\nProfit $=15.5\\%$.\nAnswer: 15.5%","o":["4.2%","15.5%","16%","9.7%"],"ai":1,"a":"15.5%"},{"n":46,"c":"SICI","f":"SICI-I1","t":"T","s":"Gopal borrows Rs. X from Ankit at 8% annual interest. He then adds Rs. Y of his own money and lends Rs. X+Y to Ishan at 10% annual interest. At the end of the year, after returning Ankit’s dues, the net interest retained by Gopal is the same as that accrued to Ankit. On the other hand, had Gopal lent Rs. X+2Y to Ishan at 10%, then the net interest retained by him would have increased by Rs. 150. If all interests are compounded annually, then find the value of X + Y.","h":"Ankit gets 0.08X; set 0.1(X+Y)-0.08X = 0.08X to get Y=0.6X, then the extra 0.1Y equals 150.","yr":2018,"y":"CAT 2018 · Slot 2","l":4,"x":"Ankit earns $0.08X$. Gopal keeps $0.1(X+Y) - 0.08X = 0.08X$, so $0.1Y = 0.06X$, i.e. $Y = 0.6X$.\nLending $Y$ more at $10\\%$ adds $0.1Y = 150$, so $Y = 1500$.\n$X = \\frac{1500}{0.6} = 2500$; $X + Y = 4000$.\nAnswer: 4000","a":"4000"},{"n":47,"c":"SICI","f":"SICI-I1","t":"T","s":"A person invested a total amount of Rs 15 lakh. A part of it was invested in a fixed deposit earning 6% annual interest, and the remaining amount was invested in two other deposits in the ratio 2 : 1, earning annual interest at the rates of 4% and 3%, respectively. If the total annual interest income is Rs 76000 then the amount (in Rs lakh) invested in the fixed deposit was","h":"The 2:1 split at 4% and 3% blends to 11/3%; set up one equation for the FD amount.","yr":2019,"y":"CAT 2019 · Slot 1","l":2,"x":"Let FD $= x$ lakh. The rest $(15 - x)$ split $2 : 1$ at $4\\%$ and $3\\%$ earns $\\frac{2(4) + 3}{3} = \\frac{11}{3}\\%$.\n$0.06x + \\frac{11}{300}(15 - x) = 0.76$.\n$\\times 300$: $18x + 165 - 11x = 228$, so $7x = 63$, so $x = 9$.\nAnswer: 9","a":"9"},{"n":48,"c":"SICI","f":"SICI-I1","t":"M","s":"Alex invested his savings in two parts. The simple interest earned on the first part at 15% per annum for 4 years is the same as the simple interest earned on the second part at 12% per annum for 3 years. Then, the percentage of his savings invested in the first part is","h":"60% of first part = 36% of second part gives the ratio of parts.","yr":2022,"y":"CAT 2022 · Slot 1","l":1,"x":"First part $A$: SI $= 60\\%$ of $A$; second part $B$: SI $= 36\\%$ of $B$.\n$0.6A = 0.36B$, so $A : B = 3 : 5$.\nFirst part $= \\frac{3}{8} = 37.5\\%$ of savings.\nAnswer: 37.5%","o":["62.5%","37.5%","60%","40%"],"ai":1,"a":"37.5%"},{"n":49,"c":"SICI","f":"SICI-I1","t":"T","s":"Mr. Pinto invests one-fifth of his capital at 6%, one-third at 10% and the remaining at 1%, each rate being simple interest per annum. Then, the minimum number of years required for the cumulative interest income from these investments to equal or exceed his initial capital is","h":"Find the blended annual rate on the whole capital.","yr":2022,"y":"CAT 2022 · Slot 2","l":1,"x":"Remaining fraction $= 1 - \\frac{1}{5} - \\frac{1}{3} = \\frac{7}{15}$.\nBlended rate $= \\frac{6}{5} + \\frac{10}{3} + \\frac{7}{15} = \\frac{18 + 50 + 7}{15} = 5\\%$ per year.\nInterest equals capital after $\\frac{100}{5} = 20$ years.\nAnswer: 20","a":"20"},{"n":50,"c":"SICI","f":"SICI-I1","t":"M","s":"An amount of Rs 10000 is deposited in bank A for a certain number of years at a simple interest of 5% per annum. On maturity, the total amount received is deposited in bank B for another 5 years at a simple interest of 6% per annum. If the interests received from bank A and bank B are in the ratio 10 : 13, then the investment period, in years, in bank A is","h":"Interest in B is 30% of (10000 + interest from A).","yr":2024,"y":"CAT 2024 · Slot 1","l":2,"x":"Let the period in A be $n$ years: interest from A $= 500n$.\nB gets $10000 + 500n$ for 5 years at $6\\%$: interest $= 30\\%$ of it $= 3000 + 150n$.\n$\\frac{500n}{3000 + 150n} = \\frac{10}{13}$, so $6500n = 30000 + 1500n$.\n$5000n = 30000$, so $n = 6$.\nAnswer: 6","o":["4","5","3","6"],"ai":3,"a":"6"},{"n":51,"c":"SICI","f":"SICI-I2","t":"T","s":"For the same principal amount, the compound interest for two years at 5% per annum exceeds the simple interest for three years at 3% per annum by Rs 1125. Then the principal amount in rupees is","h":"CI for 2 yrs at 5% is 10.25% of P, SI for 3 yrs at 3% is 9%; the gap is 1.25% of P.","yr":2020,"y":"CAT 2020 · Slot 2","l":2,"x":"CI for 2 years at $5\\%$: $1.05^2 - 1 = 10.25\\%$ of $P$.\nSI for 3 years at $3\\%$: $9\\%$ of $P$.\nGap $= 1.25\\%$ of $P = 1125$, so $P = 90000$.\nAnswer: 90000","a":"90000"},{"n":52,"c":"SICI","f":"SICI-I2","t":"T","s":"A person invested a certain amount of money at 10% annual interest, compounded half-yearly. After one and a half years, the interest and principal together became Rs 18522. The amount, in rupees, that the person had invested is","h":"Half-yearly at 10% means 5% for 3 periods; divide by 1.05^3.","yr":2020,"y":"CAT 2020 · Slot 3","l":1,"x":"$10\\%$ half-yearly: $5\\%$ per period, 3 periods in 1.5 years.\n$P \\times 1.05^3 = P \\times 1.157625 = 18522$.\n$P = 16000$.\nAnswer: 16000","a":"16000"},{"n":53,"c":"SICI","f":"SICI-I2","t":"M","s":"Anil invests some money at a fixed rate of interest, compounded annually. If the interests accrued during the second and third year are Rs. 806.25 and Rs. 866.72, respectively, the interest accrued, in INR, during the fourth year is nearest to","h":"Year-on-year interest grows by the factor (1+r) = 866.72/806.25; multiply once more.","yr":2021,"y":"CAT 2021 · Slot 1","l":2,"x":"Each year’s interest is $(1+r)$ times the previous year’s.\n$1 + r = \\frac{866.72}{806.25} \\approx 1.075$.\nFourth-year interest $= 866.72 \\times 1.075 \\approx 931.72$, the nearest option.\nAnswer: 931.72","o":["931.72","926.84","929.48","934.65"],"ai":0,"a":"931.72"},{"n":54,"c":"SICI","f":"SICI-I2","t":"T","s":"Aman invests Rs 4000 in a bank at a certain rate of interest, compounded annually. If the ratio of the value of the investment after 3 years to the value of the investment after 5 years is 25 : 36, then the minimum number of years required for the value of the investment to exceed Rs 20000 is","h":"(1+r)^2 = 36/25 gives r = 20%; find the least n with 1.2^n > 5.","yr":2024,"y":"CAT 2024 · Slot 3","l":3,"x":"Value after 5 years $\\div$ value after 3 years $= (1+r)^2 = \\frac{36}{25}$, so $1 + r = 1.2$.\nNeed $4000 \\times 1.2^n > 20000$, i.e. $1.2^n > 5$.\n$1.2^8 \\approx 4.30$, $1.2^9 \\approx 5.16$.\nMinimum $n = 9$.\nAnswer: 9","a":"9"},{"n":55,"c":"SICI","f":"SICI-I3","t":"T","s":"John borrowed Rs. 2,10,000 from a bank at an interest rate of 10% per annum, compounded annually. The loan was repaid in two equal instalments, the first after one year and the second after another year. The first instalment was interest of one year plus part of the principal amount, while the second was the rest of the principal amount plus due interest thereon. Then each instalment, in Rs., is","h":"Equal instalment x satisfies x/1.1 + x/1.21 = 210000.","yr":2018,"y":"CAT 2018 · Slot 1","l":2,"x":"Equal instalments $x$: their present values must add to the loan.\n$\\frac{x}{1.1} + \\frac{x}{1.21} = \\frac{1.1x + x}{1.21} = \\frac{2.1x}{1.21}$.\n$\\frac{2.1x}{1.21} = 210000$, so $x = 121000$.\nAnswer: 121000","a":"121000"},{"n":56,"c":"SICI","f":"SICI-I3","t":"M","s":"Anil borrows Rs 2 lakhs at an interest rate of 8% per annum, compounded half-yearly. He repays Rs 10320 at the end of the first year and closes the loan by paying the outstanding amount at the end of the third year. Then, the total interest, in rupees, paid over the three years is nearest to","h":"Use 4% per half-year: outstanding after 1 yr minus 10320, grown 4 more half-years; interest = total paid - 2 lakh.","yr":2023,"y":"CAT 2023 · Slot 2","l":4,"x":"Use $4\\%$ per half-year. After 1 year: $200000 \\times 1.0816 = 216320$; less $10320$ leaves $206000$.\nTwo more years (4 half-years): $206000 \\times 1.04^4 \\approx 206000 \\times 1.16986 \\approx 240991$.\nTotal paid $\\approx 10320 + 240991 = 251311$.\nInterest $= 251311 - 200000 \\approx 51311$.\nAnswer: 51311","o":["45311","51311","33130","40991"],"ai":1,"a":"51311"},{"n":57,"c":"SICI","f":"SICI-I4","t":"T","s":"Amal invests Rs 12000 at 8% interest, compounded annually, and Rs 10000 at 6% interest, compounded semi-annually, both investments being for one year. Bimal invests his money at 7.5% simple interest for one year. If Amal and Bimal get the same amount of interest, then the amount, in Rupees, invested by Bimal is","h":"Amal earns 960 + 10000(1.03^2 - 1); divide the total by 0.075.","yr":2019,"y":"CAT 2019 · Slot 2","l":2,"x":"Amal: $8\\%$ of $12000 = 960$; semi-annual $3\\%$ twice: $10000(1.03^2 - 1) = 609$.\nTotal interest $= 1569$.\nBimal: $0.075B = 1569$, so $B = 20920$.\nAnswer: 20920","a":"20920"},{"n":58,"c":"SICI","f":"SICI-I4","t":"T","s":"Veeru invested Rs 10000 at 5% simple annual interest, and exactly after two years, Joy invested Rs 8000 at 10% simple annual interest. How many years after Veeru’s investment, will their balances, i.e., principal plus accumulated interest, be equal?","h":"Equate 10000(1+0.05t) with 8000(1+0.1(t-2)).","yr":2020,"y":"CAT 2020 · Slot 1","l":1,"x":"Let $t$ = years after Veeru invests; Joy has invested for $t - 2$ years.\n$10000 + 500t = 8000 + 800(t - 2)$.\n$10000 + 500t = 6400 + 800t$, so $300t = 3600$, so $t = 12$.\nAnswer: 12","a":"12"},{"n":59,"c":"SICI","f":"SICI-I4","t":"M","s":"Bank A offers 6% interest rate per annum compounded half yearly. Bank B and Bank C offer simple interest but the annual interest rate offered by Bank C is twice that of Bank B. Raju invests a certain amount in Bank B for a certain period and Rupa invests Rs. 10,000 in Bank C for twice that period. The interest that would accrue to Raju during that period is equal to the interest that would have accrued had he invested the same amount in Bank A for one year. The interest accrued, in INR, to Rupa is","h":"Raju's rB*t equals 6.09% (Bank A one year); Rupa earns 2rB*2t = 4 times that on 10000.","yr":2021,"y":"CAT 2021 · Slot 3","l":3,"x":"Bank A for one year: $1.03^2 - 1 = 6.09\\%$. So Raju’s rate $\\times$ time $= 6.09\\%$.\nRupa: double the rate for double the time, so rate $\\times$ time $= 4 \\times 6.09\\% = 24.36\\%$.\nInterest $= 24.36\\%$ of $10000 = 2436$.\nAnswer: 2436","o":["2436","3436","2346","1436"],"ai":0,"a":"2436"},{"n":60,"c":"SICI","f":"SICI-I4","t":"M","s":"Anil invests Rs 22000 for 6 years in a scheme with 4% interest per annum, compounded half-yearly. Separately, Sunil invests a certain amount in the same scheme for 5 years, and then reinvests the entire amount he receives at the end of 5 years, for one year at 10% simple interest. If the amounts received by both at the end of 6 years are equal, then the initial investment, in rupees, made by Sunil is","h":"Equate 22000(1.02)^12 with S(1.02)^10 x 1.1 and cancel (1.02)^10.","yr":2024,"y":"CAT 2024 · Slot 2","l":3,"x":"Half-yearly at $4\\%$: $2\\%$ per period. Anil: $22000(1.02)^{12}$; Sunil: $S(1.02)^{10} \\times 1.1$.\nCancel $(1.02)^{10}$: $22000 \\times 1.0404 = 1.1S$.\n$S = 20000 \\times 1.0404 = 20808$.\nAnswer: 20808","o":["20860","20640","20480","20808"],"ai":3,"a":"20808"},{"n":61,"c":"RAT","f":"RAT-R1","t":"M","s":"Suppose, C1, C2, C3, C4, and C5 are five companies. The profits made by C1, C2, and C3 are in the ratio 9 : 10 : 8 while the profits made by C2, C4, and C5 are in the ratio 18 : 19 : 20. If C5 has made a profit of Rs 19 crore more than C1, then the total profit (in Rs) made by all five companies is","h":"Make C2 common (90): C1..C5 = 81, 90, 72, 95, 100; C5 - C1 is 19 parts.","yr":2017,"y":"CAT 2017 · Slot 1","l":3,"x":"Make C2 common: $C1:C2:C3=9:10:8=81:90:72$ and $C2:C4:C5=18:19:20=90:95:100$.\nC5 $-$ C1 $=100-81=19$ parts $=19$ crore, so 1 part $=1$ crore.\nTotal $=81+90+72+95+100=438$ crore.\nAnswer: 438 crore","o":["438 crore","435 crore","348 crore","345 crore"],"ai":0,"a":"438 crore"},{"n":62,"c":"RAT","f":"RAT-R1","t":"M","s":"A stall sells popcorn and chips in packets of three sizes: large, super, and jumbo. The numbers of large, super, and jumbo packets in its stock are in the ratio 7 : 17 : 16 for popcorn and 6 : 15 : 14 for chips. If the total number of popcorn packets in its stock is the same as that of chips packets, then the numbers of jumbo popcorn packets and jumbo chips packets are in the ratio","h":"Equalise totals 40x = 35y, then compare jumbo counts 16x and 14y.","yr":2017,"y":"CAT 2017 · Slot 1","l":2,"x":"Popcorn total $=40x$ (7+17+16), chips total $=35y$ (6+15+14).\nEqual totals: $40x=35y$, so $y=\\frac{8x}{7}$.\nJumbo popcorn $=16x$; jumbo chips $=14y=14\\times\\frac{8x}{7}=16x$.\nRatio $=1:1$.\nAnswer: 1 : 1","o":["1 : 1","8 : 7","4 : 3","6 : 5"],"ai":0,"a":"1 : 1"},{"n":63,"c":"RAT","f":"RAT-R1","t":"M","s":"If a, b, c are three positive integers such that a and b are in the ratio 3 : 4 while b and c are in the ratio 2 : 1, then which one of the following is a possible value of (a + b + c)?","h":"Combine to a:b:c = 3:4:2, so the sum must be a multiple of 9.","yr":2017,"y":"CAT 2017 · Slot 2","l":2,"x":"$a:b=3:4$ and $b:c=2:1=4:2$, so $a:b:c=3:4:2$.\nWith $a=3t$, $b=4t$, $c=2t$ ($t$ a positive integer), the sum is $9t$.\nAmong the options only $207=9\\times23$ is a multiple of 9.\nAnswer: 207","o":["201","205","207","210"],"ai":2,"a":"207"},{"n":64,"c":"RAT","f":"RAT-R1","t":"M","s":"Raju and Lalitha originally had marbles in the ratio 4 : 9. Then Lalitha gave some of her marbles to Raju. As a result, the ratio of the number of marbles with Raju to that with Lalitha became 5 : 6. What fraction of her original number of marbles was given by Lalitha to Raju?","h":"With 4k and 9k, solve (4k+t)/(9k-t) = 5/6 for t, then t/9k.","yr":2018,"y":"CAT 2018 · Slot 1","l":2,"x":"Raju $4k$, Lalitha $9k$; Lalitha gives $t$.\n$\\frac{4k+t}{9k-t}=\\frac{5}{6}$: $24k+6t=45k-5t$, so $t=\\frac{21k}{11}$.\nFraction given $=\\frac{t}{9k}=\\frac{21}{99}=\\frac{7}{33}$.\nAnswer: 7/33","o":["1/4","1/5","6/19","7/33"],"ai":3,"a":"7/33"},{"n":65,"c":"RAT","f":"RAT-R1","t":"M","s":"The scores of Amal and Bimal in an examination are in the ratio 11 : 14. After an appeal, their scores increase by the same amount and their new scores are in the ratio 47 : 56. The ratio of Bimal’s new score to that of his original score is","h":"Equal increase x: cross-multiply (11k+x)/(14k+x) = 47/56 to get x in terms of k.","yr":2018,"y":"CAT 2018 · Slot 2","l":2,"x":"Scores $11k,14k$, both increase by $x$.\n$\\frac{11k+x}{14k+x}=\\frac{47}{56}$: $616k+56x=658k+47x$, so $x=\\frac{14k}{3}$.\nBimal: new $14k+\\frac{14k}{3}=\\frac{56k}{3}$; new : old $=\\frac{56}{42}=4:3$.\nAnswer: 4 : 3","o":["3 : 2","4 : 3","5 : 4","8 : 5"],"ai":1,"a":"4 : 3"},{"n":66,"c":"RAT","f":"RAT-R1","t":"M","s":"The salaries of Ramesh, Ganesh and Rajesh were in the ratio 6:5:7 in 2010, and in the ratio 3:4:3 in 2015. If Ramesh’s salary increased by 25% during 2010-2015, then the percentage increase in Rajesh’s salary during this period is closest to","h":"Fix the 2015 scale from Ramesh (6 to 7.5), then compare Rajesh 7 with 2015 value.","yr":2019,"y":"CAT 2019 · Slot 2","l":3,"x":"2010 salaries $6:5:7$; Ramesh rises $25\\%$, from 6 to $7.5$.\nIn 2015 Ramesh and Rajesh are equal ($3:4:3$), so Rajesh $=7.5$.\nRajesh: 7 to 7.5, increase $=\\frac{0.5}{7}\\approx7.1\\%$, closest to 7.\nAnswer: 7","o":["8","10","7","9"],"ai":2,"a":"7"},{"n":67,"c":"RAT","f":"RAT-R1","t":"M","s":"In an examination, Rama’s score was one-twelfth of the sum of the scores of Mohan and Anjali. After a review, the score of each of them increased by 6. The revised scores of Anjali, Mohan, and Rama were in the ratio 11 : 10 : 3. Then Anjali’s score exceeded Rama’s score by","h":"Write revised scores 11k, 10k, 3k; subtract 6 and impose 12R = M + A.","yr":2019,"y":"CAT 2019 · Slot 2","l":3,"x":"Revised scores $11k,10k,3k$; originals are each 6 less.\n$12(3k-6)=(10k-6)+(11k-6)$: $36k-72=21k-12$, so $k=4$.\nAnjali 44, Rama 12 after review; the gap is the same before and after.\nDifference $=32$.\nAnswer: 32","o":["26","32","24","35"],"ai":1,"a":"32"},{"n":68,"c":"RAT","f":"RAT-R1","t":"M","s":"The amount Neeta and Geeta together earn in a day equals what Sita alone earns in 6 days. The amount Sita and Neeta together earn in a day equals what Geeta alone earns in 2 days. The ratio of the daily earnings of the one who earns the most to that of the one who earns the least is","h":"Set Sita = 1 and solve N + G = 6, S + N = 2G.","yr":2021,"y":"CAT 2021 · Slot 1","l":2,"x":"Take Sita’s daily earning $S=1$.\n$N+G=6$ and $1+N=2G$. Substituting $N=2G-1$: $3G=7$, $G=\\frac{7}{3}$, $N=\\frac{11}{3}$.\nHighest is Neeta $\\frac{11}{3}$, lowest Sita 1.\nRatio $=11:3$.\nAnswer: 11 : 3","o":["7 : 3","11 : 3","11 : 7","3 : 2"],"ai":1,"a":"11 : 3"},{"n":69,"c":"RAT","f":"RAT-R1","t":"T","s":"In a village, the ratio of number of males to females is 5 : 4. The ratio of number of literate males to literate females is 2 : 3. The ratio of the number of illiterate males to illiterate females is 4 : 3. If 3600 males in the village are literate, then the total number of females in the village is","h":"Literate females = 5400; let illiterate be 4t, 3t and impose total M:F = 5:4.","yr":2022,"y":"CAT 2022 · Slot 1","l":3,"x":"Literate males 3600, so literate females $=3600\\times\\frac{3}{2}=5400$.\nIlliterate males $4t$, females $3t$.\n$\\frac{3600+4t}{5400+3t}=\\frac{5}{4}$: $14400+16t=27000+15t$, $t=12600$.\nFemales $=5400+3\\times12600=43200$.\nAnswer: 43200","a":"43200"},{"n":70,"c":"RAT","f":"RAT-R1","t":"T","s":"A fruit seller has a total of 187 fruits consisting of apples, mangoes and oranges. The number of apples and mangoes are in the ratio 5 : 2. After she sells 75 apples, 26 mangoes and half of the oranges, the ratio of number of unsold apples to number of unsold oranges becomes 3 : 2. The total number of unsold fruits is","h":"Write apples 5k, mangoes 2k, oranges 187-7k and impose (5k-75) : (oranges/2) = 3 : 2.","yr":2024,"y":"CAT 2024 · Slot 1","l":3,"x":"Apples $5k$, mangoes $2k$, oranges $187-7k$.\n$\\frac{5k-75}{(187-7k)/2}=\\frac{3}{2}$: $4(5k-75)=3(187-7k)$, $41k=861$, $k=21$.\nApples 105, mangoes 42, oranges 40.\nUnsold: $30+16+20=66$.\nAnswer: 66","a":"66"},{"n":71,"c":"RAT","f":"RAT-R1","t":"M","s":"Rajesh and Vimal own 20 hectares and 30 hectares of agricultural land, respectively, which are entirely covered by wheat and mustard crops. The cultivation area of wheat and mustard in the land owned by Vimal are in the ratio of 5 : 3. If the total cultivation area of wheat and mustard are in the ratio 11 : 9, then the ratio of cultivation area of wheat and mustard in the land owned by Rajesh is","h":"Total wheat 27.5 and Vimal wheat 18.75; subtract to get Rajesh's split.","yr":2024,"y":"CAT 2024 · Slot 3","l":3,"x":"Total land 50 ha, wheat $:$ mustard $=11:9$, so wheat $=27.5$.\nVimal’s wheat $=\\frac{5}{8}\\times30=18.75$.\nRajesh: wheat $=8.75$, mustard $=20-8.75=11.25$.\nRatio $=8.75:11.25=7:9$.\nAnswer: 7 : 9","o":["1 : 1","7 : 9","4 : 3","3 : 7"],"ai":1,"a":"7 : 9"},{"n":72,"c":"RAT","f":"RAT-R2","t":"M","s":"Amala, Bina, and Gouri invest money in the ratio 3 : 4 : 5 in fixed deposits having respective annual interest rates in the ratio 6 : 5 : 4. What is their total interest income (in Rs) after a year, if Bina’s interest income exceeds Amala’s by Rs 250?","h":"Interest ∝ amount x rate: 18 : 20 : 20; 2 parts = 250.","yr":2019,"y":"CAT 2019 · Slot 1","l":2,"x":"Interest $=$ amount $\\times$ rate: $3\\times6:4\\times5:5\\times4=18:20:20$.\nBina minus Amala $=2$ parts $=250$, so 1 part $=125$.\nTotal $=58\\times125=7250$.\nAnswer: 7250","o":["7000","6000","6350","7250"],"ai":3,"a":"7250"},{"n":73,"c":"RAT","f":"RAT-R2","t":"T","s":"A sum of money is split among Amal, Sunil and Mita so that the ratio of the shares of Amal and Sunil is 3 : 2, while the ratio of the shares of Sunil and Mita is 4 : 5. If the difference between the largest and the smallest of these three shares is Rs 400, then Sunil’s share, in rupees, is","h":"Chain to A:S:M = 12:8:10; largest minus smallest is 4 parts.","yr":2020,"y":"CAT 2020 · Slot 2","l":2,"x":"$A:S=3:2=12:8$ and $S:M=4:5=8:10$, so $A:S:M=12:8:10$.\nLargest minus smallest $=12-8=4$ parts $=400$, 1 part $=100$.\nSunil $=8\\times100=800$.\nAnswer: 800","a":"800"},{"n":74,"c":"RAT","f":"RAT-R2","t":"M","s":"Anil, Bobby and Chintu jointly invest in a business and agree to share the overall profit in proportion to their investments. Anil’s share of investment is 70%. His share of profit decreases by Rs. 420 if the overall profit goes down from 18% to 15%. Chintu’s share of profit increases by Rs. 80 if the overall profit goes up from 15% to 17%. The amount, in INR, invested by Bobby is","h":"A 3-point profit drop on 70% gives 420, so total capital; Chintu from 2 points = 80.","yr":2021,"y":"CAT 2021 · Slot 2","l":4,"x":"Let total investment be $C$. Anil’s $0.7C$ loses 3 percentage points: $0.7C\\times0.03=420$, so $C=20000$.\nChintu gains 2 points: $c\\times0.02=80$, so $c=4000$.\nBobby $=20000-14000-4000=2000$.\nAnswer: 2000","o":["2400","2200","2000","1800"],"ai":2,"a":"2000"},{"n":75,"c":"RAT","f":"RAT-R3","t":"M","s":"One part of a hostel’s monthly expenses is fixed, and the other part is proportional to the number of its boarders. The hostel collects Rs. 1600 per month from each boarder. When the number of boarders is 50, the profit of the hostel is Rs. 200 per boarder, and when the number of boarders is 75, the profit of the hostel is Rs. 250 per boarder. When the number of boarders is 80, the total profit of the hostel, in INR, will be","h":"Expense per boarder = F/n + v; two data points give F and v.","yr":2021,"y":"CAT 2021 · Slot 3","l":3,"x":"Expense $=F+vn$; expense per boarder $=1600-$ profit per boarder.\n$n=50$: expense $=1400\\times50=70000$. $n=75$: $1350\\times75=101250$.\nSo $25v=31250$, $v=1250$, $F=70000-62500=7500$.\n$n=80$: profit $=80\\times1600-(7500+80\\times1250)=128000-107500=20500$.\nAnswer: 20500","o":["20800","20200","20500","20000"],"ai":2,"a":"20500"},{"n":76,"c":"RAT","f":"RAT-R3","t":"M","s":"The price of a precious stone is directly proportional to the square of its weight. Sita has a precious stone weighing 18 units. If she breaks it into four pieces with each piece having distinct integer weight, then the difference between the highest and lowest possible values of the total price of the four pieces will be 288000. Then, the price of the original precious stone is","h":"Price = k w^2; find max and min sums of squares of 4 distinct parts of 18.","yr":2023,"y":"CAT 2023 · Slot 2","l":4,"x":"Price $=kw^2$; compare sums of squares of four distinct parts of 18.\nMaximum: most unequal, $1,2,3,12$: $1+4+9+144=158$.\nMinimum: most equal, $3,4,5,6$: $9+16+25+36=86$.\n$k(158-86)=72k=288000$, $k=4000$.\nOriginal price $=4000\\times18^2=1296000$.\nAnswer: 1296000","o":["1296000","1944000","972000","1620000"],"ai":0,"a":"1296000"},{"n":77,"c":"RAT","f":"RAT-R4","t":"T","s":"Pinky is standing in a queue at a ticket counter. Suppose the ratio of the number of persons standing ahead of Pinky to the number of persons standing behind her in the queue is 3 : 5. If the total number of persons in the queue is less than 300, then the maximum possible number of persons standing ahead of Pinky is","h":"Queue = 3k + 5k + 1 (Pinky) < 300; take the largest k.","yr":2022,"y":"CAT 2022 · Slot 1","l":2,"x":"Ahead $3k$, behind $5k$, plus Pinky: queue $=8k+1<300$.\n$k\\le37$ (since $8\\times37+1=297$).\nMaximum ahead $=3\\times37=111$.\nAnswer: 111","a":"111"},{"n":78,"c":"RAT","f":"RAT-R4","t":"M","s":"When Rajesh’s age was same as the present age of Garima, the ratio of their ages was 3 : 2. When Garima’s age becomes the same as the present age of Rajesh, the ratio of the ages of Rajesh and Garima will become","h":"Age gap d is constant: G/(G-d) = 3/2 gives G = 3d, R = 4d; move both forward by d.","yr":2024,"y":"CAT 2024 · Slot 2","l":3,"x":"Let the age gap be $d$ (Rajesh older).\n$d$ years ago Rajesh was $G$ and Garima $G-d$: $\\frac{G}{G-d}=\\frac{3}{2}$, so $G=3d$, $R=4d$.\n$d$ years later: Rajesh $5d$, Garima $4d$.\nRatio $=5:4$.\nAnswer: 5 : 4","o":["4 : 3","2 : 1","3 : 2","5 : 4"],"ai":3,"a":"5 : 4"},{"n":79,"c":"AVG","f":"AVG-A1","t":"M","s":"The average height of 22 toddlers increases by 2 inches when two of them leave this group. If the average height of these two toddlers is one-third the average height of the original 22, then the average height, in inches, of the remaining 20 toddlers is","h":"Let original average A: 22A - 2(A/3) = 20(A + 2).","yr":2017,"y":"CAT 2017 · Slot 2","l":3,"x":"Let the original average be $A$: total $22A$; the two leaving total $\\frac{2A}{3}$.\n$22A-\\frac{2A}{3}=20(A+2)$.\n$\\frac{64A}{3}-20A=40$, so $\\frac{4A}{3}=40$, $A=30$.\nRemaining average $=32$.\nAnswer: 32","o":["30","28","32","26"],"ai":2,"a":"32"},{"n":80,"c":"AVG","f":"AVG-A1","t":"M","s":"The average weight of students in a class increases by 600 gm when some new students join the class. If the average weight of the new students is 3 kg more than the average weight of the original students, then the ratio of the number of original students to the number of new students is","h":"Rise in average = 3 x (new share of count) = 0.6.","yr":2022,"y":"CAT 2022 · Slot 1","l":2,"x":"Let $n$ original students average $w$, $m$ new ones average $w+3$.\nNew average $=w+\\frac{3m}{n+m}$, and this must be $w+0.6$.\n$\\frac{m}{n+m}=\\frac{1}{5}$, so $n:m=4:1$.\nAnswer: 4 : 1","o":["1 : 2","3 : 1","1 : 4","4 : 1"],"ai":3,"a":"4 : 1"},{"n":81,"c":"AVG","f":"AVG-A1","t":"M","s":"Manu earns Rs. 4000 per month and wants to save an average of Rs. 550 per month in a year. In the first nine months, his monthly expense was Rs. 3500, and he foresees that, tenth month onward, his monthly expense will increase to Rs. 3700. In order to meet his yearly savings target, his monthly earnings, in rupees, from the tenth month onward should be","h":"Find total savings target, subtract nine months' savings, spread the shortfall over 3 months.","yr":2022,"y":"CAT 2022 · Slot 2","l":2,"x":"Yearly target $=12\\times550=$ Rs. $6600$.\nFirst 9 months save $4000-3500=500$ each: Rs. $4500$.\nLast 3 months must save Rs. $2100$, i.e. Rs. $700$ a month.\nEarnings $=3700+700=$ Rs. $4400$.\nAnswer: 4400","o":["4200","4400","4300","4350"],"ai":1,"a":"4400"},{"n":82,"c":"AVG","f":"AVG-A1","t":"M","s":"There are three persons A, B and C in a room. If a person D joins the room, the average weight of the persons in the room reduces by x kg. Instead of D, if person E joins the room, the average weight of the persons in the room increases by 2x kg. If the weight of E is 12 kg more than that of D, then the value of x is","h":"Express D = a - 4x and E = a + 8x with a the average of A, B, C.","yr":2023,"y":"CAT 2023 · Slot 3","l":3,"x":"Let $a$ be the average of A, B, C (total $3a$).\nWith D: $3a+D=4(a-x)$, so $D=a-4x$. With E: $E=a+8x$.\n$E-D=12x=12$, so $x=1$.\nAnswer: 1","o":["1.5","2","0.5","1"],"ai":3,"a":"1"},{"n":83,"c":"AVG","f":"AVG-A2","t":"M","s":"A class consists of 20 boys and 30 girls. In the mid-semester examination, the average score of the girls was 5 higher than that of the boys. In the final exam, however, the average score of the girls dropped by 3 while the average score of the entire class increased by 2. The increase in the average score of the boys is","h":"Measure all averages from the boys' mid-sem b; class rise of 2 gives 20(y) + 30(2) = 50 x 5.","yr":2017,"y":"CAT 2017 · Slot 1","l":3,"x":"Let boys average $b$ in the mid-sem; girls $b+5$. Class total $=50b+150$.\nFinal: boys $b+k$, girls $b+2$. Class total $=50b+20k+60$.\nIncrease in class total $=50\\times2=100$: $20k+60-150=100$.\n$k=\\frac{190}{20}=9.5$.\nAnswer: 9.5","o":["9.5","10","4.5","6"],"ai":0,"a":"9.5"},{"n":84,"c":"AVG","f":"AVG-A2","t":"M","s":"Onion is sold for 5 consecutive months at the rate of Rs 10, 20, 25, 25, and 50 per kg, respectively. A family spends a fixed amount of money on onion for each of the first three months, and then spends half that amount on onion for each of the next two months. The average expense for onion, in rupees per kg, for the family over these 5 months is closest to","h":"Average rate = total money / total kg; amounts are S, S, S, S/2, S/2.","yr":2021,"y":"CAT 2021 · Slot 1","l":3,"x":"Average price $=$ total spent $\\div$ total kg. Let the monthly spend be Rs. $E$ for months 1–3 and $\\frac{E}{2}$ for months 4–5.\nKg bought $=E\\left(\\frac{1}{10}+\\frac{1}{20}+\\frac{1}{25}+\\frac{1}{50}+\\frac{1}{100}\\right)=0.22E$.\nTotal spent $=4E$.\nAverage $=\\frac{4}{0.22}\\approx18.2$, closest to $18$.\nAnswer: 18","o":["18","26","16","20"],"ai":0,"a":"18"},{"n":85,"c":"AVG","f":"AVG-A2","t":"T","s":"In an examination, the average marks of students in sections A and B are 32 and 60, respectively. The number of students in section A is 10 less than that in section B. If the average marks of all the students across both the sections combined is an integer, then the difference between the maximum and minimum possible number of students in section A is","h":"Combined average = 46 + 70/(n + 5); n + 5 must divide 70.","yr":2022,"y":"CAT 2022 · Slot 3","l":4,"x":"A has $n$, B has $n+10$. Combined average $=\\frac{32n+60(n+10)}{2n+10}=\\frac{46n+300}{n+5}=46+\\frac{70}{n+5}$.\nInteger when $n+5$ divides $70$, with $n+5\\ge6$: $7,10,14,35,70$.\n$n=2,5,9,30,65$.\nDifference $=65-2=63$.\nAnswer: 63","a":"63"},{"n":86,"c":"AVG","f":"AVG-A2","t":"M","s":"In a company, 20% of the employees work in the manufacturing department. If the total salary obtained by all the manufacturing employees is one-sixth of the total salary obtained by all the employees in the company, then the ratio of the average salary obtained by the manufacturing employees to the average salary obtained by the non-manufacturing employees is","h":"Salary share 1/6 from 20% people: compare 0.2m against 0.8o.","yr":2023,"y":"CAT 2023 · Slot 2","l":2,"x":"Average $=$ share of salary $\\div$ share of people.\nManufacturing: $\\frac{1}{6}\\div\\frac{1}{5}=\\frac{5}{6}$; others: $\\frac{5}{6}\\div\\frac{4}{5}=\\frac{25}{24}$.\nRatio $=\\frac{5}{6}:\\frac{25}{24}=20:25=4:5$.\nAnswer: 4 : 5","o":["4 : 5","5 : 6","5 : 4","6 : 5"],"ai":0,"a":"4 : 5"},{"n":87,"c":"AVG","f":"AVG-A3","t":"T","s":"An elevator has a weight limit of 630 kg. It is carrying a group of people of whom the heaviest weighs 57 kg and the lightest weighs 53 kg. What is the maximum possible number of people in the group?","h":"Fix heaviest 57 and lightest 53; everyone else at least 53.","yr":2017,"y":"CAT 2017 · Slot 1","l":2,"x":"To fit the most people, everyone except the heaviest should be as light as possible, i.e. $53$ kg.\n$57+53(n-1)\\le630$ gives $53(n-1)\\le573$, $n-1\\le10.8$.\nSo $n=11$.\nAnswer: 11","a":"11"},{"n":88,"c":"AVG","f":"AVG-A3","t":"M","s":"In an apartment complex, the number of people aged 51 years and above is 30 and there are at most 39 people whose ages are below 51 years. The average age of all the people in the apartment complex is 38 years. What is the largest possible average age, in years, of the people whose ages are below 51 years?","h":"Push the 30 seniors down to exactly 51 and use the maximum number (39) of juniors.","yr":2018,"y":"CAT 2018 · Slot 1","l":3,"x":"With $n$ people below 51, total age $=38(30+n)$; the 30 older people total at least $30\\times51=1530$.\nSo the younger group’s total is at most $38n-390$, average at most $38-\\frac{390}{n}$.\nThis grows with $n$; take $n=39$: $38-10=28$.\nAnswer: 28","o":["25","26","27","28"],"ai":3,"a":"28"},{"n":89,"c":"AVG","f":"AVG-A3","t":"M","s":"The average of 30 integers is 5. Among these 30 integers, there are exactly 20 which do not exceed 5. What is the highest possible value of the average of these 20 integers?","h":"Other 10 integers exceed 5 so are at least 6; the 20 get at most 150 - 60.","yr":2019,"y":"CAT 2019 · Slot 2","l":2,"x":"Total $=30\\times5=150$.\nThe other 10 integers exceed $5$, so each is at least $6$: total at least $60$.\nThe 20 numbers total at most $90$, average at most $4.5$.\nAnswer: 4.5","o":["3.5","5","4.5","4"],"ai":2,"a":"4.5"},{"n":90,"c":"AVG","f":"AVG-A3","t":"M","s":"In a group of 10 students, the mean of the lowest 9 scores is 42 while the mean of the highest 9 scores is 47. For the entire group of 10 students, the maximum possible mean exceeds the minimum possible mean by","h":"Total = 378 + highest = 423 + lowest; bound the lowest using the middle 8 scores.","yr":2020,"y":"CAT 2020 · Slot 2","l":3,"x":"Lowest 9 total $378$, highest 9 total $423$, so top $-$ bottom $=45$ and total $T=423+x_1$ ($x_1$ the lowest).\nThe middle 8 total $378-x_1$ and lie between $x_1$ and $x_1+45$: $8x_1\\le378-x_1\\le8x_1+360$.\nSo $2\\le x_1\\le42$, giving $T$ from $425$ to $465$.\nMeans range $42.5$ to $46.5$: difference $4$.\nAnswer: 4","o":["5","3","4","6"],"ai":2,"a":"4"},{"n":91,"c":"AVG","f":"AVG-A3","t":"M","s":"A batsman played n + 2 innings and got out on all occasions. His average score in these n + 2 innings was 29 runs and he scored 38 and 15 runs in the last two innings. The batsman scored less than 38 runs in each of t
